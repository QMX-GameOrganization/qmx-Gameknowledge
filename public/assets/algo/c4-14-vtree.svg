<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">虚树：只保留关键点和它们的 LCA</title><desc id="desc">关键点 {6, 8, 9, 11}（橙色）；补上相邻关键点的 LCA（绿色）；其余点被压缩掉（灰色）。。虚树点数不超过 2k - 1；虚树边上标的是它在原树里对应的路径长度（边数）。</desc>
