<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">有向无环图上的游戏：SG(u) = mex{ SG(v) | u→v }</title><desc id="desc">棋子在点上，沿边走，无路可走的一方输。SG = 0 是必败点。。mex：集合里没出现过的最小非负整数。终点没有后继，mex{} = 0。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="480" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">有向无环图上的游戏：SG(u) = mex{ SG(v) | u→v }</text>
<text x="32" y="77" font-size="17" fill="#495b73">棋子在点上，沿边走，无路可走的一方输。SG = 0 是必败点。</text>
<path d="M211 211L385 160" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M210 230L386 289" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M452 150L624 150" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M447 283L629 169" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M452 300L624 300" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<circle cx="180" cy="220" r="30" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="180" y="226" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">v0</text>
<text x="180" y="278" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">SG=0</text>
<circle cx="420" cy="150" r="30" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="420" y="156" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">v1</text>
<text x="420" y="208" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">SG=1</text>
<circle cx="420" cy="300" r="30" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="420" y="306" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">v2</text>
<text x="420" y="358" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">SG=1</text>
<circle cx="660" cy="150" r="30" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="660" y="156" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">v3</text>
<text x="660" y="208" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">SG=0</text>
<circle cx="660" cy="300" r="30" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="660" y="306" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">v4</text>
<text x="660" y="358" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">SG=0</text>
<text x="40" y="400" font-size="16" fill="#23364e">v3、v4 无后继：SG = 0。 v1 → v3，mex{0} = 1。 v2 → v3、v4，mex{0, 0} = 1。</text>
<text x="40" y="430" font-size="16" fill="#23364e">v0 → v1、v2，后继 SG 是 {1, 1}，mex = 0，所以起点 v0 是必败点。</text>
<text x="32" y="460" font-size="16" fill="#495b73">mex：集合里没出现过的最小非负整数。终点没有后继，mex{} = 0。</text>
</g></svg>