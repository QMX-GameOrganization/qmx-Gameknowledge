<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">AVL 失衡的四种情形</title><desc id="desc">先找最低的失衡结点（红色），再看重的一侧和重孙在哪边：LL、RR、LR、RL。。单旋解决 LL 和 RR，双旋解决 LR 和 RL；每次插入最多修复一处，删除可能沿路径多处修复。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="640" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">AVL 失衡的四种情形</text>
<text x="32" y="77" font-size="17" fill="#495b73">先找最低的失衡结点（红色），再看重的一侧和重孙在哪边：LL、RR、LR、RL。</text>
