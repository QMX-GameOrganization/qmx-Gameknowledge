<text x="95" y="245.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<circle cx="55" cy="290" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="55" y="295.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<line x1="395" y1="240" x2="355" y2="290" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
