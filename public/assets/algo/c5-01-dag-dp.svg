<rect x="266.5" y="287.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="277.5" y="303.0" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">6</text>
<path d="M232.0 370.0L335.0 370.0" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<rect x="266.5" y="359.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="277.5" y="375.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<path d="M378.7 221.5L468.7 276.9" fill="none" stroke="#176951" stroke-width="4" marker-end="url(#m176951)"/>
<rect x="407.5" y="235.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="418.5" y="251.0" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">2</text>
<path d="M378.7 358.5L468.7 303.1" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<rect x="407.5" y="323.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="418.5" y="339.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">4</text>
<circle cx="70" cy="260" r="22" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="70" y="266.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="210" cy="150" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="210" y="156.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<circle cx="210" cy="370" r="22" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="210" y="376.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<circle cx="360" cy="210" r="22" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="360" y="216.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<circle cx="360" cy="370" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="360" y="376.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<circle cx="490" cy="290" r="22" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="490" y="296.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">6</text>
<text x="70" y="304" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">dp=0</text>
<text x="210" y="114" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">dp=3</text>
<text x="210" y="414" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">dp=2</text>
<text x="360" y="174" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">dp=8</text>
<text x="360" y="414" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">dp=5</text>
<text x="490" y="334" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">dp=10</text>
<rect x="590" y="105" width="378" height="380" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="606" y="137" font-size="17" fill="#495b73" font-weight="700">按拓扑序 1,2,3,4,5,6 计算</text>
<text x="606" y="175" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[1] = 0(没有前驱)</text>
<text x="606" y="207" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[2] = dp[1] + 3 = 3</text>
<text x="606" y="239" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[3] = dp[1] + 2 = 2</text>
<text x="606" y="271" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[4] = max(dp[2] + 4, dp[3] + 6)</text>
<text x="662" y="303" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">= max(7, 8) = 8</text>
<text x="606" y="335" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[5] = dp[3] + 3 = 5</text>
<text x="606" y="367" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[6] = max(dp[4] + 2, dp[5] + 4)</text>
<text x="662" y="399" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">= max(10, 9) = 10</text>
<text x="606" y="455" font-size="14" fill="#495b73">拓扑序保证:算 dp[v] 时所有前驱都已算完</text>
<text x="32" y="520" font-size="16" fill="#495b73">绿色粗线是一条最长路径 1→3→4→6,长度 10。</text>
</g></svg>