<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">DAG 上的最长路:按拓扑序递推</title><desc id="desc">dp[v] = max(dp[u] + w),u 是 v 的前驱;每个 dp[u] 在使用时已经定型。。绿色粗线是一条最长路径 1→3→4→6,长度 10。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker><marker id="m176951" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#176951"/></marker></defs>
<rect width="1000" height="540" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">DAG 上的最长路:按拓扑序递推</text>
<text x="32" y="77" font-size="17" fill="#495b73">dp[v] = max(dp[u] + w),u 是 v 的前驱;每个 dp[u] 在使用时已经定型。</text>
