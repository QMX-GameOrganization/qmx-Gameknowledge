<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">滚动数组:一维 dp 代替二维表</title><desc id="desc">处理第 i 行时,dp[j] 在被覆盖之前存的是上一行的值。。g = {{1,3,1},{1,5,1},{4,2,1}},下面演示处理第 1 行(g 的值为 1 5 1)。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="600" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">滚动数组:一维 dp 代替二维表</text>
<text x="32" y="77" font-size="17" fill="#495b73">处理第 i 行时,dp[j] 在被覆盖之前存的是上一行的值。</text>
<text x="40" y="158" font-size="17" fill="#23364e">处理前(上一行的结果)</text>
<rect x="595.0" y="122.0" width="90" height="56" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="640" y="157.7" font-size="22" fill="#23364e" text-anchor="middle">1</text>
<rect x="695.0" y="122.0" width="90" height="56" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="740" y="157.7" font-size="22" fill="#23364e" text-anchor="middle">4</text>
<rect x="795.0" y="122.0" width="90" height="56" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="840" y="157.7" font-size="22" fill="#23364e" text-anchor="middle">5</text>
<path d="M685 182L685 210" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="40" y="250" font-size="17" fill="#23364e" font-weight="700">j=0:dp[0] += 1</text>
<rect x="595.0" y="214.0" width="90" height="56" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="640" y="249.7" font-size="22" fill="#8c5315" font-weight="700" text-anchor="middle">2</text>
<rect x="695.0" y="214.0" width="90" height="56" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="740" y="249.7" font-size="22" fill="#23364e" text-anchor="middle">4</text>
<rect x="795.0" y="214.0" width="90" height="56" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="840" y="249.7" font-size="22" fill="#23364e" text-anchor="middle">5</text>
<path d="M685 274L685 302" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="40" y="342" font-size="17" fill="#23364e" font-weight="700">j=1:dp[1] = min(4, 左边 2) + 5</text>
<rect x="595.0" y="306.0" width="90" height="56" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="640" y="341.7" font-size="22" fill="#23364e" text-anchor="middle">2</text>
<rect x="695.0" y="306.0" width="90" height="56" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="740" y="341.7" font-size="22" fill="#8c5315" font-weight="700" text-anchor="middle">7</text>
<rect x="795.0" y="306.0" width="90" height="56" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="840" y="341.7" font-size="22" fill="#23364e" text-anchor="middle">5</text>
<path d="M685 366L685 394" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="40" y="434" font-size="17" fill="#23364e" font-weight="700">j=2:dp[2] = min(5, 左边 7) + 1</text>
<rect x="595.0" y="398.0" width="90" height="56" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="640" y="433.7" font-size="22" fill="#23364e" text-anchor="middle">2</text>
<rect x="695.0" y="398.0" width="90" height="56" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="740" y="433.7" font-size="22" fill="#23364e" text-anchor="middle">7</text>
<rect x="795.0" y="398.0" width="90" height="56" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="840" y="433.7" font-size="22" fill="#8c5315" font-weight="700" text-anchor="middle">6</text>
<text x="40" y="520" font-size="16" fill="#23364e">同一个数组原地更新:dp[j] 的旧值是「从上方来」,dp[j-1] 的新值是「从左方来」。</text>
<text x="32" y="580" font-size="16" fill="#495b73">g = {{1,3,1},{1,5,1},{4,2,1}},下面演示处理第 1 行(g 的值为 1 5 1)。</text>
</g></svg>