<text x="574" y="142" font-size="19" fill="#285caa" font-weight="700">三种操作对应三个方向</text>
<text x="574" y="170" font-size="15" fill="#23364e">左上 dp[i-1][j-1]:替换(相同则免费)</text>
<text x="574" y="195" font-size="15" fill="#23364e">上方 dp[i-1][j]:删除 s[i-1]</text>
<text x="574" y="220" font-size="15" fill="#23364e">左方 dp[i][j-1]:插入 t[j-1]</text>
<rect x="560" y="292" width="410" height="130" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="574" y="322" font-size="19" fill="#8c5315" font-weight="700">橙色:dp[2][1](ho → r)</text>
<text x="574" y="350" font-size="15" fill="#23364e">o≠r,取 min(dp[1][0], dp[1][1], dp[2][0]) + 1</text>
<text x="574" y="375" font-size="15" fill="#23364e">= min(1, 1, 2) + 1 = 2</text>
<rect x="560" y="440" width="410" height="100" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="574" y="470" font-size="19" fill="#285caa" font-weight="700">蓝色:dp[2][2](ho → ro)</text>
<text x="574" y="498" font-size="15" fill="#23364e">o = o,字符相同,直接继承左上角 dp[1][1] = 1</text>
<text x="32" y="570" font-size="16" fill="#495b73">相同则继承左上角;不同则取三个方向的最小值 + 1,三个方向对应替换、删除、插入。</text>
