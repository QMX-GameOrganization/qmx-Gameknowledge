<rect x="579.0" y="184.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="610" y="212.7" font-size="19" fill="#176951" font-weight="700" text-anchor="middle">1</text>
<rect x="649.0" y="110.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="680" y="138.7" font-size="19" fill="#23364e" text-anchor="middle">9</text>
<rect x="649.0" y="184.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
