<rect x="299" y="262" width="62" height="40" rx="8" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="330.0" y="289" font-size="15" fill="#5b3fa0" font-weight="700" text-anchor="middle">[4]</text>
<rect x="369.0" y="110.0" width="62" height="44" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="400" y="138.7" font-size="19" fill="#23364e" text-anchor="middle">5</text>
<rect x="369.0" y="184.0" width="62" height="44" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="400" y="212.7" font-size="19" fill="#285caa" font-weight="700" text-anchor="middle">2</text>
<rect x="439.0" y="110.0" width="62" height="44" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="470" y="138.7" font-size="19" fill="#23364e" text-anchor="middle">6</text>
<rect x="439.0" y="184.0" width="62" height="44" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="470" y="212.7" font-size="19" fill="#285caa" font-weight="700" text-anchor="middle">2</text>
<rect x="369" y="262" width="132" height="40" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="435.0" y="289" font-size="15" fill="#285caa" font-weight="700" text-anchor="middle">[5,6]</text>
<rect x="509.0" y="110.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
