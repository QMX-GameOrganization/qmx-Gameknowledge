<rect x="719.0" y="184.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="750" y="212.7" font-size="19" fill="#176951" font-weight="700" text-anchor="middle">1</text>
<rect x="789.0" y="110.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="820" y="138.7" font-size="19" fill="#23364e" text-anchor="middle">11</text>
<rect x="789.0" y="184.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="820" y="212.7" font-size="19" fill="#176951" font-weight="700" text-anchor="middle">1</text>
<rect x="859.0" y="110.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="890" y="138.7" font-size="19" fill="#23364e" text-anchor="middle">12</text>
<rect x="859.0" y="184.0" width="62" height="44" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="890" y="212.7" font-size="19" fill="#176951" font-weight="700" text-anchor="middle">1</text>
<rect x="509" y="262" width="412" height="40" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="715.0" y="289" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">[7,12]</text>
<text x="40" y="352" font-size="17" fill="#23364e">l = 5：q = 12 / 5 = 2，r = 12 / 2 = 6，这一段是 [5, 6]。</text>
<text x="40" y="384" font-size="17" fill="#23364e">l = 7：q = 12 / 7 = 1，r = 12 / 1 = 12，这一段是 [7, 12]，直到 n 结束。</text>
<text x="32" y="440" font-size="16" fill="#495b73">对每段 [l, r]：商 q = n / l，右端点 r = n / q。总段数不超过 2√n，所以一次查询 O(√n)。</text>
</g></svg>