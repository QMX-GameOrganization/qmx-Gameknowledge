<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">多重背包的二进制拆分</title><desc id="desc">一种物品有 13 件,拆成 1、2、4、6 四组,当作 4 件 01 背包物品。。任何 0~13 的件数都能由这四组的某个子集凑出,物品数从 13 降到 4;一般是 O(log c)。</desc>
<defs></defs>
<rect width="1000" height="520" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">多重背包的二进制拆分</text>
<text x="32" y="77" font-size="17" fill="#495b73">一种物品有 13 件,拆成 1、2、4、6 四组,当作 4 件 01 背包物品。</text>
<rect x="85.0" y="132.0" width="150" height="56" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="160" y="166.7" font-size="19" fill="#285caa" font-weight="700" text-anchor="middle">一组 1 件</text>
<rect x="285.0" y="132.0" width="150" height="56" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="360" y="166.7" font-size="19" fill="#176951" font-weight="700" text-anchor="middle">一组 2 件</text>
<rect x="485.0" y="132.0" width="150" height="56" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="560" y="166.7" font-size="19" fill="#8c5315" font-weight="700" text-anchor="middle">一组 4 件</text>
<rect x="685.0" y="132.0" width="150" height="56" rx="8" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="760" y="166.7" font-size="19" fill="#5b3fa0" font-weight="700" text-anchor="middle">一组 6 件</text>
<text x="60" y="232" font-size="16" fill="#23364e">拆法:1, 2, 4, ... 依次取,最后剩下的余数 6 单独成组(13 - 1 - 2 - 4 = 6)。</text>
<text x="60" y="278" font-size="17" fill="#176951" font-weight="700">凑出任意件数的例子:</text>
<rect x="85" y="312" width="150" height="56" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="160" y="337" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">5 件</text>
<text x="160" y="360" font-size="15" fill="#495b73" text-anchor="middle">1 + 4</text>
<rect x="285" y="312" width="150" height="56" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="360" y="337" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">7 件</text>
<text x="360" y="360" font-size="15" fill="#495b73" text-anchor="middle">1 + 6</text>
<rect x="485" y="312" width="150" height="56" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="560" y="337" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">11 件</text>
<text x="560" y="360" font-size="15" fill="#495b73" text-anchor="middle">1 + 4 + 6</text>
<rect x="685" y="312" width="150" height="56" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="760" y="337" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">13 件</text>
<text x="760" y="360" font-size="15" fill="#495b73" text-anchor="middle">1 + 2 + 4 + 6</text>
<text x="60" y="430" font-size="16" fill="#a33a3a" font-weight="700">注意:最后一组要取余数 6,不能取 8;取 8 会凑出超过 13 件的情况。</text>
<text x="32" y="500" font-size="16" fill="#495b73">任何 0~13 的件数都能由这四组的某个子集凑出,物品数从 13 降到 4;一般是 O(log c)。</text>
</g></svg>