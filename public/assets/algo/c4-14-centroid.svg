<circle cx="650.0" cy="235" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="650.0" y="240.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<circle cx="760.0" cy="320" r="22" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="760.0" y="325.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">7</text>
<circle cx="870.0" cy="405" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
