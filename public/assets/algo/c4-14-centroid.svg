<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">点分治：每次删掉重心，递归处理剩下的子块</title><desc id="desc">左边是原树，右边是递归过程形成的重心树；颜色代表被选为重心的层数。。每个子块的大小至少减半，所以重心树的深度不超过 log2 n；每一层的总工作量是 O(n)。</desc>
<defs></defs>
