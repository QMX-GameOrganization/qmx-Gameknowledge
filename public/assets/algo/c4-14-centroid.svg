<text x="58" y="646" font-size="14" fill="#495b73">第 1 层重心</text>
<rect x="182" y="632" width="20" height="16" rx="4" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="208" y="646" font-size="14" fill="#495b73">第 2 层重心</text>
<rect x="332" y="632" width="20" height="16" rx="4" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
