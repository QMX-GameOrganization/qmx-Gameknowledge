<rect x="482" y="632" width="20" height="16" rx="4" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="508" y="646" font-size="14" fill="#495b73">第 4 层重心</text>
<text x="32" y="680" font-size="16" fill="#495b73">每个子块的大小至少减半，所以重心树的深度不超过 log2 n；每一层的总工作量是 O(n)。</text>
</g></svg>