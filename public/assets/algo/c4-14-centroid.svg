<text x="32" y="77" font-size="17" fill="#495b73">左边是原树，右边是递归过程形成的重心树；颜色代表被选为重心的层数。</text>
<text x="250" y="112" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">原树</text>
