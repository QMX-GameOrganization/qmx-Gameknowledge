<title id="title">SPFA 的队列变化</title><desc id="desc">只有距离刚变小的点才需要重新入队;一个点可能多次进出队列。。点 2、4、5 各入队两次:第一次拿到的不是最终距离,后来被更短的路改写。</desc>
