<text x="464" y="203" font-size="17" fill="#23364e">S[2][6] 与 S[6][2]：各减一次</text>
<rect x="420" y="227" width="30" height="30" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".6"/>
<text x="464" y="249" font-size="17" fill="#23364e">S[2][2]：被减了两次，加回一次</text>
<text x="420" y="320" font-size="17" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">ans = S[x2][y2] - S[x1-1][y2]</text>
<text x="476" y="350" font-size="17" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">- S[x2][y1-1] + S[x1-1][y1-1]</text>
<text x="420" y="400" font-size="17" fill="#495b73">代入 (3,3)–(6,6)：</text>
<text x="420" y="430" font-size="17" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">S[6][6] - S[2][6] - S[6][2] + S[2][2]</text>
<text x="32" y="540" font-size="16" fill="#495b73">S[i][j] 表示左上角 (1,1) 到 (i,j) 的矩形和，预处理时用同样的容斥。</text>
