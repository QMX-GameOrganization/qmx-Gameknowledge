<text x="935" y="392" font-size="14" fill="#495b73" text-anchor="middle">位置 4</text>
<text x="332" y="262" font-size="34" fill="#495b73" font-weight="700" text-anchor="middle">+</text>
<text x="662" y="262" font-size="34" fill="#495b73" font-weight="700" text-anchor="middle">=</text>
<text x="32" y="440" font-size="16" fill="#23364e">合并只会遍历两棵树重叠的部分，每走一步都会少掉一个结点，所以总代价不超过创建过的结点总数。</text>
<text x="32" y="460" font-size="16" fill="#495b73">绿色：只有一边有这个结点，整棵子树直接复用。橙色：两边都有，递归相加。</text>
</g></svg>