<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">插入顺序决定树形</title><desc id="desc">同样 5 个数，有序插入退化成链，查找变成 O(n)。。平衡树（4.9 的 AVL、红黑树）在插入删除后自动调整，保证树高约 log n。</desc>
<defs></defs>
<rect width="1000" height="520" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">插入顺序决定树形</text>
<text x="32" y="77" font-size="17" fill="#495b73">同样 5 个数，有序插入退化成链，查找变成 O(n)。</text>
<rect x="32" y="100" width="450" height="380" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="48" y="132" font-size="18" fill="#a33a3a" font-weight="700">按 1 2 3 4 5 顺序插入</text>
<line x1="150" y1="190" x2="205" y2="246" stroke="#66758d" stroke-width="2"/>
<line x1="205" y1="246" x2="260" y2="302" stroke="#66758d" stroke-width="2"/>
<line x1="260" y1="302" x2="315" y2="358" stroke="#66758d" stroke-width="2"/>
<line x1="315" y1="358" x2="370" y2="414" stroke="#66758d" stroke-width="2"/>
<circle cx="150" cy="190" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="150" y="195.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">1</text>
<circle cx="205" cy="246" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="205" y="251.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">2</text>
<circle cx="260" cy="302" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="260" y="307.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">3</text>
<circle cx="315" cy="358" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="315" y="363.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">4</text>
<circle cx="370" cy="414" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="370" y="419.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">5</text>
<text x="48" y="460" font-size="17" fill="#23364e">树高 5，查找 5 要比较 5 次。</text>
<rect x="518" y="100" width="450" height="380" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="534" y="132" font-size="18" fill="#176951" font-weight="700">按 3 2 4 1 5 顺序插入</text>
<line x1="743" y1="190" x2="653" y2="280" stroke="#66758d" stroke-width="2"/>
<line x1="743" y1="190" x2="833" y2="280" stroke="#66758d" stroke-width="2"/>
<line x1="653" y1="280" x2="608" y2="370" stroke="#66758d" stroke-width="2"/>
<line x1="833" y1="280" x2="878" y2="370" stroke="#66758d" stroke-width="2"/>
<circle cx="743" cy="190" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="743" y="195.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">3</text>
<circle cx="653" cy="280" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="653" y="285.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">2</text>
<circle cx="833" cy="280" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="833" y="285.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">4</text>
<circle cx="608" cy="370" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="608" y="375.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">1</text>
<circle cx="878" cy="370" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="878" y="375.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">5</text>
<text x="534" y="460" font-size="17" fill="#23364e">树高 3，查找最多比较 3 次。</text>
<text x="32" y="500" font-size="16" fill="#495b73">平衡树（4.9 的 AVL、红黑树）在插入删除后自动调整，保证树高约 log n。</text>
</g></svg>