<title id="title">缩点：每个强连通分量缩成一个点，结果是 DAG</title><desc id="desc">点权累加，再按分量编号从小到大做 DP。。边 u→v 跨分量时 comp[u] &gt; comp[v]，所以编号从小到大就是从汇到源。</desc>
