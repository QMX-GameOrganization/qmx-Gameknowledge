<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">桥和割点：用 low 判断子树能不能绕回去</title><desc id="desc">圆旁标签是 dfn/low；红边是桥，橙色点是割点。。无向图的 DFS 只有树边和回边，没有横叉边。</desc>
<defs></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">桥和割点：用 low 判断子树能不能绕回去</text>
<text x="32" y="77" font-size="17" fill="#495b73">圆旁标签是 dfn/low；红边是桥，橙色点是割点。</text>
<path d="M115.6 284.4L184.4 215.6" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M215.6 215.6L284.4 284.4" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M122.0 300.0L278.0 300.0" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M495.6 284.4L564.4 215.6" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M595.6 215.6L664.4 284.4" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M502.0 300.0L658.0 300.0" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M322.0 300.0L458.0 300.0" fill="none" stroke="#a33a3a" stroke-width="5"/>
<text x="390" y="285" font-size="17" fill="#a33a3a" font-weight="700" text-anchor="middle">桥</text>
<circle cx="100" cy="300" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="100" y="305.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="200" cy="200" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="200" y="205.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<circle cx="300" cy="300" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="300" y="305.95" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">3</text>
<circle cx="480" cy="300" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="480" y="305.95" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">4</text>
<circle cx="580" cy="200" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="580" y="205.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<circle cx="680" cy="300" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="680" y="305.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">6</text>
<rect x="80.0" y="332.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="100" y="349.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1/1</text>
<rect x="180.0" y="142.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="200" y="159.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2/1</text>
<rect x="280.0" y="332.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="300" y="349.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">3/1</text>
<rect x="460.0" y="332.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="480" y="349.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">4/4</text>
<rect x="560.0" y="142.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="580" y="159.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">5/4</text>
<rect x="660.0" y="332.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="680" y="349.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">6/4</text>
<rect x="32" y="385" width="936" height="115" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="48" y="417" font-size="16" fill="#23364e">桥 3-4：low[4] = 4 &gt; dfn[3] = 3，4 的子树出不去，删掉这条边图就断开。</text>
<text x="48" y="447" font-size="16" fill="#23364e">割点 3：孩子 4 满足 low[4] ≥ dfn[3]。割点 4：孩子 5 满足 low[5] ≥ dfn[4]。</text>
<text x="48" y="477" font-size="16" fill="#23364e">点 2 不是割点：孩子 3 的 low[3] = 1 &lt; dfn[2] = 2，能绕回 1。</text>
<text x="32" y="540" font-size="16" fill="#495b73">无向图的 DFS 只有树边和回边，没有横叉边。</text>
</g></svg>