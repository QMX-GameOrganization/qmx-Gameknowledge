<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">奇环:二染色一定失败</title><desc id="desc">沿着环交替染色,绕回起点时,奇数长度的环会让起点颜色冲突。。二分图 ⇔ 图中没有奇数长度的环。</desc>
<defs></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">奇环:二染色一定失败</text>
<text x="32" y="77" font-size="17" fill="#495b73">沿着环交替染色,绕回起点时,奇数长度的环会让起点颜色冲突。</text>
<rect x="32" y="105" width="450" height="330" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="48" y="137" font-size="19" fill="#176951" font-weight="700">偶环(4 个点):可以</text>
<path d="M162.0 230.0L278.0 230.0" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M300.0 252.0L300.0 348.0" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M278.0 370.0L162.0 370.0" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M140.0 348.0L140.0 252.0" fill="none" stroke="#66758d" stroke-width="2"/>
<circle cx="140" cy="230" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="140" y="236.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="300" cy="230" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="300" y="236.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<circle cx="300" cy="370" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="300" y="376.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<circle cx="140" cy="370" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="140" y="376.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<text x="48" y="415" font-size="15" fill="#23364e">颜色依次 0,1,0,1,回到起点正好对上。</text>
<rect x="518" y="105" width="450" height="330" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="534" y="137" font-size="19" fill="#a33a3a" font-weight="700">奇环(3 个点):冲突</text>
<path d="M662.0 360.0L798.0 360.0" fill="none" stroke="#a33a3a" stroke-width="4" stroke-dasharray="6 5"/>
<path d="M650.8 340.8L719.2 219.2" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M809.2 340.8L740.8 219.2" fill="none" stroke="#66758d" stroke-width="2"/>
<circle cx="640" cy="360" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="640" y="366.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="730" cy="200" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="730" y="206.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<circle cx="820" cy="360" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="820" y="366.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<text x="730" y="410" font-size="14" fill="#a33a3a" font-weight="700" text-anchor="middle">1 与 2 都被染成颜色 0,但它们相邻</text>
<rect x="32" y="450" width="936" height="50" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="48" y="482" font-size="15" fill="#23364e">冲突边出现在 BFS 同一层的两个点之间(或 DFS 的返回边上),它们和公共祖先构成一个奇环。</text>
<text x="32" y="540" font-size="16" fill="#495b73">二分图 ⇔ 图中没有奇数长度的环。</text>
</g></svg>