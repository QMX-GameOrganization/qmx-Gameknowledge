<title id="title">AC 自动机 = Trie + fail 指针</title><desc id="desc">模式串 he、she、his、hers。绿色是某个模式串的结尾；橙色虚线是 fail 指针。。fail 指针指向“当前串的最长真后缀中，同样是 Trie 里某个节点”的那个节点；没画出的箭头都指向根。</desc>
