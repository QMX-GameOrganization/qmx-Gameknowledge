<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">离散化：把数值换成排名</title><desc id="desc">a = [1000, 5, 99999, 5, 70]。先排序去重得到 v，再用 lower_bound 找每个数在 v 里的位置。。重复的数得到相同的编号，大小关系不变。</desc>
