<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">子集的搜索树：下一个数只能往后选</title><desc id="desc">n = 3。每个节点本身就是一个答案。。规定下标递增后，{1,2} 不会再以 {2,1} 的形式出现，共 2³ = 8 个节点。</desc>
<defs></defs>
<rect width="1000" height="500" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">子集的搜索树：下一个数只能往后选</text>
<text x="32" y="77" font-size="17" fill="#495b73">n = 3。每个节点本身就是一个答案。</text>
<line x1="500" y1="153" x2="230" y2="217" stroke="#66758d" stroke-width="2"/>
<line x1="500" y1="153" x2="500" y2="217" stroke="#66758d" stroke-width="2"/>
<line x1="500" y1="153" x2="770" y2="217" stroke="#66758d" stroke-width="2"/>
<line x1="230" y1="253" x2="140" y2="317" stroke="#66758d" stroke-width="2"/>
<line x1="230" y1="253" x2="320" y2="317" stroke="#66758d" stroke-width="2"/>
<line x1="500" y1="253" x2="500" y2="317" stroke="#66758d" stroke-width="2"/>
<line x1="140" y1="353" x2="140" y2="417" stroke="#66758d" stroke-width="2"/>
<rect x="448.0" y="117.0" width="104" height="36" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="500" y="140.6" font-size="16" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{ }</text>
<rect x="178.0" y="217.0" width="104" height="36" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="230" y="240.6" font-size="16" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{1}</text>
<rect x="448.0" y="217.0" width="104" height="36" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="500" y="240.6" font-size="16" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{2}</text>
<rect x="718.0" y="217.0" width="104" height="36" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="770" y="240.6" font-size="16" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{3}</text>
<rect x="88.0" y="317.0" width="104" height="36" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="140" y="340.6" font-size="16" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{1,2}</text>
<rect x="268.0" y="317.0" width="104" height="36" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="320" y="340.6" font-size="16" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{1,3}</text>
<rect x="448.0" y="317.0" width="104" height="36" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="500" y="340.6" font-size="16" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{2,3}</text>
<rect x="88.0" y="417.0" width="104" height="36" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="140" y="440.6" font-size="16" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{1,2,3}</text>
<rect x="620" y="300" width="350" height="150" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="636" y="332" font-size="19" fill="#176951" font-weight="700">组合 C(3,2)</text>
<text x="636" y="362" font-size="16" fill="#23364e">只收深度为 2 的节点（橙色）：</text>
<text x="636" y="390" font-size="17" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">{1,2}  {1,3}  {2,3}</text>
<text x="636" y="420" font-size="16" fill="#23364e">到了深度 2 就不用再往下走了。</text>
<text x="32" y="480" font-size="16" fill="#495b73">规定下标递增后，{1,2} 不会再以 {2,1} 的形式出现，共 2³ = 8 个节点。</text>
</g></svg>