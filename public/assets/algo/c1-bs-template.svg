<rect x="729.0" y="301.0" width="60" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="759.0" y="327.3" font-size="18" fill="#23364e" text-anchor="middle">11</text>
<text x="32" y="321" font-size="16" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">lo=2  hi=3</text>
<text x="32" y="345" font-size="14" fill="#495b73">a[2]=3 &lt; 5 → lo = 3</text>
<text x="495.0" y="363" font-size="14" fill="#8c5315" font-weight="700" text-anchor="middle">mid</text>
