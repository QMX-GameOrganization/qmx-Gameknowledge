<rect x="729.0" y="389.0" width="60" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="759.0" y="415.3" font-size="18" fill="#23364e" text-anchor="middle">11</text>
<text x="32" y="409" font-size="16" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">lo=3  hi=3</text>
