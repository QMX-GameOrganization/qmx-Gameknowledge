<text x="693.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">5</text>
<rect x="729.0" y="125.0" width="60" height="40" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="759.0" y="151.3" font-size="18" fill="#23364e" text-anchor="middle">11</text>
<text x="759.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">6</text>
<text x="32" y="145" font-size="16" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">lo=0  hi=7</text>
<text x="32" y="169" font-size="14" fill="#495b73">a[3]=5 ≥ 5 → hi = 3</text>
<text x="561.0" y="187" font-size="14" fill="#8c5315" font-weight="700" text-anchor="middle">mid</text>
