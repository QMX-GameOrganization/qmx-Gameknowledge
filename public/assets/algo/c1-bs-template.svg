<text x="561.0" y="151.3" font-size="18" fill="#23364e" text-anchor="middle">5</text>
<text x="561.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">3</text>
<rect x="597.0" y="125.0" width="60" height="40" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
