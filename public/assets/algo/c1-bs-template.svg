<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">找第一个 ≥ 5 的位置：区间 [lo, hi) 不断减半</text>
<text x="32" y="77" font-size="17" fill="#495b73">a = [1,3,3,5,7,9,11]，答案是下标 3。</text>
