<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">找第一个 ≥ 5 的位置：区间 [lo, hi) 不断减半</title><desc id="desc">a = [1,3,3,5,7,9,11]，答案是下标 3。。mid 处的值 ≥ 5 时答案不会在 mid 右边（hi = mid）；&lt; 5 时答案一定在 mid 右边（lo = mid + 1）。</desc>
<defs></defs>
