<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">Z 函数：每个位置与整串的最长公共前缀</title><desc id="desc">s = aabxaab，z[4] = 3 表示 s[4..] 的前 3 个字符等于 s 的前 3 个字符。。z[0] 按约定取 n；用 z[i] == 模式串长度判断匹配，可以替代 KMP。</desc>
<defs></defs>
<rect width="1000" height="530" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">Z 函数：每个位置与整串的最长公共前缀</text>
<text x="32" y="77" font-size="17" fill="#495b73">s = aabxaab，z[4] = 3 表示 s[4..] 的前 3 个字符等于 s 的前 3 个字符。</text>
