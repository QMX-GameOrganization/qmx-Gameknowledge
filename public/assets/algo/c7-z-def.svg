<text x="32" y="262" font-size="16" fill="#8c5315" font-weight="700">从 i=4 开始的后缀 s[4..]，对齐到串首来比较</text>
<rect x="63.0" y="288.0" width="74" height="48" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="100.0" y="320.4" font-size="24" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">a</text>
