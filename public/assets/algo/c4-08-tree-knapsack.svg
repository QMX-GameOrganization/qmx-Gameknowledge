<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">树上背包：把孩子的数组合并进父亲</title><desc id="desc">dp[u][j]：在 u 的子树里选 j 个点（u 必选）能得到的最大价值。。合并是一次“最大加卷积”；总复杂度 O(n·m)，因为每对点只在它们的 LCA 处配对一次。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="480" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">树上背包：把孩子的数组合并进父亲</text>
<text x="32" y="77" font-size="17" fill="#495b73">dp[u][j]：在 u 的子树里选 j 个点（u 必选）能得到的最大价值。</text>
<text x="32" y="160" font-size="17" fill="#495b73" font-weight="700">dp[u]（已合并）</text>
<rect x="300" y="135" width="70" height="44" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".6"/>
<text x="335.0" y="163.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">0</text>
<text x="335.0" y="127" font-size="13" fill="#495b73" text-anchor="middle">0</text>
<rect x="370" y="135" width="70" height="44" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".6"/>
<text x="405.0" y="163.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<text x="405.0" y="127" font-size="13" fill="#495b73" text-anchor="middle">1</text>
<rect x="440" y="135" width="70" height="44" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".6"/>
<text x="475.0" y="163.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">9</text>
<text x="475.0" y="127" font-size="13" fill="#495b73" text-anchor="middle">2</text>
<text x="32" y="262" font-size="17" fill="#495b73" font-weight="700">dp[v]（新孩子）</text>
<rect x="300" y="237" width="70" height="44" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".6"/>
<text x="335.0" y="265.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">0</text>
<text x="335.0" y="229" font-size="13" fill="#495b73" text-anchor="middle">0</text>
<rect x="370" y="237" width="70" height="44" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".6"/>
<text x="405.0" y="265.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<text x="405.0" y="229" font-size="13" fill="#495b73" text-anchor="middle">1</text>
<text x="32" y="392" font-size="17" fill="#495b73" font-weight="700">合并后的 dp[u]</text>
<rect x="300" y="367" width="70" height="44" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="335.0" y="395.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">0</text>
<text x="335.0" y="359" font-size="13" fill="#495b73" text-anchor="middle">0</text>
<rect x="370" y="367" width="70" height="44" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="405.0" y="395.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<text x="405.0" y="359" font-size="13" fill="#495b73" text-anchor="middle">1</text>
<rect x="440" y="367" width="70" height="44" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="475.0" y="395.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">9</text>
<text x="475.0" y="359" font-size="13" fill="#495b73" text-anchor="middle">2</text>
<rect x="510" y="367" width="70" height="44" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="545.0" y="395.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">13</text>
<text x="545.0" y="359" font-size="13" fill="#495b73" text-anchor="middle">3</text>
<path d="M280 318L280 360" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="300" y="336" font-size="15" fill="#495b73">new[k] = max( dp[u][i] + dp[v][k-i] )</text>
<text x="620" y="160" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">new[0] = 0 + 0 = 0</text>
<text x="620" y="194" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">new[1] = max(5+0, 0+4) = 5</text>
<text x="620" y="228" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">new[2] = max(9+0, 5+4) = 9</text>
<text x="620" y="262" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">new[3] = 9 + 4 = 13</text>
<text x="32" y="460" font-size="16" fill="#495b73">合并是一次“最大加卷积”；总复杂度 O(n·m)，因为每对点只在它们的 LCA 处配对一次。</text>
</g></svg>