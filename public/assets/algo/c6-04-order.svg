<title id="title">区间 DP 的填表顺序:按区间长度</title><desc id="desc">石子 3 4 5 2 1,dp[l][r] = 把第 l 到 r 堆合并成一堆的最小代价。。dp[0][4] 依赖更短的区间 dp[0][k] 与 dp[k+1][4],所以必须先填完所有较短的区间。</desc>
