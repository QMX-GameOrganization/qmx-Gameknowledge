<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">莫比乌斯函数与互质对计数</title><desc id="desc">μ(d) 只取 0、1、-1。n = m = 4 时，互质的 (i, j) 对数等于 Σ μ(d)·(4 除以 d 取整)²。。验证：16 对里 gcd &gt; 1 的有 (2,2) (2,4) (4,2) (4,4) (3,3) 共 5 对，16 - 5 = 11。</desc>
