<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">可持久化：每次修改只新建一条链</title><desc id="desc">在版本 i-1 的基础上把值 3 的个数加 1，得到版本 i。。新版本只新建根到叶的一条链（橙色，约 log n 个结点）；没动过的子树用指针指向旧版本，旧版本完全不受影响。</desc>
