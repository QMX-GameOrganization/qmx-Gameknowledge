<text x="676" y="142" font-size="19" fill="#176951" font-weight="700">两种选择</text>
<text x="676" y="176" font-size="16" fill="#23364e">不选第 i 件:dp[i-1][j]</text>
<text x="676" y="206" font-size="16" fill="#23364e">选第 i 件:</text>
<text x="676" y="232" font-size="16" fill="#23364e">dp[i-1][j-w] + v</text>
<text x="676" y="278" font-size="15" fill="#8c5315" font-weight="700">橙色 = 本格(i=3, j=7)</text>
<text x="676" y="306" font-size="15" fill="#285caa" font-weight="700">蓝色 = 它依赖的两格:</text>
<text x="676" y="334" font-size="15" fill="#23364e">正上方 5,和 j-4 列的 4</text>
<text x="32" y="500" font-size="16" fill="#495b73">dp[3][7] = max(不选第 3 件 = dp[2][7] = 5, 选第 3 件 = dp[2][3] + 5 = 9) = 9。</text>
