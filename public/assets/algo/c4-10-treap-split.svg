<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Treap 的 split：沿一条路径把树劈成两棵</title><desc id="desc">每个结点写着键值和优先级 p（大根堆）。split(root, 3)：键值 &lt;= 3 的归左树，其余归右树。。路径上 4 &gt; 3 归右，2 &lt;= 3 归左，3 &lt;= 3 归左；不在路径上的子树整棵保留。两棵结果仍满足堆序。</desc>
