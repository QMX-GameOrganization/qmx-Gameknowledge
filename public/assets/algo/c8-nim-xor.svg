<text x="120" y="395" font-size="17" fill="#23364e">取走后：(1, 4, 5) → 001 ⊕ 100 ⊕ 101 = 000，对手面对必败局面。</text>
<text x="32" y="420" font-size="16" fill="#495b73">必胜策略：找一堆 a，使 a ⊕ X &lt; a，把它减到 a ⊕ X。这里 3 ⊕ 2 = 1，从 3 那堆取走 2 个，局面变成 (1, 4, 5)，异或为 0。</text>
