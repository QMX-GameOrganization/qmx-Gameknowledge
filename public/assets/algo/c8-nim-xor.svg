<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">Nim 游戏：各堆大小异或不为 0，先手必胜</title><desc id="desc">三堆 3、4、5：二进制逐位异或，结果 010 ≠ 0。。必胜策略：找一堆 a，使 a ⊕ X &lt; a，把它减到 a ⊕ X。这里 3 ⊕ 2 = 1，从 3 那堆取走 2 个，局面变成 (1, 4, 5)，异或为 0。</desc>
