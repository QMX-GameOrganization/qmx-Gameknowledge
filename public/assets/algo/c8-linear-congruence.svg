<title id="title">解同余方程 6x ≡ 4 (mod 10)：把 x 从 0 试到 9</title><desc id="desc">g = gcd(6, 10) = 2，4 能被 2 整除，所以有解；解之间相隔 m/g = 5。。两个解 x = 4 和 x = 9，写成 x ≡ 4 (mod 5)。如果右边是 5（不被 2 整除），整行都不会出现 5。</desc>
