<rect x="360" y="387" width="260" height="48" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="372" y="418" font-size="17" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">[1]</text>
