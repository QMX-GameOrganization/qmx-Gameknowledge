<title id="title">接受变差解的概率 exp(−Δ/T)</title><desc id="desc">Δ 是解变差的幅度，T 是温度。温度高时什么都敢接受，温度低时几乎只接受更好的。。降温方式：每轮 T ← T × 0.995 之类的几何衰减，先广泛探索，再逐渐收敛。</desc>
