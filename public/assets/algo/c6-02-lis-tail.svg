<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">LIS 的 O(n log n) 做法:维护 tail 数组</title><desc id="desc">tail[k] = 长度为 k+1 的递增子序列里,结尾元素的最小值。。tail 始终有序,所以每个新元素用 lower_bound 二分;最终长度就是 LIS 长度 4。</desc>
