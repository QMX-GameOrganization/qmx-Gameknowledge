<text x="40" y="540" font-size="15" fill="#23364e">height[2]=3：anana 和 ana 的公共前缀是 ana；height[5]=2：nana 和 na 的公共前缀是 na。</text>
<text x="32" y="580" font-size="16" fill="#495b73">本质不同的子串个数 = n(n+1)/2 - Σheight = 21 - 6 = 15。最长重复子串 = 最大的 height 对应的公共前缀 ana。</text>
