<title id="title">后缀数组与 height：banana 的 6 个后缀</title><desc id="desc">sa[i] 是排名第 i 的后缀的起点；height[i] 是它与前一名后缀的最长公共前缀。。本质不同的子串个数 = n(n+1)/2 - Σheight = 21 - 6 = 15。最长重复子串 = 最大的 height 对应的公共前缀 ana。</desc>
