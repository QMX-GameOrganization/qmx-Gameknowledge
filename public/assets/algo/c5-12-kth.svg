<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="575" viewBox="0 0 1000 575" role="img" aria-labelledby="title desc">
<title id="title">k 短路（A*）：用反图最短距离 h 当估价，f = g + h</title><desc id="desc">有向图，求 1 到 4 的前 3 短路径（允许重复经过点）。。每个点最多出队 k 次；第 j 次出队的终点对应第 j 短路径。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="575" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">k 短路（A*）：用反图最短距离 h 当估价，f = g + h</text>
<text x="32" y="77" font-size="17" fill="#495b73">有向图，求 1 到 4 的前 3 短路径（允许重复经过点）。</text>
