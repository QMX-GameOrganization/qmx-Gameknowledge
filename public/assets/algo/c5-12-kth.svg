<text x="410" y="322" font-size="14" fill="#495b73" text-anchor="middle">h=0</text>
<text x="48" y="140" font-size="15" fill="#495b73">h 来自在反图上从 4 出发的 Dijkstra</text>
<rect x="510" y="105" width="458" height="400" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="526" y="137" font-size="19" fill="#495b73" font-weight="700">出队顺序 (f, g, 点)</text>
<text x="526" y="178" font-size="15" fill="#495b73">1</text>
<text x="556" y="178" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(3, 0, 1)</text>
<text x="700" y="178" font-size="16" fill="#23364e">展开 2、3</text>
<text x="526" y="218" font-size="15" fill="#495b73">2</text>
<text x="556" y="218" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(3, 1, 2)</text>
<text x="700" y="218" font-size="16" fill="#23364e">展开 4、3</text>
<text x="526" y="258" font-size="15" fill="#495b73">3</text>
<text x="556" y="258" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(3, 2, 3)</text>
<text x="700" y="258" font-size="16" fill="#23364e">展开 4</text>
<text x="526" y="298" font-size="15" fill="#495b73">4</text>
<text x="556" y="298" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(3, 2, 3)</text>
<text x="700" y="298" font-size="16" fill="#23364e">展开 4</text>
<text x="526" y="338" font-size="15" fill="#495b73">5</text>
<text x="556" y="338" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(3, 3, 4)</text>
<text x="700" y="338" font-size="16" fill="#176951" font-weight="700">第 1 短 = 3</text>
<text x="526" y="378" font-size="15" fill="#495b73">6</text>
<text x="556" y="378" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(3, 3, 4)</text>
<text x="700" y="378" font-size="16" fill="#176951" font-weight="700">第 2 短 = 3</text>
<text x="526" y="418" font-size="15" fill="#495b73">7</text>
<text x="556" y="418" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(4, 4, 4)</text>
<text x="700" y="418" font-size="16" fill="#176951" font-weight="700">第 3 短 = 4</text>
<text x="32" y="555" font-size="16" fill="#495b73">每个点最多出队 k 次；第 j 次出队的终点对应第 j 短路径。</text>
</g></svg>