<text x="90" y="285.95" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">1</text>
<text x="90" y="322" font-size="14" fill="#495b73" text-anchor="middle">h=3</text>
<circle cx="250" cy="180" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="250" y="185.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
