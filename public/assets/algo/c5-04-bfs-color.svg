<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">BFS 染色:同一层的点颜色相同</title><desc id="desc">相邻的点染成不同颜色;若发现相邻点颜色相同,就不是二分图。。二分图的两部分,恰好是 BFS 层号的奇数层与偶数层(每个连通分量内)。</desc>
<defs></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">BFS 染色:同一层的点颜色相同</text>
<text x="32" y="77" font-size="17" fill="#495b73">相邻的点染成不同颜色;若发现相邻点颜色相同,就不是二分图。</text>
<text x="90" y="120" font-size="16" fill="#495b73" font-weight="700" text-anchor="middle">第 0 层</text>
<text x="290" y="120" font-size="16" fill="#495b73" font-weight="700" text-anchor="middle">第 1 层</text>
<text x="520" y="120" font-size="16" fill="#495b73" font-weight="700" text-anchor="middle">第 2 层</text>
<text x="740" y="120" font-size="16" fill="#495b73" font-weight="700" text-anchor="middle">第 3 层</text>
<path d="M109.3 289.4L270.7 200.6" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M109.3 310.6L270.7 399.4" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M312.0 190.0L498.0 190.0" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M305.9 394.8L504.1 205.2" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M312.0 410.0L498.0 410.0" fill="none" stroke="#66758d" stroke-width="2"/>
<path d="M542.0 410.0L718.0 410.0" fill="none" stroke="#66758d" stroke-width="2"/>
<circle cx="90" cy="300" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="90" y="306.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="290" cy="190" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="290" y="196.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<circle cx="290" cy="410" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="290" y="416.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<circle cx="520" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="520" y="196.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<circle cx="520" cy="410" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="520" y="416.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<circle cx="740" cy="410" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="740" y="416.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">6</text>
<rect x="32" y="450" width="936" height="50" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="48" y="482" font-size="15" fill="#23364e">蓝色 = 颜色 0,橙色 = 颜色 1。染色规则:color[v] = color[u] ^ 1;遇到已染色的邻居,检查颜色是否不同。</text>
<text x="800" y="270" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">结果:{1,3,5} 与 {2,4,6}</text>
<text x="800" y="296" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">两部分之间才有边</text>
<text x="32" y="540" font-size="16" fill="#495b73">二分图的两部分,恰好是 BFS 层号的奇数层与偶数层(每个连通分量内)。</text>
</g></svg>