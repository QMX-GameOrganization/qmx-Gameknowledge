<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">完全二叉树堆与数组下标</title><desc id="desc">堆用数组保存，父子关系由下标直接计算。。小根堆只保证父节点不大于孩子，左右子树之间没有整体有序关系。</desc>
<defs></defs>
<rect width="1000" height="610" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">完全二叉树堆与数组下标</text>
<text x="32" y="77" font-size="17" fill="#495b73">堆用数组保存，父子关系由下标直接计算。</text>
<line x1="500" y1="150" x2="330" y2="280" stroke="#66758d" stroke-width="2"/>
<line x1="500" y1="150" x2="670" y2="280" stroke="#66758d" stroke-width="2"/>
<line x1="330" y1="280" x2="220" y2="420" stroke="#66758d" stroke-width="2"/>
<line x1="330" y1="280" x2="440" y2="420" stroke="#66758d" stroke-width="2"/>
<line x1="670" y1="280" x2="590" y2="420" stroke="#66758d" stroke-width="2"/>
<line x1="670" y1="280" x2="800" y2="420" stroke="#66758d" stroke-width="2"/>
<circle cx="500" cy="150" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="500" y="155.6" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">1</text>
<circle cx="330" cy="280" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="330" y="285.6" font-size="16" fill="#285caa" font-weight="700" text-anchor="middle">2</text>
<circle cx="670" cy="280" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="670" y="285.6" font-size="16" fill="#285caa" font-weight="700" text-anchor="middle">3</text>
<circle cx="220" cy="420" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="220" y="425.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">4</text>
<circle cx="440" cy="420" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="440" y="425.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">5</text>
<circle cx="590" cy="420" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="590" y="425.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">6</text>
<circle cx="800" cy="420" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="800" y="425.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">7</text>
<text x="500" y="108" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">小根堆示例：1 ≤ 2、3，2 ≤ 4、5，3 ≤ 6、7</text>
<text x="70" y="535" font-size="17" fill="#495b73" font-weight="700">数组下标</text>
<rect x="190" y="505" width="86" height="44" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="233.0" y="533.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<rect x="276" y="505" width="86" height="44" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".6"/>
<text x="319.0" y="533.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<rect x="362" y="505" width="86" height="44" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".6"/>
<text x="405.0" y="533.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<rect x="448" y="505" width="86" height="44" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".6"/>
<text x="491.0" y="533.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<rect x="534" y="505" width="86" height="44" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".6"/>
<text x="577.0" y="533.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<rect x="620" y="505" width="86" height="44" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".6"/>
<text x="663.0" y="533.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">6</text>
<rect x="706" y="505" width="86" height="44" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".6"/>
<text x="749.0" y="533.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">7</text>
<text x="70" y="585" font-size="16" fill="#495b73" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">parent(i)=i/2    left(i)=2i    right(i)=2i+1</text>
<text x="32" y="590" font-size="16" fill="#495b73">小根堆只保证父节点不大于孩子，左右子树之间没有整体有序关系。</text>
</g></svg>