<text x="330" y="330" font-size="16" fill="#285caa" font-weight="700">经过点 1:</text>
<text x="330" y="356" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">d[3][2] = d[3][1] + d[1][2] = 2 + 4 = 6</text>
<text x="330" y="386" font-size="16" fill="#285caa" font-weight="700">经过点 2:</text>
<text x="330" y="412" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">d[1][3] = min(6, d[1][2] + d[2][3]) = 5</text>
<text x="330" y="442" font-size="16" fill="#285caa" font-weight="700">经过点 3:</text>
<text x="330" y="468" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">d[2][1] = d[2][3] + d[3][1] = 1 + 2 = 3</text>
<rect x="32" y="520" width="936" height="60" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="48" y="557" font-size="16" fill="#23364e">如果把 k 放到内层,当前轮用到的 d[i][k] 还没经过前面的中转点,会漏掉路径。</text>
<text x="32" y="630" font-size="16" fill="#495b73">第 k 轮结束后,d[i][j] 是只经过编号 ≤ k 的点作中转时的最短距离。</text>
