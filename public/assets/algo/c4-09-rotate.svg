<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">旋转：改变形状，不改变中序</title><desc id="desc">右旋 rotR(y)：y 的左孩子 x 升到上面，x 的右子树 B 转给 y。。左旋是镜像操作。无论怎么转，中序始终是 A x B y C，所以二叉搜索树的性质不会被破坏。</desc>
<defs><marker id="m495b73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#495b73"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">旋转：改变形状，不改变中序</text>
<text x="32" y="77" font-size="17" fill="#495b73">右旋 rotR(y)：y 的左孩子 x 升到上面，x 的右子树 B 转给 y。</text>
<text x="230" y="118" font-size="17" fill="#495b73" text-anchor="middle">旋转前：y 左边偏高</text>
<line x1="230" y1="160" x2="140" y2="240" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
<line x1="230" y1="160" x2="320" y2="240" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
<line x1="140" y1="240" x2="80" y2="320" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
<line x1="140" y1="240" x2="200" y2="320" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
<circle cx="230" cy="160" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="230" y="165.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">y</text>
<circle cx="140" cy="240" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="140" y="245.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">x</text>
<polygon points="80,320 45.0,400 115.0,400" fill="#eef1f6" stroke="#495b73" stroke-opacity=".6" stroke-width="1.5"/>
<text x="80" y="388" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle">A</text>
<polygon points="200,320 165.0,400 235.0,400" fill="#eef1f6" stroke="#495b73" stroke-opacity=".6" stroke-width="1.5"/>
<text x="200" y="388" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle">B</text>
<polygon points="320,240 285.0,320 355.0,320" fill="#eef1f6" stroke="#495b73" stroke-opacity=".6" stroke-width="1.5"/>
<text x="320" y="308" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle">C</text>
<path d="M400 240L560 240" fill="none" stroke="#495b73" stroke-width="2" marker-end="url(#m495b73)"/>
<text x="480.0" y="228" font-size="15" fill="#495b73" text-anchor="middle">rotR(y)</text>
<text x="730" y="118" font-size="17" fill="#495b73" text-anchor="middle">旋转后：x 做根，两边平衡</text>
<line x1="730" y1="160" x2="640" y2="240" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
<line x1="730" y1="160" x2="820" y2="240" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
<line x1="820" y1="240" x2="760" y2="320" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
<line x1="820" y1="240" x2="880" y2="320" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
<circle cx="730" cy="160" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="730" y="165.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">x</text>
<circle cx="820" cy="240" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="820" y="245.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">y</text>
<polygon points="640,240 605.0,320 675.0,320" fill="#eef1f6" stroke="#495b73" stroke-opacity=".6" stroke-width="1.5"/>
<text x="640" y="308" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle">A</text>
<polygon points="760,320 725.0,400 795.0,400" fill="#eef1f6" stroke="#495b73" stroke-opacity=".6" stroke-width="1.5"/>
<text x="760" y="388" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle">B</text>
<polygon points="880,320 845.0,400 915.0,400" fill="#eef1f6" stroke="#495b73" stroke-opacity=".6" stroke-width="1.5"/>
<text x="880" y="388" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle">C</text>
<text x="32" y="450" font-size="16" fill="#495b73">左旋是镜像操作。无论怎么转，中序始终是 A x B y C，所以二叉搜索树的性质不会被破坏。</text>
</g></svg>