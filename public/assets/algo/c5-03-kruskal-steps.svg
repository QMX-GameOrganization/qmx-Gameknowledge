<text x="862.0" y="147.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">连通块</text>
<rect x="540" y="161" width="70" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="575.0" y="186.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1-3</text>
<rect x="610" y="161" width="46" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="633.0" y="186.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<rect x="656" y="161" width="100" height="40" fill="#d9f0e4" stroke="#c5cfdf"/>
<text x="706.0" y="186.2" font-size="15" fill="#23364e" font-weight="700" text-anchor="middle">选</text>
