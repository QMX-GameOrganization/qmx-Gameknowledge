<text x="260" y="456.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<text x="32" y="118" font-size="14" fill="#495b73">绿色:选中  红色虚线:成环被拒  灰色虚线:没有检查</text>
