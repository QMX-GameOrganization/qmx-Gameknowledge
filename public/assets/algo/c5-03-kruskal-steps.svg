<text x="385.0" y="225.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">8</text>
<circle cx="70" cy="260" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="70" y="266.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="330" cy="150" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="330" y="156.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<circle cx="250" cy="320" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="250" y="326.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<circle cx="440" cy="290" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="440" y="296.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
