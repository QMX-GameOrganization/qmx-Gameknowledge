<rect x="656" y="201" width="100" height="40" fill="#d9f0e4" stroke="#c5cfdf"/>
<text x="706.0" y="226.2" font-size="15" fill="#23364e" font-weight="700" text-anchor="middle">选</text>
<rect x="756" y="201" width="212" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="862.0" y="225.9" font-size="14" fill="#23364e" text-anchor="middle">{1,3,5} {2} {4}</text>
<rect x="540" y="241" width="70" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="575.0" y="266.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1-5</text>
<rect x="610" y="241" width="46" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="633.0" y="266.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">3</text>
<rect x="656" y="241" width="100" height="40" fill="#fdecec" stroke="#c5cfdf"/>
<text x="706.0" y="266.2" font-size="15" fill="#23364e" font-weight="700" text-anchor="middle">成环,跳过</text>
<rect x="756" y="241" width="212" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="862.0" y="265.9" font-size="14" fill="#23364e" text-anchor="middle">不变</text>
<rect x="540" y="281" width="70" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="575.0" y="306.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2-4</text>
<rect x="610" y="281" width="46" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="633.0" y="306.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">4</text>
<rect x="656" y="281" width="100" height="40" fill="#d9f0e4" stroke="#c5cfdf"/>
<text x="706.0" y="306.2" font-size="15" fill="#23364e" font-weight="700" text-anchor="middle">选</text>
<rect x="756" y="281" width="212" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="862.0" y="305.9" font-size="14" fill="#23364e" text-anchor="middle">{1,3,5} {2,4}</text>
<rect x="540" y="321" width="70" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="575.0" y="346.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">3-4</text>
<rect x="610" y="321" width="46" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="633.0" y="346.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">5</text>
<rect x="656" y="321" width="100" height="40" fill="#d9f0e4" stroke="#c5cfdf"/>
<text x="706.0" y="346.2" font-size="15" fill="#23364e" font-weight="700" text-anchor="middle">选</text>
<rect x="756" y="321" width="212" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="862.0" y="345.9" font-size="14" fill="#23364e" text-anchor="middle">{1,2,3,4,5}</text>
<rect x="540" y="361" width="70" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="575.0" y="386.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2-3…</text>
<rect x="610" y="361" width="46" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="633.0" y="386.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">6…</text>
<rect x="656" y="361" width="100" height="40" fill="#eef1f6" stroke="#c5cfdf"/>
<text x="706.0" y="386.2" font-size="15" fill="#23364e" font-weight="700" text-anchor="middle">已选够,停止</text>
<rect x="756" y="361" width="212" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="862.0" y="385.9" font-size="14" fill="#23364e" text-anchor="middle"></text>
<text x="540" y="431" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">判断成环:find(u) == find(v)</text>
<text x="540" y="459" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">选边后合并:fa[find(u)] = find(v)</text>
<text x="32" y="580" font-size="16" fill="#495b73">选够 n-1 = 4 条边即可停止,总权 1+2+4+5 = 12。</text>
</g></svg>