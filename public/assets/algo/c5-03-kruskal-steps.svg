<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Kruskal:边按权从小到大,不成环就选</title><desc id="desc">用并查集判断一条边的两端是否已经连通。。选够 n-1 = 4 条边即可停止,总权 1+2+4+5 = 12。</desc>
<defs></defs>
<rect width="1000" height="600" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">Kruskal:边按权从小到大,不成环就选</text>
<text x="32" y="77" font-size="17" fill="#495b73">用并查集判断一条边的两端是否已经连通。</text>
