<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Burnside 引理：4 颗珠子、2 种颜色的项链</title><desc id="desc">对每种旋转，数不动点（旋转后不变的染色）：循环数为 c 时有 2^c 个。。不同项链数 = 所有旋转的不动点平均 = (16 + 2 + 4 + 2) / 4 = 6。</desc>
<defs></defs>
<rect width="1000" height="520" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">Burnside 引理：4 颗珠子、2 种颜色的项链</text>
<text x="32" y="77" font-size="17" fill="#495b73">对每种旋转，数不动点（旋转后不变的染色）：循环数为 c 时有 2^c 个。</text>
<text x="130" y="118" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">旋转 0 步</text>
<circle cx="130" cy="175" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="130" y="181" font-size="16" fill="#23364e" text-anchor="middle">1</text>
<circle cx="185" cy="230" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="185" y="236" font-size="16" fill="#23364e" text-anchor="middle">2</text>
<circle cx="130" cy="285" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="130" y="291" font-size="16" fill="#23364e" text-anchor="middle">3</text>
<circle cx="75" cy="230" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="75" y="236" font-size="16" fill="#23364e" text-anchor="middle">4</text>
<text x="130" y="340" font-size="16" fill="#495b73" text-anchor="middle">4 个循环</text>
<rect x="55.0" y="370.0" width="150" height="50" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="130" y="400.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">不动点 2^4 = 16</text>
<text x="365" y="118" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">旋转 1 步</text>
<line x1="365" y1="175" x2="420" y2="230" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round"/>
<line x1="420" y1="230" x2="365" y2="285" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round"/>
<line x1="365" y1="285" x2="310" y2="230" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round"/>
<line x1="310" y1="230" x2="365" y2="175" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="365" cy="175" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="365" y="181" font-size="16" fill="#23364e" text-anchor="middle">1</text>
<circle cx="420" cy="230" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="420" y="236" font-size="16" fill="#23364e" text-anchor="middle">2</text>
<circle cx="365" cy="285" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="365" y="291" font-size="16" fill="#23364e" text-anchor="middle">3</text>
<circle cx="310" cy="230" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="310" y="236" font-size="16" fill="#23364e" text-anchor="middle">4</text>
<text x="365" y="340" font-size="16" fill="#495b73" text-anchor="middle">1 个循环</text>
<rect x="290.0" y="370.0" width="150" height="50" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="365" y="400.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">不动点 2^1 = 2</text>
<text x="600" y="118" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">旋转 2 步</text>
<line x1="600" y1="175" x2="600" y2="285" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="655" y1="230" x2="545" y2="230" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<circle cx="600" cy="175" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="600" y="181" font-size="16" fill="#23364e" text-anchor="middle">1</text>
<circle cx="655" cy="230" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="655" y="236" font-size="16" fill="#23364e" text-anchor="middle">2</text>
<circle cx="600" cy="285" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="600" y="291" font-size="16" fill="#23364e" text-anchor="middle">3</text>
<circle cx="545" cy="230" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="545" y="236" font-size="16" fill="#23364e" text-anchor="middle">4</text>
<text x="600" y="340" font-size="16" fill="#495b73" text-anchor="middle">2 个循环</text>
<rect x="525.0" y="370.0" width="150" height="50" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="600" y="400.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">不动点 2^2 = 4</text>
<text x="835" y="118" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">旋转 3 步</text>
<line x1="835" y1="175" x2="780" y2="230" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round"/>
<line x1="780" y1="230" x2="835" y2="285" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round"/>
<line x1="835" y1="285" x2="890" y2="230" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round"/>
<line x1="890" y1="230" x2="835" y2="175" stroke="#8c5315" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="835" cy="175" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="835" y="181" font-size="16" fill="#23364e" text-anchor="middle">1</text>
<circle cx="890" cy="230" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="890" y="236" font-size="16" fill="#23364e" text-anchor="middle">2</text>
<circle cx="835" cy="285" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="835" y="291" font-size="16" fill="#23364e" text-anchor="middle">3</text>
<circle cx="780" cy="230" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="780" y="236" font-size="16" fill="#23364e" text-anchor="middle">4</text>
<text x="835" y="340" font-size="16" fill="#495b73" text-anchor="middle">1 个循环</text>
<rect x="760.0" y="370.0" width="150" height="50" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="835" y="400.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">不动点 2^1 = 2</text>
<text x="40" y="470" font-size="15" fill="#23364e">旋转 0 步：每颗珠子自成一个循环；旋转 1、3 步：4 颗珠子连成一圈，必须同色；旋转 2 步：对面两颗必须同色。</text>
<text x="32" y="500" font-size="16" fill="#495b73">不同项链数 = 所有旋转的不动点平均 = (16 + 2 + 4 + 2) / 4 = 6。</text>
</g></svg>