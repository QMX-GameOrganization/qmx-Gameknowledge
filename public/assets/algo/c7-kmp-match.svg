<rect x="235.0" y="277.0" width="58" height="46" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="264.0" y="307.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">b</text>
<rect x="299.0" y="277.0" width="58" height="46" rx="8" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="328.0" y="307.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">c</text>
<text x="374" y="306" font-size="16" fill="#a33a3a" font-weight="700">a ≠ c</text>
<text x="32" y="380" font-size="16" fill="#176951" font-weight="700">j=4 失配，j = pi[3] = 2：模式串右移 4-2 = 2 位</text>
<rect x="171.0" y="407.0" width="58" height="46" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
