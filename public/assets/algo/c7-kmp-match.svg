<rect x="299.0" y="407.0" width="58" height="46" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="328.0" y="437.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">a</text>
<rect x="363.0" y="407.0" width="58" height="46" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="392.0" y="437.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">b</text>
<rect x="427.0" y="407.0" width="58" height="46" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="456.0" y="437.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">c</text>
<text x="168" y="482" font-size="14" fill="#495b73">灰色两格 ab 已确认相等，从 pat[2] 接着比</text>
<text x="502" y="436" font-size="16" fill="#176951" font-weight="700">完整匹配</text>
<text x="502" y="460" font-size="15" fill="#23364e">起点 = 2</text>
<text x="32" y="520" font-size="16" fill="#495b73">文本指针 i 从不后退；失配时只改 j = pi[j-1]，相当于把模式串直接滑到下一个可能的位置。</text>
</g></svg>