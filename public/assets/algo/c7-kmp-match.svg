<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">KMP 匹配：失配后模式串右移，已匹配的部分不再比较</title><desc id="desc">text = abababcab，pat = ababc（pi = 0 0 1 2 0）。。文本指针 i 从不后退；失配时只改 j = pi[j-1]，相当于把模式串直接滑到下一个可能的位置。</desc>
<defs></defs>
<rect width="1000" height="540" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">KMP 匹配：失配后模式串右移，已匹配的部分不再比较</text>
<text x="32" y="77" font-size="17" fill="#495b73">text = abababcab，pat = ababc（pi = 0 0 1 2 0）。</text>
<text x="32" y="118" font-size="16" fill="#495b73">文本</text>
<rect x="43.0" y="137.0" width="58" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
