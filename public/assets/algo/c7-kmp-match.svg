<text x="456.0" y="167.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">c</text>
<text x="456.0" y="202.0" font-size="13" fill="#495b73" text-anchor="middle">6</text>
