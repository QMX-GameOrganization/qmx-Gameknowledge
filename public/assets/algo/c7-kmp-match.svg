<text x="200.0" y="202.0" font-size="13" fill="#495b73" text-anchor="middle">2</text>
<rect x="235.0" y="137.0" width="58" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="264.0" y="167.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">b</text>
<text x="264.0" y="202.0" font-size="13" fill="#495b73" text-anchor="middle">3</text>
<rect x="299.0" y="137.0" width="58" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
