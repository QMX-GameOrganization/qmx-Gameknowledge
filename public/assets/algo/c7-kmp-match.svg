<text x="520.0" y="167.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">a</text>
<text x="520.0" y="202.0" font-size="13" fill="#495b73" text-anchor="middle">7</text>
<rect x="555.0" y="137.0" width="58" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="584.0" y="167.7" font-size="22" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">b</text>
<text x="584.0" y="202.0" font-size="13" fill="#495b73" text-anchor="middle">8</text>
<text x="32" y="250" font-size="16" fill="#a33a3a" font-weight="700">第一次对齐（偏移 0）：比到 text[4] 失配</text>
<rect x="43.0" y="277.0" width="58" height="46" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
