<text x="482" y="236" font-size="15" fill="#495b73">区间加 → 两个端点</text>
<text x="482" y="358" font-size="15" fill="#495b73">前缀和还原出 a</text>
<text x="32" y="490" font-size="16" fill="#23364e">区间求和：sum(1..x) = (x+1) * Σd[i] - Σ i*d[i]（i 从 1 到 x），用两个树状数组分别维护 d[i] 和 i*d[i]。</text>
<text x="32" y="540" font-size="16" fill="#495b73">d[i] = a[i] - a[i-1]；a[i] 等于 d 的前缀和，所以“区间加、单点查”用树状数组维护 d。</text>
