<title id="title">区间加：转成差分数组的两次单点修改</title><desc id="desc">给 [3, 6] 都加 2，只需改 d[3] 和 d[7]。。d[i] = a[i] - a[i-1]；a[i] 等于 d 的前缀和，所以“区间加、单点查”用树状数组维护 d。</desc>
