<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">负环 ⇒ 无解</title><desc id="desc">环上的不等式相加,得到 0 ≤ 负数。。判断有没有解,就是判断约束图里有没有负环。</desc>
<defs><marker id="ma33a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a33a3a"/></marker></defs>
<rect width="1000" height="480" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">负环 ⇒ 无解</text>
<text x="32" y="77" font-size="17" fill="#495b73">环上的不等式相加,得到 0 ≤ 负数。</text>
<rect x="32" y="105" width="450" height="330" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="48" y="137" font-size="19" fill="#a33a3a" font-weight="700">一个无解的例子</text>
<text x="48" y="172" font-size="17" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">x2 - x1 ≤ -1</text>
<text x="48" y="202" font-size="17" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">x1 - x2 ≤  0</text>
<text x="48" y="245" font-size="17" fill="#a33a3a" font-weight="700">两式相加:0 ≤ -1,矛盾。</text>
<path d="M157.0 336.0L360.0 336.0" fill="none" stroke="#a33a3a" stroke-width="2" marker-end="url(#ma33a3a)"/>
<rect x="245.0" y="309.0" width="30.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="260.0" y="325.0" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">-1</text>
<path d="M363.0 364.0L160.0 364.0" fill="none" stroke="#a33a3a" stroke-width="2" marker-end="url(#ma33a3a)"/>
<rect x="249.0" y="369.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="260.0" y="385.0" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">0</text>
<circle cx="140" cy="350" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="140" y="356.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="380" cy="350" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="380" y="356.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<text x="260" y="420" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">环权 = -1 + 0 = -1 &lt; 0</text>
<rect x="518" y="105" width="450" height="330" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="534" y="137" font-size="19" fill="#285caa" font-weight="700">为什么 ≤ 对应最短路</text>
<text x="534" y="175" font-size="16" fill="#23364e">最短路满足 dist[j] ≤ dist[i] + c,</text>
<text x="534" y="205" font-size="16" fill="#23364e">和约束 x_j ≤ x_i + c 完全一致,</text>
<text x="534" y="235" font-size="16" fill="#23364e">所以 dist 本身就是一组解。</text>
<text x="534" y="265" font-size="16" fill="#23364e"></text>
<text x="534" y="295" font-size="16" fill="#23364e">若约束是 x_j - x_i ≥ c,</text>
<text x="534" y="325" font-size="16" fill="#23364e">改成边 i→j 权 c 求最长路,</text>
<text x="534" y="355" font-size="16" fill="#23364e">此时图中出现正环 ⇒ 无解。</text>
<text x="32" y="460" font-size="16" fill="#495b73">判断有没有解,就是判断约束图里有没有负环。</text>
</g></svg>