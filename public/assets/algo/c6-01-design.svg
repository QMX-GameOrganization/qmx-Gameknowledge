<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">设计一个 DP 的四步</title><desc id="desc">以「网格最小路径和」为例,每一步都要写清楚。。写代码之前,先把这四件事用一句话写下来。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="460" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">设计一个 DP 的四步</text>
<text x="32" y="77" font-size="17" fill="#495b73">以「网格最小路径和」为例,每一步都要写清楚。</text>
<rect x="32" y="110" width="222" height="270" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="46" y="144" font-size="21" fill="#285caa" font-weight="700">① 状态</text>
<rect x="46.0" y="177.0" width="194" height="76" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="143" y="220.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[i][j]</text>
<text x="46" y="306" font-size="15" fill="#23364e">从左上角走到 (i,j)</text>
<text x="46" y="332" font-size="15" fill="#23364e">的最小路径和</text>
<path d="M256 245L273 245" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<rect x="275" y="110" width="222" height="270" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="289" y="144" font-size="21" fill="#176951" font-weight="700">② 转移</text>
<rect x="289.0" y="177.0" width="194" height="76" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="386" y="210.5" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[i][j] =</text>
<text x="386" y="230.0" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">min(上, 左) + g[i][j]</text>
<text x="289" y="306" font-size="15" fill="#23364e">最后一步只可能</text>
<text x="289" y="332" font-size="15" fill="#23364e">来自上方或左方</text>
<path d="M499 245L516 245" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<rect x="518" y="110" width="222" height="270" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="532" y="144" font-size="21" fill="#8c5315" font-weight="700">③ 边界</text>
<rect x="532.0" y="177.0" width="194" height="76" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="629" y="220.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">dp[0][0] = g[0][0]</text>
<text x="532" y="306" font-size="15" fill="#23364e">第一行、第一列</text>
<text x="532" y="332" font-size="15" fill="#23364e">只有一个来源</text>
<path d="M742 245L759 245" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<rect x="761" y="110" width="222" height="270" rx="12" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="775" y="144" font-size="21" fill="#5b3fa0" font-weight="700">④ 顺序</text>
<rect x="775.0" y="177.0" width="194" height="76" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="872" y="220.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">i、j 从小到大</text>
<text x="775" y="306" font-size="15" fill="#23364e">算 (i,j) 时,</text>
<text x="775" y="332" font-size="15" fill="#23364e">上方和左方已经算好</text>
<text x="32" y="410" font-size="17" fill="#23364e">答案:dp[n-1][m-1]。状态定义决定了转移怎么写,所以第一步最重要。</text>
<text x="32" y="440" font-size="16" fill="#495b73">写代码之前,先把这四件事用一句话写下来。</text>
</g></svg>