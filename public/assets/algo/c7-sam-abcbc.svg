<text x="32" y="510" font-size="15" fill="#23364e">沿 link 把各状态的 len 差相加：Σ(len[v] - len[link[v]]) = 12，就是 abcbc 本质不同的子串个数。</text>
<text x="32" y="540" font-size="16" fill="#495b73">状态 5（{b}）是克隆状态：加入第 4 个字符 b 时，从状态 2 拆出来（原来状态 2 同时装着 ab 和 b）。</text>
