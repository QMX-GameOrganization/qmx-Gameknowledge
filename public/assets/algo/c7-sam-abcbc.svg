<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">abcbc 的后缀自动机：8 个状态</title><desc id="desc">每个状态是一组“结束位置集合相同”的子串；实线是转移，框内第三行是后缀链接 link。。状态 5（{b}）是克隆状态：加入第 4 个字符 b 时，从状态 2 拆出来（原来状态 2 同时装着 ab 和 b）。</desc>
