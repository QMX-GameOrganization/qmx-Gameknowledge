<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Splay 的双旋：同向转父亲，异向转两次自己</title><desc id="desc">x 是要伸展的结点，y 是父亲，z 是祖父。。zig-zig 会把路径压扁，这是均摊 O(log n) 的关键；只把 x 连转两次（每次都转 x）会让链保持很长。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="620" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">Splay 的双旋：同向转父亲，异向转两次自己</text>
<text x="32" y="77" font-size="17" fill="#495b73">x 是要伸展的结点，y 是父亲，z 是祖父。</text>
<text x="24" y="112" font-size="18" fill="#285caa" font-weight="700">同向（左左）：zig-zig，先旋转 y，再旋转 x</text>
