<text x="690" y="485.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">z</text>
<path d="M330 460L520 460" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="32" y="600" font-size="16" fill="#495b73">zig-zig 会把路径压扁，这是均摊 O(log n) 的关键；只把 x 连转两次（每次都转 x）会让链保持很长。</text>
</g></svg>