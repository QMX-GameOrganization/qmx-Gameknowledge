<text x="150" y="465.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">y</text>
<circle cx="190" cy="520" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="190" y="525.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">x</text>
<line x1="640" y1="400" x2="590" y2="480" stroke="#66758d" stroke-width="2" stroke-opacity="1"/>
