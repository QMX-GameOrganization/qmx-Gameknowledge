<text x="580" y="165.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">x</text>
<circle cx="630" cy="220" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="630" y="225.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">y</text>
<circle cx="680" cy="280" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="680" y="285.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">z</text>
<path d="M330 220L520 220" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="24" y="352" font-size="18" fill="#285caa" font-weight="700">异向（左右）：zig-zag，把 x 连转两次</text>
