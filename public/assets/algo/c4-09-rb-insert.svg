<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc">
<title id="title">红黑树插入修复的三种情形</title><desc id="desc">新结点 z 是红色，父亲 p 也是红色时违反性质 3；看叔叔 u（祖父 g 的另一个孩子）的颜色。。情形 1 只染色，可能把问题上移到 g；情形 2、3 至多旋转两次就结束。图中只画了父亲在左边的情况，右边镜像处理。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="940" rx="18" fill="#f6f8fc"/>
