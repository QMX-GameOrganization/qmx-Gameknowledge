<text x="24" y="655" font-size="19" fill="#285caa" font-weight="700">情形 3：叔叔 u 是黑色（或空），z 是 p 的左孩子</text>
<text x="24" y="891" font-size="15" fill="#495b73">p 染黑，g 染红，对 g 右旋。子树根变黑，黑高不变，修复结束。</text>
