<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">红黑树插入修复的三种情形</text>
<text x="32" y="77" font-size="17" fill="#495b73">新结点 z 是红色，父亲 p 也是红色时违反性质 3；看叔叔 u（祖父 g 的另一个孩子）的颜色。</text>
<text x="24" y="135" font-size="19" fill="#285caa" font-weight="700">情形 1：叔叔 u 是红色</text>
<text x="24" y="371" font-size="15" fill="#495b73">p、u 染黑，g 染红；再把 g 当作新的 z，继续向上检查（g 是根就直接染黑）。</text>
