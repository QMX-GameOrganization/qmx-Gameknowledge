<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">Pollard&#x27;s Rho：伪随机序列在模 p 下会先成环</text>
<text x="32" y="77" font-size="17" fill="#495b73">序列 x → x² + c 对 n 取模；对因子 p 取模后的序列更早出现重复。</text>
