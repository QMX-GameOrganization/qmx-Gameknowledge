<text x="600" y="346" font-size="15" fill="#23364e" text-anchor="middle">x9</text>
<text x="60" y="450" font-size="17" fill="#285caa" font-weight="700">尾巴（rho 的柄）</text>
<text x="520" y="410" font-size="17" fill="#a33a3a" font-weight="700">环：模 p 下 x9 与 x4 相同</text>
<text x="60" y="150" font-size="16" fill="#23364e">快指针一步走两格，慢指针一步走一格，</text>
<text x="60" y="178" font-size="16" fill="#23364e">进环后两者迟早在环里相遇，</text>
<text x="60" y="206" font-size="16" fill="#23364e">此时差值是 p 的倍数。</text>
<text x="32" y="500" font-size="16" fill="#495b73">两个下标 i、j 满足 x_i ≡ x_j (mod p) 但 x_i ≠ x_j (mod n)，则 gcd(|x_i - x_j|, n) 是 n 的非平凡因子。</text>
