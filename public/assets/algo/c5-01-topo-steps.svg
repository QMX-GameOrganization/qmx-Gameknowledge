<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Kahn 算法:反复取出入度为 0 的点</title><desc id="desc">每取出一个点,就删掉它的出边,让后继的入度减 1。。取出顺序就是一个合法的拓扑序。若最后取出的点数少于 n,说明图里有环。</desc>
