<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">树状数组：c[i] 管理 (i - lowbit(i), i]</title><desc id="desc">每个 c[i] 覆盖的长度恰好是 i 的 lowbit。。lowbit(i) = i &amp; -i，即 i 的二进制里最低位的 1 对应的数。</desc>
<defs></defs>
<rect width="1000" height="580" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">树状数组：c[i] 管理 (i - lowbit(i), i]</text>
<text x="32" y="77" font-size="17" fill="#495b73">每个 c[i] 覆盖的长度恰好是 i 的 lowbit。</text>
<rect x="104.0" y="396.0" width="92" height="36" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="150.0" y="419.6" font-size="16" fill="#285caa" font-weight="700" text-anchor="middle">c1</text>
<rect x="104.0" y="346.0" width="192" height="36" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
