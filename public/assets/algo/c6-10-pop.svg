<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc">
<title id="title">维护凸壳的两个弹出规则</title><desc id="desc">队尾弹出用三点的斜率比较，队首弹出用查询斜率比较。。写成交叉相乘的形式，避免除法和浮点误差；乘积可能超过 long long，用 __int128。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="625" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">维护凸壳的两个弹出规则</text>
<text x="32" y="77" font-size="17" fill="#495b73">队尾弹出用三点的斜率比较，队首弹出用查询斜率比较。</text>
<rect x="32" y="105" width="456" height="250" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="48" y="135" font-size="17" fill="#176951" font-weight="700">加入新点 c：b 在 a、c 连线下方 → 保留</text>
<polyline points="90,186 240.0,282 390,246.0" fill="none" stroke="#176951" stroke-width="3"/>
<circle cx="90" cy="186" r="8" fill="#e8f7f1" stroke="#176951" stroke-width="3"/>
<text x="90" y="170" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">a</text>
<circle cx="240.0" cy="282" r="8" fill="#e8f7f1" stroke="#176951" stroke-width="3"/>
<text x="240.0" y="266" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">b</text>
<circle cx="390" cy="246.0" r="8" fill="#e8f7f1" stroke="#176951" stroke-width="3"/>
<text x="390" y="230.0" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">c</text>
<text x="48" y="340" font-size="15" fill="#495b73">slope(a,b) &lt; slope(b,c)：向下凸</text>
<rect x="512" y="105" width="456" height="250" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="528" y="135" font-size="17" fill="#a33a3a" font-weight="700">b 在 a、c 连线上方或线上 → 弹出 b</text>
<polyline points="570,255.0 720.0,180 870,165.0" fill="none" stroke="#a33a3a" stroke-width="3"/>
<line x1="570" y1="255.0" x2="870" y2="165.0" stroke="#66758d" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="570" cy="255.0" r="8" fill="#fdecec" stroke="#a33a3a" stroke-width="3"/>
<text x="570" y="239.0" font-size="17" fill="#a33a3a" font-weight="700" text-anchor="middle">a</text>
<circle cx="720.0" cy="180" r="8" fill="#fdecec" stroke="#a33a3a" stroke-width="3"/>
<text x="720.0" y="164" font-size="17" fill="#a33a3a" font-weight="700" text-anchor="middle">b</text>
<circle cx="870" cy="165.0" r="8" fill="#fdecec" stroke="#a33a3a" stroke-width="3"/>
<text x="870" y="149.0" font-size="17" fill="#a33a3a" font-weight="700" text-anchor="middle">c</text>
<text x="48" y="372" font-size="16" fill="#23364e">弹队尾的条件：(Yb-Ya)·(Xc-Xb) ≥ (Yc-Yb)·(Xb-Xa)，即 slope(a,b) ≥ slope(b,c)。</text>
<rect x="32" y="400" width="936" height="170" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="430" font-size="17" fill="#285caa" font-weight="700">弹队首：队首两点的斜率 ≤ 查询斜率 S[i]，说明队首以后不再最优（S 递增）</text>
<rect x="85.0" y="478.0" width="90" height="44" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="130" y="506.3" font-size="18" fill="#23364e" text-anchor="middle">q0</text>
<rect x="285.0" y="478.0" width="90" height="44" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="330" y="506.3" font-size="18" fill="#23364e" text-anchor="middle">q1</text>
<rect x="485.0" y="478.0" width="90" height="44" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="530" y="506.3" font-size="18" fill="#8c5315" font-weight="700" text-anchor="middle">q2</text>
<rect x="685.0" y="478.0" width="90" height="44" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="730" y="506.3" font-size="18" fill="#23364e" text-anchor="middle">q3</text>
<path d="M178 500L282 500" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="230.0" y="486" font-size="15" fill="#495b73" text-anchor="middle">斜率 1</text>
<path d="M378 500L482 500" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="430.0" y="486" font-size="15" fill="#495b73" text-anchor="middle">斜率 3</text>
<path d="M578 500L682 500" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="630.0" y="486" font-size="15" fill="#495b73" text-anchor="middle">斜率 5</text>
<text x="48" y="556" font-size="16" fill="#23364e">S[i] = 4：1 ≤ 4 弹 q0，3 ≤ 4 弹 q1，5 &gt; 4 停止，q2 是最优决策。</text>
<text x="32" y="605" font-size="16" fill="#495b73">写成交叉相乘的形式，避免除法和浮点误差；乘积可能超过 long long，用 __int128。</text>
</g></svg>