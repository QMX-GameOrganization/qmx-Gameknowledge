<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">区间第 k 小：两个版本相减</title><desc id="desc">数组 a = [3, 1, 4, 1, 5]，表里是每个版本中各个值出现的次数。。root[r] 的计数减去 root[l-1] 的计数，就是 a[l..r] 的值分布；在线段树上同时下降，不需要真的建出差。</desc>
<defs></defs>
<rect width="1000" height="650" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">区间第 k 小：两个版本相减</text>
<text x="32" y="77" font-size="17" fill="#495b73">数组 a = [3, 1, 4, 1, 5]，表里是每个版本中各个值出现的次数。</text>
