<rect x="290.0" y="232.0" width="80" height="38" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="330" y="256.9" font-size="17" fill="#23364e" text-anchor="middle">1</text>
