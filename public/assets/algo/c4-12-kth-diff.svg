<rect x="24" y="324" width="250" height="38" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="38" y="349" font-size="16" fill="#23364e" font-weight="700">root[4]  加入 1</text>
<rect x="290.0" y="324.0" width="80" height="38" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
