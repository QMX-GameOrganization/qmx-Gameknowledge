<text x="630" y="394.9" font-size="17" fill="#23364e" text-anchor="middle">1</text>
<rect x="24" y="428" width="250" height="38" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="38" y="453" font-size="16" fill="#23364e" font-weight="700">root[4] - root[1]</text>
<rect x="290.0" y="428.0" width="80" height="38" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="330" y="452.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">2</text>
<rect x="390.0" y="428.0" width="80" height="38" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
