<text x="32" y="505" font-size="16" fill="#23364e">查询区间 [2, 4] 的第 2 小：把 root[4] 和 root[1] 同时放到线段树根上。</text>
<text x="32" y="535" font-size="16" fill="#23364e">左半边值 {1,3} 的个数 = 3 - 1 = 2，k = 2 &lt;= 2，进左半边；再看值 {1} 的个数 = 2 &gt;= 2，进左边。</text>
<text x="32" y="565" font-size="16" fill="#176951" font-weight="700">到达叶子：值 1。a[2..4] = [1, 4, 1]，排序后的第 2 个数确实是 1。</text>
<text x="32" y="630" font-size="16" fill="#495b73">root[r] 的计数减去 root[l-1] 的计数，就是 a[l..r] 的值分布；在线段树上同时下降，不需要真的建出差。</text>
</g></svg>