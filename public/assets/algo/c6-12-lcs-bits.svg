<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="545" viewBox="0 0 1000 545" role="img" aria-labelledby="title desc">
<title id="title">把 LCS 的一整行压成一个二进制数</title><desc id="desc">S = ABCB，依次追加 T 的字符 B、C、B，f[j] = LCS(S 前 j 个字符, 当前 T)。。相邻 f 值只相差 0 或 1，所以差分序列是 m 位的 01 串；mask 里 1 的个数就是 LCS 长度。</desc>
<defs></defs>
<rect width="1000" height="545" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">把 LCS 的一整行压成一个二进制数</text>
<text x="32" y="77" font-size="17" fill="#495b73">S = ABCB，依次追加 T 的字符 B、C、B，f[j] = LCS(S 前 j 个字符, 当前 T)。</text>
<text x="48" y="135" font-size="15" fill="#495b73">S 的前 j 个字符</text>
<text x="230" y="135" font-size="15" fill="#495b73" text-anchor="middle">j=0</text>
<text x="320" y="135" font-size="15" fill="#495b73" text-anchor="middle">j=1 A</text>
<text x="410" y="135" font-size="15" fill="#495b73" text-anchor="middle">j=2 B</text>
<text x="500" y="135" font-size="15" fill="#495b73" text-anchor="middle">j=3 C</text>
<text x="590" y="135" font-size="15" fill="#495b73" text-anchor="middle">j=4 B</text>
<text x="710" y="135" font-size="15" fill="#8c5315" font-weight="700" text-anchor="middle">差分 mask</text>
<text x="48" y="196" font-size="17" fill="#23364e" font-weight="700">T = (空)</text>
<rect x="195.0" y="167.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="230" y="197.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="285.0" y="167.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="320" y="197.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="375.0" y="167.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="410" y="197.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="465.0" y="167.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="500" y="197.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="555.0" y="167.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="590" y="197.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="645.0" y="167.0" width="130" height="46" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="710" y="197.0" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0000</text>
<text x="48" y="262" font-size="17" fill="#23364e" font-weight="700">T = B</text>
<rect x="195.0" y="233.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="230" y="263.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="285.0" y="233.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="320" y="263.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="375.0" y="233.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="410" y="263.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<rect x="465.0" y="233.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="500" y="263.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<rect x="555.0" y="233.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="590" y="263.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<rect x="645.0" y="233.0" width="130" height="46" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="710" y="263.0" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0100</text>
<text x="48" y="328" font-size="17" fill="#23364e" font-weight="700">T = BC</text>
<rect x="195.0" y="299.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="230" y="329.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="285.0" y="299.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="320" y="329.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="375.0" y="299.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="410" y="329.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<rect x="465.0" y="299.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="500" y="329.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2</text>
<rect x="555.0" y="299.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="590" y="329.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2</text>
<rect x="645.0" y="299.0" width="130" height="46" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="710" y="329.0" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0110</text>
<text x="48" y="394" font-size="17" fill="#23364e" font-weight="700">T = BCB</text>
<rect x="195.0" y="365.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="230" y="395.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="285.0" y="365.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="320" y="395.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0</text>
<rect x="375.0" y="365.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="410" y="395.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<rect x="465.0" y="365.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="500" y="395.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2</text>
<rect x="555.0" y="365.0" width="70" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="590" y="395.0" font-size="20" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">3</text>
<rect x="645.0" y="365.0" width="130" height="46" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="710" y="395.0" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">0111</text>
<text x="48" y="480" font-size="16" fill="#8c5315" font-weight="700">mask 的第 j-1 位 = f[j] - f[j-1]。BCB 之后 mask = 0111，三个 1，LCS = 3。</text>
<text x="32" y="525" font-size="16" fill="#495b73">相邻 f 值只相差 0 或 1，所以差分序列是 m 位的 01 串；mask 里 1 的个数就是 LCS 长度。</text>
</g></svg>