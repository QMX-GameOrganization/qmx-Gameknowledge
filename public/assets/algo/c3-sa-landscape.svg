<title id="title">爬山会卡在局部最高点，退火能翻过山谷</title><desc id="desc">f(x) = x·sin(5x) + 0.3x，x ∈ [0, 10]。。爬山只接受更好的解；退火以概率 exp(Δ/T) 接受变差的解，所以有机会越过山谷。</desc>
