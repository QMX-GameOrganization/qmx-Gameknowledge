<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">二叉树的四种遍历顺序</title><desc id="desc">同一棵树，访问根的时机不同，得到的序列也不同。。前、中、后序是深度优先，层序是广度优先。</desc>
<defs></defs>
<rect width="1000" height="470" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">二叉树的四种遍历顺序</text>
<text x="32" y="77" font-size="17" fill="#495b73">同一棵树，访问根的时机不同，得到的序列也不同。</text>
<line x1="240" y1="150" x2="130" y2="250" stroke="#66758d" stroke-width="2"/>
<line x1="240" y1="150" x2="350" y2="250" stroke="#66758d" stroke-width="2"/>
<line x1="130" y1="250" x2="70" y2="350" stroke="#66758d" stroke-width="2"/>
<line x1="130" y1="250" x2="190" y2="350" stroke="#66758d" stroke-width="2"/>
<line x1="350" y1="250" x2="300" y2="350" stroke="#66758d" stroke-width="2"/>
<circle cx="240" cy="150" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="240" y="155.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">1</text>
<circle cx="130" cy="250" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="130" y="255.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">2</text>
<circle cx="350" cy="250" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="350" y="255.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">3</text>
<circle cx="70" cy="350" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="70" y="355.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">4</text>
<circle cx="190" cy="350" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="190" y="355.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">5</text>
<circle cx="300" cy="350" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="300" y="355.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">6</text>
<rect x="470" y="100" width="498" height="68" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="486" y="128" font-size="17" fill="#285caa" font-weight="700">前序  根 → 左 → 右</text>
<text x="486" y="157" font-size="22" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1  2  4  5  3  6</text>
<rect x="470" y="180" width="498" height="68" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="486" y="208" font-size="17" fill="#176951" font-weight="700">中序  左 → 根 → 右</text>
<text x="486" y="237" font-size="22" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">4  2  5  1  6  3</text>
<rect x="470" y="260" width="498" height="68" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="486" y="288" font-size="17" fill="#8c5315" font-weight="700">后序  左 → 右 → 根</text>
<text x="486" y="317" font-size="22" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">4  5  2  6  3  1</text>
<rect x="470" y="340" width="498" height="68" rx="12" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="486" y="368" font-size="17" fill="#5b3fa0" font-weight="700">层序  逐层从左到右</text>
<text x="486" y="397" font-size="22" fill="#23364e" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1  2  3  4  5  6</text>
<text x="32" y="450" font-size="16" fill="#495b73">前、中、后序是深度优先，层序是广度优先。</text>
</g></svg>