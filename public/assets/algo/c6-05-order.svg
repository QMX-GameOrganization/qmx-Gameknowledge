<title id="title">树形 DP 的计算顺序:后序</title><desc id="desc">先递归到叶子,回溯时才计算 dp[u];此时 u 的所有孩子都已经算完。。编号是 dp 被算出的先后顺序。dfs(u) 里先 dfs 每个孩子,再用孩子的结果更新 dp[u]。</desc>
