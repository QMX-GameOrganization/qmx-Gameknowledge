<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">ST 表：st[j][i] = 从 i 开始长度 2^j 的区间最小值</title><desc id="desc">a = [3, 1, 4, 1, 5, 9, 2, 6]，查询区间 [1, 6] 的最小值。。区间长 6，k = floor(log2(6)) = 2，答案 = min(st[2][1], st[2][3]) = 1。两段重叠不影响取最小值。</desc>
<defs></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">ST 表：st[j][i] = 从 i 开始长度 2^j 的区间最小值</text>
<text x="32" y="77" font-size="17" fill="#495b73">a = [3, 1, 4, 1, 5, 9, 2, 6]，查询区间 [1, 6] 的最小值。</text>
