<rect x="461" y="430" width="378" height="22" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="470" y="447" font-size="14" fill="#23364e">st[2][3] 覆盖 [3, 6]</text>
<text x="32" y="490" font-size="16" fill="#23364e">查询区间 [1, 6] 被这两段盖满，中间的 [3, 4] 重叠。</text>
<text x="32" y="540" font-size="16" fill="#495b73">区间长 6，k = floor(log2(6)) = 2，答案 = min(st[2][1], st[2][3]) = 1。两段重叠不影响取最小值。</text>
