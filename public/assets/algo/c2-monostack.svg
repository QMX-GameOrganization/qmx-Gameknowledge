<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">单调栈求「下一个更大的数」</title><desc id="desc">a = [2, 7, 3, 4, 8, 5]。栈内从栈底到栈顶递减，新元素更大就弹出并回答。。每个元素最多入栈一次、出栈一次，整体 O(n)。栈里剩下的 8 和 5 没有更大的数。</desc>
<defs></defs>
<rect width="1000" height="600" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">单调栈求「下一个更大的数」</text>
<text x="32" y="77" font-size="17" fill="#495b73">a = [2, 7, 3, 4, 8, 5]。栈内从栈底到栈顶递减，新元素更大就弹出并回答。</text>
<rect x="32.0" y="119.0" width="146" height="42" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="105.0" y="145.6" font-size="16" fill="#23364e" text-anchor="middle">i=0  a=2</text>
<rect x="32" y="180" width="146" height="270" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<rect x="60.0" y="379.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="105.0" y="404.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">2</text>
<text x="105.0" y="439" font-size="13" fill="#495b73" text-anchor="middle">栈底</text>
<text x="105.0" y="480" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle"></text>
<text x="105.0" y="504" font-size="14" fill="#23364e" text-anchor="middle"></text>
<rect x="188.0" y="119.0" width="146" height="42" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="261.0" y="145.6" font-size="16" fill="#23364e" text-anchor="middle">i=1  a=7</text>
<rect x="188" y="180" width="146" height="270" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<rect x="216.0" y="379.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="261.0" y="404.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">7</text>
<text x="261.0" y="439" font-size="13" fill="#495b73" text-anchor="middle">栈底</text>
<text x="261.0" y="480" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">弹出 2</text>
<text x="261.0" y="504" font-size="14" fill="#23364e" text-anchor="middle">2 的答案是 7</text>
<rect x="344.0" y="119.0" width="146" height="42" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="417.0" y="145.6" font-size="16" fill="#23364e" text-anchor="middle">i=2  a=3</text>
<rect x="344" y="180" width="146" height="270" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<rect x="372.0" y="379.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="417.0" y="404.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">7</text>
<rect x="372.0" y="331.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="417.0" y="356.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">3</text>
<text x="417.0" y="439" font-size="13" fill="#495b73" text-anchor="middle">栈底</text>
<text x="417.0" y="480" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle"></text>
<text x="417.0" y="504" font-size="14" fill="#23364e" text-anchor="middle"></text>
<rect x="500.0" y="119.0" width="146" height="42" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="573.0" y="145.6" font-size="16" fill="#23364e" text-anchor="middle">i=3  a=4</text>
<rect x="500" y="180" width="146" height="270" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<rect x="528.0" y="379.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="573.0" y="404.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">7</text>
<rect x="528.0" y="331.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="573.0" y="356.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">4</text>
<text x="573.0" y="439" font-size="13" fill="#495b73" text-anchor="middle">栈底</text>
<text x="573.0" y="480" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">弹出 3</text>
<text x="573.0" y="504" font-size="14" fill="#23364e" text-anchor="middle">3 的答案是 4</text>
<rect x="656.0" y="119.0" width="146" height="42" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="729.0" y="145.6" font-size="16" fill="#23364e" text-anchor="middle">i=4  a=8</text>
<rect x="656" y="180" width="146" height="270" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<rect x="684.0" y="379.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="729.0" y="404.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">8</text>
<text x="729.0" y="439" font-size="13" fill="#495b73" text-anchor="middle">栈底</text>
<text x="729.0" y="480" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">弹出 4 和 7</text>
<text x="729.0" y="504" font-size="14" fill="#23364e" text-anchor="middle">答案都是 8</text>
<rect x="812.0" y="119.0" width="146" height="42" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="885.0" y="145.6" font-size="16" fill="#23364e" text-anchor="middle">i=5  a=5</text>
<rect x="812" y="180" width="146" height="270" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<rect x="840.0" y="379.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="885.0" y="404.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">8</text>
<rect x="840.0" y="331.0" width="90" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="885.0" y="356.3" font-size="18" fill="#285caa" font-weight="700" text-anchor="middle">5</text>
<text x="885.0" y="439" font-size="13" fill="#495b73" text-anchor="middle">栈底</text>
<text x="885.0" y="480" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle"></text>
<text x="885.0" y="504" font-size="14" fill="#23364e" text-anchor="middle"></text>
<text x="32" y="580" font-size="16" fill="#495b73">每个元素最多入栈一次、出栈一次，整体 O(n)。栈里剩下的 8 和 5 没有更大的数。</text>
</g></svg>