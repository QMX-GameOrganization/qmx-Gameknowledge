<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">倍增表 up[k][v]：v 的第 2^k 个祖先</title><desc id="desc">每个节点只存 log n 个“跳板”，就能到达任意高度。。up[k][v] = up[k-1][ up[k-1][v] ]：先跳 2^(k-1) 步，再跳 2^(k-1) 步。</desc>
<defs></defs>
<rect width="1000" height="600" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">倍增表 up[k][v]：v 的第 2^k 个祖先</text>
<text x="32" y="77" font-size="17" fill="#495b73">每个节点只存 log n 个“跳板”，就能到达任意高度。</text>
<line x1="200" y1="150" x2="120" y2="240" stroke="#66758d" stroke-width="2"/>
<line x1="200" y1="150" x2="300" y2="240" stroke="#66758d" stroke-width="2"/>
<line x1="120" y1="240" x2="70" y2="330" stroke="#66758d" stroke-width="2"/>
<line x1="120" y1="240" x2="170" y2="330" stroke="#66758d" stroke-width="2"/>
<line x1="300" y1="240" x2="300" y2="330" stroke="#66758d" stroke-width="2"/>
<line x1="70" y1="330" x2="70" y2="420" stroke="#66758d" stroke-width="2"/>
<line x1="70" y1="420" x2="70" y2="510" stroke="#66758d" stroke-width="2"/>
<circle cx="200" cy="150" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="200" y="155.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">1</text>
<circle cx="120" cy="240" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="120" y="245.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">2</text>
<circle cx="300" cy="240" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="300" y="245.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">3</text>
<circle cx="70" cy="330" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="70" y="335.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">4</text>
<circle cx="170" cy="330" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="170" y="335.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">5</text>
<circle cx="300" cy="330" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="300" y="335.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">6</text>
<circle cx="70" cy="420" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="70" y="425.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">7</text>
<circle cx="70" cy="510" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="70" y="516.0" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">8</text>
<rect x="430" y="110" width="532" height="46" rx="6" fill="#eef1f6" stroke="#495b73" stroke-opacity=".5"/>
<text x="442" y="138.95" font-size="17" fill="#495b73" font-weight="700">v</text>
<text x="542" y="138.95" font-size="17" fill="#495b73" font-weight="700">1</text>
<text x="596" y="138.95" font-size="17" fill="#495b73" font-weight="700">2</text>
<text x="650" y="138.95" font-size="17" fill="#495b73" font-weight="700">3</text>
<text x="704" y="138.95" font-size="17" fill="#495b73" font-weight="700">4</text>
<text x="758" y="138.95" font-size="17" fill="#495b73" font-weight="700">5</text>
<text x="812" y="138.95" font-size="17" fill="#495b73" font-weight="700">6</text>
<text x="866" y="138.95" font-size="17" fill="#495b73" font-weight="700">7</text>
<text x="920" y="138.95" font-size="17" fill="#495b73" font-weight="700">8</text>
<text x="442" y="184.9" font-size="17" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">up[0]</text>
<text x="542" y="184.9" font-size="17" fill="#23364e">-</text>
<text x="596" y="184.9" font-size="17" fill="#23364e">1</text>
<text x="650" y="184.9" font-size="17" fill="#23364e">1</text>
<text x="704" y="184.9" font-size="17" fill="#23364e">2</text>
<text x="758" y="184.9" font-size="17" fill="#23364e">2</text>
<text x="812" y="184.9" font-size="17" fill="#23364e">3</text>
<text x="866" y="184.9" font-size="17" fill="#23364e">4</text>
<text x="920" y="184.9" font-size="17" fill="#23364e">7</text>
<rect x="430" y="202" width="532" height="46" rx="0" fill="#f0f3f9" stroke="#495b73" stroke-opacity="0"/>
<text x="442" y="230.9" font-size="17" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">up[1]</text>
<text x="542" y="230.9" font-size="17" fill="#23364e">-</text>
<text x="596" y="230.9" font-size="17" fill="#23364e">-</text>
<text x="650" y="230.9" font-size="17" fill="#23364e">-</text>
<text x="704" y="230.9" font-size="17" fill="#23364e">1</text>
<text x="758" y="230.9" font-size="17" fill="#23364e">1</text>
<text x="812" y="230.9" font-size="17" fill="#23364e">1</text>
<text x="866" y="230.9" font-size="17" fill="#23364e">2</text>
<text x="920" y="230.9" font-size="17" fill="#23364e">4</text>
<text x="442" y="276.9" font-size="17" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">up[2]</text>
<text x="542" y="276.9" font-size="17" fill="#23364e">-</text>
<text x="596" y="276.9" font-size="17" fill="#23364e">-</text>
<text x="650" y="276.9" font-size="17" fill="#23364e">-</text>
<text x="704" y="276.9" font-size="17" fill="#23364e">-</text>
<text x="758" y="276.9" font-size="17" fill="#23364e">-</text>
<text x="812" y="276.9" font-size="17" fill="#23364e">-</text>
<text x="866" y="276.9" font-size="17" fill="#23364e">-</text>
<text x="920" y="276.9" font-size="17" fill="#23364e">1</text>
<text x="430" y="330" font-size="16" fill="#495b73">“-”表示不存在（越过了根）。</text>
<rect x="430" y="360" width="530" height="150" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="444" y="390" font-size="19" fill="#8c5315" font-weight="700">以 8 为例</text>
<text x="444" y="418" font-size="16" fill="#23364e">up[0][8] = 7：爬 1 步</text>
<text x="444" y="443" font-size="16" fill="#23364e">up[1][8] = up[0][up[0][8]] = up[0][7] = 4：爬 2 步</text>
<text x="444" y="468" font-size="16" fill="#23364e">up[2][8] = up[1][up[1][8]] = up[1][4] = 1：爬 4 步</text>
<text x="32" y="580" font-size="16" fill="#495b73">up[k][v] = up[k-1][ up[k-1][v] ]：先跳 2^(k-1) 步，再跳 2^(k-1) 步。</text>
</g></svg>