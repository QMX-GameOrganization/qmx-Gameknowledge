<text x="40" y="372" font-size="16" fill="#23364e">橙色是一条最长序列 2 → 5 → 7 → 101;弧线表示「接在谁后面」。</text>
<text x="40" y="404" font-size="16" fill="#23364e">转移:dp[i] = max(dp[j] + 1),其中 j &lt; i 且 a[j] &lt; a[i];没有这样的 j 就是 1。</text>
<text x="32" y="450" font-size="16" fill="#495b73">dp[6] = 4 来自 7 之前最优的结尾 7(dp=3) + 1;还原时沿着前驱往回找。</text>
