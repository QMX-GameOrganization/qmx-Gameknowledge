<title id="title">LIS 的 O(n²) 做法</title><desc id="desc">dp[i] = 以 a[i] 结尾的最长严格递增子序列长度。。dp[6] = 4 来自 7 之前最优的结尾 7(dp=3) + 1;还原时沿着前驱往回找。</desc>
