<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">滑动窗口：r 向右扩张，满足条件后 l 向右收缩</title><desc id="desc">求和 ≥ 7 的最短连续子数组，a = [2,3,1,2,4,3]。。l 和 r 都只会向右移动，各走不超过 n 步，总复杂度 O(n)。</desc>
<defs></defs>
<rect width="1000" height="480" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">滑动窗口：r 向右扩张，满足条件后 l 向右收缩</text>
<text x="32" y="77" font-size="17" fill="#495b73">求和 ≥ 7 的最短连续子数组，a = [2,3,1,2,4,3]。</text>
<rect x="93.0" y="125.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="130.0" y="151.3" font-size="18" fill="#23364e" text-anchor="middle">2</text>
<text x="130.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">0</text>
<rect x="173.0" y="125.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="210.0" y="151.3" font-size="18" fill="#23364e" text-anchor="middle">3</text>
<text x="210.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">1</text>
<rect x="253.0" y="125.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="290.0" y="151.3" font-size="18" fill="#23364e" text-anchor="middle">1</text>
<text x="290.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">2</text>
<rect x="333.0" y="125.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="370.0" y="151.3" font-size="18" fill="#23364e" text-anchor="middle">2</text>
<text x="370.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">3</text>
<rect x="413.0" y="125.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="450.0" y="151.3" font-size="18" fill="#23364e" text-anchor="middle">4</text>
<text x="450.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">4</text>
<rect x="493.0" y="125.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="530.0" y="151.3" font-size="18" fill="#23364e" text-anchor="middle">3</text>
<text x="530.0" y="119" font-size="13" fill="#495b73" text-anchor="middle">5</text>
<text x="130.0" y="187" font-size="15" fill="#285caa" font-weight="700" text-anchor="middle">l</text>
<text x="370.0" y="187" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">r</text>
<text x="600" y="151" font-size="16" fill="#23364e">窗口 [0,3] 和 8 ≥ 7，记长度 4</text>
<rect x="93.0" y="237.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="130.0" y="263.3" font-size="18" fill="#23364e" text-anchor="middle">2</text>
<rect x="173.0" y="237.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="210.0" y="263.3" font-size="18" fill="#23364e" text-anchor="middle">3</text>
<rect x="253.0" y="237.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="290.0" y="263.3" font-size="18" fill="#23364e" text-anchor="middle">1</text>
<rect x="333.0" y="237.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="370.0" y="263.3" font-size="18" fill="#23364e" text-anchor="middle">2</text>
<rect x="413.0" y="237.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="450.0" y="263.3" font-size="18" fill="#23364e" text-anchor="middle">4</text>
<rect x="493.0" y="237.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="530.0" y="263.3" font-size="18" fill="#23364e" text-anchor="middle">3</text>
<text x="290.0" y="299" font-size="15" fill="#285caa" font-weight="700" text-anchor="middle">l</text>
<text x="450.0" y="299" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">r</text>
<text x="600" y="263" font-size="16" fill="#23364e">收缩后 [2,4] 和 7 ≥ 7，记长度 3</text>
<rect x="93.0" y="349.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="130.0" y="375.3" font-size="18" fill="#23364e" text-anchor="middle">2</text>
<rect x="173.0" y="349.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="210.0" y="375.3" font-size="18" fill="#23364e" text-anchor="middle">3</text>
<rect x="253.0" y="349.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="290.0" y="375.3" font-size="18" fill="#23364e" text-anchor="middle">1</text>
<rect x="333.0" y="349.0" width="74" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="370.0" y="375.3" font-size="18" fill="#23364e" text-anchor="middle">2</text>
<rect x="413.0" y="349.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="450.0" y="375.3" font-size="18" fill="#23364e" text-anchor="middle">4</text>
<rect x="493.0" y="349.0" width="74" height="40" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="530.0" y="375.3" font-size="18" fill="#23364e" text-anchor="middle">3</text>
<text x="450.0" y="411" font-size="15" fill="#285caa" font-weight="700" text-anchor="middle">l</text>
<text x="530.0" y="411" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">r</text>
<text x="600" y="375" font-size="16" fill="#23364e">再向右 [4,5] 和 7 ≥ 7，记长度 2（最优）</text>
<text x="32" y="460" font-size="16" fill="#495b73">l 和 r 都只会向右移动，各走不超过 n 步，总复杂度 O(n)。</text>
</g></svg>