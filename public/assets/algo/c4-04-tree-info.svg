<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">有根树的基本量：父亲、深度、子树大小</title><desc id="desc">从根 1 出发做一次 DFS，回溯时累加子树大小。。d：深度（根为 0）；s：子树大小（含自己）。s[u] = 1 + 所有孩子的 s。</desc>
<defs></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">有根树的基本量：父亲、深度、子树大小</text>
<text x="32" y="77" font-size="17" fill="#495b73">从根 1 出发做一次 DFS，回溯时累加子树大小。</text>
<line x1="500" y1="140" x2="320" y2="240" stroke="#66758d" stroke-width="2"/>
<line x1="500" y1="140" x2="700" y2="240" stroke="#66758d" stroke-width="2"/>
<line x1="320" y1="240" x2="220" y2="340" stroke="#66758d" stroke-width="2"/>
<line x1="320" y1="240" x2="420" y2="340" stroke="#66758d" stroke-width="2"/>
<line x1="700" y1="240" x2="700" y2="340" stroke="#66758d" stroke-width="2"/>
<line x1="420" y1="340" x2="420" y2="440" stroke="#66758d" stroke-width="2"/>
<circle cx="500" cy="140" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="500" y="145.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">1</text>
<circle cx="320" cy="240" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="320" y="245.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">2</text>
<circle cx="700" cy="240" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="700" y="245.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">3</text>
<circle cx="220" cy="340" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="220" y="345.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">4</text>
<circle cx="420" cy="340" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="420" y="345.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">5</text>
<circle cx="700" cy="340" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="700" y="345.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">6</text>
<circle cx="420" cy="440" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="420" y="445.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">7</text>
<text x="528" y="145" font-size="14" fill="#495b73">d=0 s=7</text>
<text x="348" y="245" font-size="14" fill="#495b73">d=1 s=4</text>
<text x="728" y="245" font-size="14" fill="#495b73">d=1 s=2</text>
<text x="248" y="345" font-size="14" fill="#495b73">d=2 s=1</text>
<text x="448" y="345" font-size="14" fill="#495b73">d=2 s=2</text>
<text x="728" y="345" font-size="14" fill="#495b73">d=2 s=1</text>
<text x="448" y="445" font-size="14" fill="#495b73">d=3 s=1</text>
<text x="32" y="130" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">parent[2] = 1</text>
<text x="32" y="156" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">parent[5] = 2</text>
<text x="32" y="182" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">parent[7] = 5</text>
<text x="32" y="540" font-size="16" fill="#495b73">d：深度（根为 0）；s：子树大小（含自己）。s[u] = 1 + 所有孩子的 s。</text>
</g></svg>