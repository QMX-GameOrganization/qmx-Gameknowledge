<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">高斯消元：先消成上三角，再回代</title><desc id="desc">方程组 x+y+z=6，y+2z=8，2x+5y−z=9，解为 (1, 2, 3)。。消元每一步用主元所在行去消掉下面各行同一列的数；复杂度 O(n³)。</desc>
