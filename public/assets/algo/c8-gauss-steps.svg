<text x="54" y="370" font-size="19" fill="#176951" font-weight="700">回代（从最后一行往上）</text>
<text x="54" y="398" font-size="17" fill="#23364e">−9·z = −27  →  z = 3</text>
<text x="54" y="423" font-size="17" fill="#23364e">y + 2z = 8  →  y = 8 − 6 = 2</text>
<text x="54" y="448" font-size="17" fill="#23364e">x + y + z = 6  →  x = 6 − 2 − 3 = 1</text>
<text x="32" y="500" font-size="16" fill="#495b73">消元每一步用主元所在行去消掉下面各行同一列的数；复杂度 O(n³)。</text>
