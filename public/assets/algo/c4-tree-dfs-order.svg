<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">DFS 序把子树变成连续区间</title><desc id="desc">进入节点时编号，某个节点的整棵子树会连续出现在 order 中。。节点 2 的子树对应区间 [2, 5]，可以交给前缀和、树状数组或线段树。</desc>
<defs></defs>
<rect width="1000" height="660" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">DFS 序把子树变成连续区间</text>
<text x="32" y="77" font-size="17" fill="#495b73">进入节点时编号，某个节点的整棵子树会连续出现在 order 中。</text>
<line x1="500" y1="145" x2="310" y2="285" stroke="#66758d" stroke-width="2"/>
<line x1="500" y1="145" x2="690" y2="285" stroke="#66758d" stroke-width="2"/>
<line x1="310" y1="285" x2="190" y2="445" stroke="#66758d" stroke-width="2"/>
<line x1="310" y1="285" x2="375" y2="445" stroke="#66758d" stroke-width="2"/>
<line x1="690" y1="285" x2="650" y2="445" stroke="#66758d" stroke-width="2"/>
<line x1="375" y1="445" x2="375" y2="570" stroke="#66758d" stroke-width="2"/>
<circle cx="500" cy="145" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="500" y="150.6" font-size="16" fill="#176951" font-weight="700" text-anchor="middle">1</text>
<circle cx="310" cy="285" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="310" y="290.6" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">2</text>
<circle cx="690" cy="285" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="690" y="290.6" font-size="16" fill="#285caa" font-weight="700" text-anchor="middle">3</text>
<circle cx="190" cy="445" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="190" y="450.6" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">4</text>
<circle cx="375" cy="445" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="375" y="450.6" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">5</text>
<circle cx="650" cy="445" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="650" y="450.6" font-size="16" fill="#285caa" font-weight="700" text-anchor="middle">6</text>
<circle cx="375" cy="570" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="375" y="575.6" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">7</text>
<text x="500" y="100" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">以 1 为根，先访问左子树</text>
<text x="70" y="625" font-size="17" fill="#495b73" font-weight="700">进入顺序</text>
<rect x="175" y="592" width="92" height="42" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".6"/>
<text x="221.0" y="619.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<rect x="267" y="592" width="92" height="42" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="313.0" y="619.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<rect x="359" y="592" width="92" height="42" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="405.0" y="619.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<rect x="451" y="592" width="92" height="42" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="497.0" y="619.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<rect x="543" y="592" width="92" height="42" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".6"/>
<text x="589.0" y="619.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">7</text>
<rect x="635" y="592" width="92" height="42" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".6"/>
<text x="681.0" y="619.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<rect x="727" y="592" width="92" height="42" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".6"/>
<text x="773.0" y="619.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">6</text>
<text x="175" y="565" font-size="14" fill="#495b73">位置</text>
<text x="221" y="582" font-size="13" fill="#495b73" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<text x="313" y="582" font-size="13" fill="#495b73" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2</text>
<text x="405" y="582" font-size="13" fill="#495b73" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">3</text>
<text x="497" y="582" font-size="13" fill="#495b73" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">4</text>
<text x="589" y="582" font-size="13" fill="#495b73" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">5</text>
<text x="681" y="582" font-size="13" fill="#495b73" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">6</text>
<text x="773" y="582" font-size="13" fill="#495b73" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">7</text>
<text x="710" y="565" font-size="16" fill="#8c5315" font-weight="700">subtree(2) = order[2..5]</text>
<text x="32" y="640" font-size="16" fill="#495b73">节点 2 的子树对应区间 [2, 5]，可以交给前缀和、树状数组或线段树。</text>
</g></svg>