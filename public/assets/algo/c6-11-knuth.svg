<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Knuth 优化：决策点被左、下两格夹住</title><desc id="desc">f[l][r] 的最优分割点 opt[l][r] 满足 opt[l][r-1] ≤ opt[l][r] ≤ opt[l+1][r]。。固定区间长度后，所有区间的枚举范围首尾相接，总共只有 O(n) 次，整张表 O(n²)。</desc>
