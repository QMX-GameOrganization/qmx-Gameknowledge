<rect x="600" y="150" width="368" height="330" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="616" y="182" font-size="19" fill="#8c5315" font-weight="700">怎么读这张表</text>
<text x="616" y="218" font-size="16" fill="#8c5315" font-weight="700">橙色：要计算的 opt[2][5]</text>
<text x="616" y="246" font-size="16" fill="#285caa" font-weight="700">蓝色：左边一格 opt[2][4]，下界</text>
<text x="616" y="274" font-size="16" fill="#176951" font-weight="700">绿色：下边一格 opt[3][5]，上界</text>
<text x="616" y="302" font-size="16" fill="#23364e"></text>
<text x="616" y="330" font-size="16" fill="#23364e">于是枚举 k 只需</text>
<text x="616" y="358" font-size="16" fill="#23364e">从 opt[2][4] 到 opt[3][5]。</text>
<text x="616" y="386" font-size="16" fill="#23364e"></text>
<text x="616" y="414" font-size="16" fill="#23364e">按区间长度从小到大算，</text>
<text x="616" y="442" font-size="16" fill="#23364e">左、下两格一定已经算好。</text>
<text x="32" y="580" font-size="16" fill="#495b73">固定区间长度后，所有区间的枚举范围首尾相接，总共只有 O(n) 次，整张表 O(n²)。</text>
