<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">中国剩余定理：(x mod 3, x mod 5) 与 0..14 一一对应</title><desc id="desc">表中每个格子写的是满足该组余数的 x。例：x ≡ 2 (mod 3) 且 x ≡ 3 (mod 5)，答案落在 x = 8。。继续合并 x ≡ 2 (mod 7)：8 + 15k ≡ 2 (mod 7)，得 k = 1，x ≡ 23 (mod 105)。</desc>
<defs></defs>
<rect width="1000" height="520" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">中国剩余定理：(x mod 3, x mod 5) 与 0..14 一一对应</text>
<text x="32" y="77" font-size="17" fill="#495b73">表中每个格子写的是满足该组余数的 x。例：x ≡ 2 (mod 3) 且 x ≡ 3 (mod 5)，答案落在 x = 8。</text>
<text x="180" y="128" font-size="16" fill="#495b73" font-weight="700">x mod 5 =</text>
<rect x="280.0" y="100.0" width="100" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="330" y="126.3" font-size="18" fill="#495b73" font-weight="700" text-anchor="middle">0</text>
<rect x="400.0" y="100.0" width="100" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="450" y="126.3" font-size="18" fill="#495b73" font-weight="700" text-anchor="middle">1</text>
<rect x="520.0" y="100.0" width="100" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="570" y="126.3" font-size="18" fill="#495b73" font-weight="700" text-anchor="middle">2</text>
<rect x="640.0" y="100.0" width="100" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="690" y="126.3" font-size="18" fill="#495b73" font-weight="700" text-anchor="middle">3</text>
<rect x="760.0" y="100.0" width="100" height="40" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="810" y="126.3" font-size="18" fill="#495b73" font-weight="700" text-anchor="middle">4</text>
<rect x="35.0" y="170.0" width="150" height="60" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="110" y="205.6" font-size="16" fill="#495b73" font-weight="700" text-anchor="middle">x mod 3 = 0</text>
<rect x="280.0" y="170.0" width="100" height="60" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="330" y="207.7" font-size="22" fill="#23364e" text-anchor="middle">0</text>
<rect x="400.0" y="170.0" width="100" height="60" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="450" y="207.7" font-size="22" fill="#23364e" text-anchor="middle">6</text>
<rect x="520.0" y="170.0" width="100" height="60" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="570" y="207.7" font-size="22" fill="#23364e" text-anchor="middle">12</text>
<rect x="640.0" y="170.0" width="100" height="60" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="690" y="207.7" font-size="22" fill="#23364e" text-anchor="middle">3</text>
<rect x="760.0" y="170.0" width="100" height="60" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="810" y="207.7" font-size="22" fill="#23364e" text-anchor="middle">9</text>
<rect x="35.0" y="250.0" width="150" height="60" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="110" y="285.6" font-size="16" fill="#495b73" font-weight="700" text-anchor="middle">x mod 3 = 1</text>
<rect x="280.0" y="250.0" width="100" height="60" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="330" y="287.7" font-size="22" fill="#23364e" text-anchor="middle">10</text>
<rect x="400.0" y="250.0" width="100" height="60" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="450" y="287.7" font-size="22" fill="#23364e" text-anchor="middle">1</text>
<rect x="520.0" y="250.0" width="100" height="60" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="570" y="287.7" font-size="22" fill="#23364e" text-anchor="middle">7</text>
<rect x="640.0" y="250.0" width="100" height="60" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="690" y="287.7" font-size="22" fill="#23364e" text-anchor="middle">13</text>
<rect x="760.0" y="250.0" width="100" height="60" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="810" y="287.7" font-size="22" fill="#23364e" text-anchor="middle">4</text>
<rect x="35.0" y="330.0" width="150" height="60" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="110" y="365.6" font-size="16" fill="#495b73" font-weight="700" text-anchor="middle">x mod 3 = 2</text>
<rect x="280.0" y="330.0" width="100" height="60" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="330" y="367.7" font-size="22" fill="#23364e" text-anchor="middle">5</text>
<rect x="400.0" y="330.0" width="100" height="60" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="450" y="367.7" font-size="22" fill="#23364e" text-anchor="middle">11</text>
<rect x="520.0" y="330.0" width="100" height="60" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="570" y="367.7" font-size="22" fill="#23364e" text-anchor="middle">2</text>
<rect x="640.0" y="330.0" width="100" height="60" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="690" y="367.7" font-size="22" fill="#176951" font-weight="700" text-anchor="middle">8</text>
<rect x="760.0" y="330.0" width="100" height="60" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="810" y="367.7" font-size="22" fill="#23364e" text-anchor="middle">14</text>
<text x="40" y="450" font-size="16" fill="#23364e">橙色是满足单个条件的数（x ≡ 2 mod 3 的一整行，x ≡ 3 mod 5 的一整列），绿色是两者的交点。</text>
<text x="32" y="500" font-size="16" fill="#495b73">继续合并 x ≡ 2 (mod 7)：8 + 15k ≡ 2 (mod 7)，得 k = 1，x ≡ 23 (mod 105)。</text>
</g></svg>