<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="575" viewBox="0 0 1000 575" role="img" aria-labelledby="title desc">
<title id="title">Floyd 求最小环：环上编号最大的点是 k</title><desc id="desc">在 d 还没把 k 当中转点之前，枚举 i、j 与 k 围成的环。。环长 = d[i][j] + w[i][k] + w[k][j]，要求 i ≠ j 且都小于 k。</desc>
<defs></defs>
<rect width="1000" height="575" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">Floyd 求最小环：环上编号最大的点是 k</text>
<text x="32" y="77" font-size="17" fill="#495b73">在 d 还没把 k 当中转点之前，枚举 i、j 与 k 围成的环。</text>
<rect x="32" y="105" width="520" height="400" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<path d="M162.0 210.0L358.0 210.0" fill="none" stroke="#a33a3a" stroke-width="4"/>
<rect x="240.0" y="198.0" width="40" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="260.0" y="214.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2</text>
<path d="M380.0 232.0L380.0 378.0" fill="none" stroke="#a33a3a" stroke-width="4"/>
<rect x="360.0" y="293.0" width="40" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="380.0" y="309.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2</text>
<path d="M358.0 400.0L162.0 400.0" fill="none" stroke="#a33a3a" stroke-width="4"/>
<rect x="240.0" y="388.0" width="40" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="260.0" y="404.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<path d="M140.0 378.0L140.0 232.0" fill="none" stroke="#a33a3a" stroke-width="4"/>
<rect x="120.0" y="293.0" width="40" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="140.0" y="309.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1</text>
<path d="M157.2 223.7L362.8 386.3" fill="none" stroke="#495b73" stroke-width="2"/>
<rect x="192.0" y="255.0" width="40" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="212.0" y="271.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">5</text>
<circle cx="140" cy="210" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="140" y="215.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="380" cy="210" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="380" y="215.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<circle cx="380" cy="400" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="380" y="405.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<circle cx="140" cy="400" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="140" y="405.95" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">4</text>
<text x="48" y="140" font-size="15" fill="#495b73">红色：最小环 1-2-3-4-1，长度 6</text>
<rect x="570" y="105" width="398" height="400" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="586" y="137" font-size="19" fill="#495b73" font-weight="700">k = 4 时</text>
<text x="586" y="175" font-size="14" fill="#23364e">此时 d 只用了点 1、2、3 作中转：</text>
<text x="586" y="207" font-size="14" fill="#23364e">d[1][3] = min(5, 2+2) = 4</text>
<text x="586" y="239" font-size="14" fill="#23364e">取 i=1，j=3：</text>
<text x="586" y="271" font-size="14" fill="#23364e">环长 = 4 + w[1][4] + w[4][3]</text>
<text x="586" y="303" font-size="14" fill="#23364e">       = 4 + 1 + 1 = 6</text>
<text x="586" y="335" font-size="14" fill="#23364e">k = 3 时，i=1，j=2：</text>
<text x="586" y="367" font-size="14" fill="#23364e">环长 = 2 + 5 + 2 = 9</text>
<text x="586" y="399" font-size="14" fill="#23364e">全局取最小值 6。</text>
<text x="32" y="555" font-size="16" fill="#495b73">环长 = d[i][j] + w[i][k] + w[k][j]，要求 i ≠ j 且都小于 k。</text>
</g></svg>