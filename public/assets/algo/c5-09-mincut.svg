<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">最小割：最大流结束后，从 s 在残量网络里能到的点就是 S 侧</title><desc id="desc">边的标注是 已流量/容量。。割边必为满边，容量之和等于最大流 4。</desc>
<defs><marker id="m495b73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#495b73"/></marker><marker id="ma33a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a33a3a"/></marker></defs>
<rect width="1000" height="590" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">最小割：最大流结束后，从 s 在残量网络里能到的点就是 S 侧</text>
<text x="32" y="77" font-size="17" fill="#495b73">边的标注是 已流量/容量。</text>
<rect x="32" y="105" width="600" height="420" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<path d="M129.5 299.8L297.9 211.6" fill="none" stroke="#495b73" stroke-width="2" marker-end="url(#m495b73)"/>
<rect x="193.0" y="243.0" width="44" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="215.0" y="259.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2/3</text>
<path d="M339.5 210.2L507.9 298.4" fill="none" stroke="#a33a3a" stroke-width="3" marker-end="url(#ma33a3a)"/>
<rect x="403.0" y="243.0" width="44" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="425.0" y="259.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2/2</text>
<path d="M129.5 320.2L297.9 408.4" fill="none" stroke="#a33a3a" stroke-width="3" marker-end="url(#ma33a3a)"/>
<rect x="193.0" y="353.0" width="44" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="215.0" y="369.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2/2</text>
<path d="M339.5 409.8L507.9 321.6" fill="none" stroke="#495b73" stroke-width="2" marker-end="url(#m495b73)"/>
<rect x="403.0" y="353.0" width="44" height="24" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="425.0" y="369.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2/3</text>
<circle cx="110" cy="310" r="22" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="110" y="315.95" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">s</text>
<circle cx="320" cy="200" r="22" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="320" y="205.95" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">a</text>
<circle cx="320" cy="420" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="320" y="425.95" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">b</text>
<circle cx="530" cy="310" r="22" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="530" y="315.95" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">t</text>
<text x="48" y="140" font-size="16" fill="#495b73">绿色：S 侧   橙色：T 侧   红色粗线：割边</text>
<rect x="650" y="105" width="318" height="420" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="666" y="137" font-size="19" fill="#495b73" font-weight="700">怎么得到割</text>
<text x="666" y="172" font-size="14" fill="#23364e">① 跑完最大流，流量为 4。</text>
<text x="666" y="202" font-size="14" fill="#23364e">② 从 s 沿“剩余容量&gt;0”的</text>
<text x="666" y="232" font-size="14" fill="#23364e">边走：s→a 还剩 1，到 a。</text>
<text x="666" y="262" font-size="14" fill="#23364e">③ a→t、s→b 已满，停下。</text>
<text x="666" y="292" font-size="14" fill="#23364e">④ S = {s, a}，T = {b, t}。</text>
<text x="666" y="322" font-size="14" fill="#23364e">⑤ S 到 T 的原边：</text>
<text x="666" y="352" font-size="14" fill="#23364e">a→t（2）和 s→b（2），</text>
<text x="666" y="382" font-size="14" fill="#23364e">容量和 4 = 最大流。</text>
<text x="32" y="570" font-size="16" fill="#495b73">割边必为满边，容量之和等于最大流 4。</text>
</g></svg>