<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">插入分隔符，把偶回文变成奇回文</title><desc id="desc">s = abaaba → t = #a#b#a#a#b#a#；p[i] 是 t 中以 i 为中心的回文半径（含中心）。。原串回文长度 = p[i] - 1；起点 = (i - p[i] + 1) / 2。</desc>
