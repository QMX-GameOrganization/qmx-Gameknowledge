<text x="36" y="372" font-size="16" fill="#8c5315" font-weight="700">i=6（# 在两个 a 之间）：p=7，覆盖整个 t，原串长度 7-1 = 6，即 abaaba。</text>
<text x="36" y="402" font-size="16" fill="#176951" font-weight="700">i=3（字符 b）：p=4，覆盖 t[0..6]，原串长度 3，即 aba。</text>
<text x="32" y="450" font-size="16" fill="#495b73">原串回文长度 = p[i] - 1；起点 = (i - p[i] + 1) / 2。</text>
