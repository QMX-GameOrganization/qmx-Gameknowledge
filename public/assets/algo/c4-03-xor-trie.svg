<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">01 字典树求最大异或</title><desc id="desc">集合 {2, 5, 6}，查询 x = 3 与集合中某个数异或的最大值。。每一位尽量走与 x 相反的边：3 的二进制是 011，想要 100，最终走到 5，3 xor 5 = 6。</desc>
<defs></defs>
<rect width="1000" height="600" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">01 字典树求最大异或</text>
<text x="32" y="77" font-size="17" fill="#495b73">集合 {2, 5, 6}，查询 x = 3 与集合中某个数异或的最大值。</text>
<line x1="500" y1="130" x2="300" y2="215" stroke="#66758d" stroke-width="2"/>
<text x="386.0" y="177.5" font-size="15" fill="#495b73" font-weight="700" text-anchor="middle">0</text>
<line x1="500" y1="130" x2="700" y2="215" stroke="#8c5315" stroke-width="4"/>
<text x="614.0" y="177.5" font-size="15" fill="#495b73" font-weight="700" text-anchor="middle">1</text>
<line x1="300" y1="215" x2="300" y2="300" stroke="#66758d" stroke-width="2"/>
<text x="286.0" y="262.5" font-size="15" fill="#495b73" font-weight="700" text-anchor="middle">1</text>
<line x1="700" y1="215" x2="580" y2="300" stroke="#8c5315" stroke-width="4"/>
<text x="626.0" y="262.5" font-size="15" fill="#495b73" font-weight="700" text-anchor="middle">0</text>
<line x1="700" y1="215" x2="820" y2="300" stroke="#66758d" stroke-width="2"/>
<text x="774.0" y="262.5" font-size="15" fill="#495b73" font-weight="700" text-anchor="middle">1</text>
<line x1="300" y1="300" x2="300" y2="385" stroke="#66758d" stroke-width="2"/>
<text x="286.0" y="347.5" font-size="15" fill="#495b73" font-weight="700" text-anchor="middle">0</text>
<line x1="580" y1="300" x2="580" y2="385" stroke="#8c5315" stroke-width="4"/>
<text x="566.0" y="347.5" font-size="15" fill="#495b73" font-weight="700" text-anchor="middle">1</text>
<line x1="820" y1="300" x2="820" y2="385" stroke="#66758d" stroke-width="2"/>
<text x="806.0" y="347.5" font-size="15" fill="#495b73" font-weight="700" text-anchor="middle">0</text>
<circle cx="500" cy="130" r="20" fill="#eef1f6" stroke="#495b73" stroke-width="2"/>
<text x="500" y="135.9" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle"></text>
<circle cx="300" cy="215" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="300" y="220.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle"></text>
<circle cx="700" cy="215" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="700" y="220.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle"></text>
<circle cx="300" cy="300" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="300" y="305.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle"></text>
<circle cx="580" cy="300" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="580" y="305.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle"></text>
<circle cx="820" cy="300" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="820" y="305.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle"></text>
<circle cx="300" cy="385" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="300" y="390.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">2</text>
<circle cx="580" cy="385" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="580" y="390.9" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">5</text>
<circle cx="820" cy="385" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="820" y="390.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">6</text>
<text x="32" y="177" font-size="15" fill="#495b73">第 2 位</text>
<text x="32" y="262" font-size="15" fill="#495b73">第 1 位</text>
<text x="32" y="347" font-size="15" fill="#495b73">第 0 位</text>
<text x="32" y="440" font-size="16" fill="#23364e">x = 011：第 2 位是 0，想走 1，存在，走。</text>
<text x="32" y="467" font-size="16" fill="#23364e">第 1 位是 1，想走 0，存在，走。</text>
<text x="32" y="494" font-size="16" fill="#23364e">第 0 位是 1，想走 0，不存在，只能走 1，到达 5。</text>
<text x="32" y="521" font-size="16" fill="#23364e">验证：3^2=1，3^5=6，3^6=5，最大是 6。</text>
<text x="32" y="580" font-size="16" fill="#495b73">每一位尽量走与 x 相反的边：3 的二进制是 011，想要 100，最终走到 5，3 xor 5 = 6。</text>
</g></svg>