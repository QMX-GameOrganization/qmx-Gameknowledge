<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">两条性质:切割性质与环性质</title><desc id="desc">它们解释了 Kruskal 和 Prim 为什么贪心是对的。。切割性质管&quot;选哪条&quot;,环性质管&quot;丢哪条&quot;。</desc>
<defs></defs>
<rect width="1000" height="550" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">两条性质:切割性质与环性质</text>
<text x="32" y="77" font-size="17" fill="#495b73">它们解释了 Kruskal 和 Prim 为什么贪心是对的。</text>
<rect x="32" y="105" width="470" height="380" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="137" font-size="19" fill="#285caa" font-weight="700">切割性质</text>
<text x="48" y="165" font-size="15" fill="#23364e">把点分成 S 和 V\S 两部分,横跨两部分的边里</text>
<text x="48" y="188" font-size="15" fill="#23364e">最小的一条必在某棵最小生成树里。</text>
<ellipse cx="150" cy="340" rx="90" ry="100" fill="#ffffff" fill-opacity=".7" stroke="#285caa" stroke-dasharray="6 5"/>
<ellipse cx="390" cy="340" rx="90" ry="100" fill="#ffffff" fill-opacity=".7" stroke="#8c5315" stroke-dasharray="6 5"/>
<circle cx="120" cy="290" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="120" y="295.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">a</text>
<circle cx="160" cy="380" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="160" y="385.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">b</text>
<circle cx="190" cy="310" r="18" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="190" y="315.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">c</text>
<circle cx="350" cy="290" r="18" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="350" y="295.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">x</text>
<circle cx="420" cy="310" r="18" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="420" y="315.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">y</text>
<circle cx="380" cy="390" r="18" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="380" y="395.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">z</text>
<path d="M137.3 294.9L172.7 305.1" fill="none" stroke="#66758d" stroke-width="2"/>
<rect x="144.0" y="289.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="155.0" y="305.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">2</text>
<path d="M367.3 294.9L402.7 305.1" fill="none" stroke="#66758d" stroke-width="2"/>
<rect x="374.0" y="289.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="385.0" y="305.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">6</text>
<path d="M207.9 307.8L332.1 292.2" fill="none" stroke="#176951" stroke-width="4"/>
<rect x="259.0" y="275.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="270.0" y="291.0" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">3</text>
<path d="M208.0 310.0L402.0 310.0" fill="none" stroke="#a33a3a" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="282.5" y="311.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="293.5" y="327.0" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">7</text>
<path d="M178.0 380.8L362.0 389.2" fill="none" stroke="#a33a3a" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="259.0" y="386.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="270.0" y="402.0" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">5</text>
<text x="150" y="460" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">S</text>
<text x="390" y="460" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">V \ S</text>
<text x="270" y="226" font-size="14" fill="#176951" font-weight="700" text-anchor="middle">横跨的边:3、5、7,最小的 3 一定可选</text>
<rect x="518" y="105" width="450" height="380" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="534" y="137" font-size="19" fill="#a33a3a" font-weight="700">环性质</text>
<text x="534" y="165" font-size="15" fill="#23364e">一个环里权最大的边</text>
<text x="534" y="188" font-size="15" fill="#23364e">(且唯一最大时)不在任何最小生成树里。</text>
<path d="M658.0 300.0L782.0 300.0" fill="none" stroke="#66758d" stroke-width="2"/>
<rect x="709.0" y="289.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="720.0" y="305.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">2</text>
<path d="M810.3 314.7L859.7 385.3" fill="none" stroke="#66758d" stroke-width="2"/>
<rect x="824.0" y="339.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="835.0" y="355.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">4</text>
<path d="M852.6 404.6L737.4 435.4" fill="none" stroke="#66758d" stroke-width="2"/>
<rect x="784.0" y="409.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="795.0" y="425.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">5</text>
<path d="M711.1 424.4L648.9 315.6" fill="none" stroke="#a33a3a" stroke-width="4" stroke-dasharray="6 5"/>
<rect x="669.0" y="359.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="680.0" y="375.0" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">9</text>
<circle cx="640" cy="300" r="18" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="640" y="305.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">a</text>
<circle cx="800" cy="300" r="18" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="800" y="305.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">b</text>
<circle cx="870" cy="400" r="18" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="870" y="405.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">c</text>
<circle cx="720" cy="440" r="18" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="720" y="445.6" font-size="16" fill="#23364e" font-weight="700" text-anchor="middle">d</text>
<text x="534" y="238" font-size="14" fill="#a33a3a" font-weight="700">环 a-b-c-d 中最大边是 d-a(9),</text>
<text x="534" y="260" font-size="14" fill="#a33a3a" font-weight="700">剩下三条已经把四个点连通,丢掉它不吃亏。</text>
<text x="32" y="530" font-size="16" fill="#495b73">切割性质管&quot;选哪条&quot;,环性质管&quot;丢哪条&quot;。</text>
</g></svg>