<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">隔板法：10 个相同的球放进 4 个盒子，每盒至少 1 个</title><desc id="desc">10 个球之间有 9 个空隙，在其中选 3 个空隙放隔板，就把球分成 4 段。。每盒可以为空时，先每盒借 1 个球变成 14 个球，答案是 C(13, 3)；至少 1 个时是 C(9, 3) = 84。</desc>
<defs></defs>
<rect width="1000" height="440" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">隔板法：10 个相同的球放进 4 个盒子，每盒至少 1 个</text>
<text x="32" y="77" font-size="17" fill="#495b73">10 个球之间有 9 个空隙，在其中选 3 个空隙放隔板，就把球分成 4 段。</text>
<circle cx="70" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="70" y="196" font-size="16" fill="#23364e" text-anchor="middle">1</text>
<circle cx="158" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="158" y="196" font-size="16" fill="#23364e" text-anchor="middle">2</text>
<circle cx="246" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="246" y="196" font-size="16" fill="#23364e" text-anchor="middle">3</text>
<circle cx="334" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="334" y="196" font-size="16" fill="#23364e" text-anchor="middle">4</text>
<circle cx="422" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="422" y="196" font-size="16" fill="#23364e" text-anchor="middle">5</text>
<circle cx="510" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="510" y="196" font-size="16" fill="#23364e" text-anchor="middle">6</text>
<circle cx="598" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="598" y="196" font-size="16" fill="#23364e" text-anchor="middle">7</text>
<circle cx="686" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="686" y="196" font-size="16" fill="#23364e" text-anchor="middle">8</text>
<circle cx="774" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="774" y="196" font-size="16" fill="#23364e" text-anchor="middle">9</text>
<circle cx="862" cy="190" r="22" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="862" y="196" font-size="16" fill="#23364e" text-anchor="middle">10</text>
<line x1="114.0" y1="165" x2="114.0" y2="215" stroke="#c4ccda" stroke-width="2" stroke-dasharray="4 4"/>
<text x="114.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙1</text>
<line x1="202.0" y1="165" x2="202.0" y2="215" stroke="#c4ccda" stroke-width="2" stroke-dasharray="4 4"/>
<text x="202.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙2</text>
<line x1="290.0" y1="145" x2="290.0" y2="235" stroke="#a33a3a" stroke-width="5" stroke-linecap="round"/>
<text x="290.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙3</text>
<line x1="378.0" y1="165" x2="378.0" y2="215" stroke="#c4ccda" stroke-width="2" stroke-dasharray="4 4"/>
<text x="378.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙4</text>
<line x1="466.0" y1="145" x2="466.0" y2="235" stroke="#a33a3a" stroke-width="5" stroke-linecap="round"/>
<text x="466.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙5</text>
<line x1="554.0" y1="165" x2="554.0" y2="215" stroke="#c4ccda" stroke-width="2" stroke-dasharray="4 4"/>
<text x="554.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙6</text>
<line x1="642.0" y1="165" x2="642.0" y2="215" stroke="#c4ccda" stroke-width="2" stroke-dasharray="4 4"/>
<text x="642.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙7</text>
<line x1="730.0" y1="165" x2="730.0" y2="215" stroke="#c4ccda" stroke-width="2" stroke-dasharray="4 4"/>
<text x="730.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙8</text>
<line x1="818.0" y1="145" x2="818.0" y2="235" stroke="#a33a3a" stroke-width="5" stroke-linecap="round"/>
<text x="818.0" y="262" font-size="12" fill="#495b73" text-anchor="middle">空隙9</text>
<rect x="42.0" y="300" width="232" height="54" rx="10" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="158.0" y="334" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">盒 A：3 个</text>
<rect x="306.0" y="300" width="144" height="54" rx="10" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="378.0" y="334" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">盒 B：2 个</text>
<rect x="482.0" y="300" width="320" height="54" rx="10" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="642.0" y="334" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">盒 C：4 个</text>
<rect x="807.0" y="300" width="110" height="54" rx="10" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="862.0" y="334" font-size="17" fill="#5b3fa0" font-weight="700" text-anchor="middle">盒 D：1 个</text>
<text x="40" y="395" font-size="16" fill="#23364e">选出的隔板位置 {空隙3, 空隙5, 空隙9} 与一种放法一一对应，所以方案数就是 C(9, 3)。</text>
<text x="32" y="420" font-size="16" fill="#495b73">每盒可以为空时，先每盒借 1 个球变成 14 个球，答案是 C(13, 3)；至少 1 个时是 C(9, 3) = 84。</text>
</g></svg>