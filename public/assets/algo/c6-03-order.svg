<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">一维背包:内层循环为什么要倒序</title><desc id="desc">只有一件物品 (重量 2,价值 3),容量 6。同一份代码,仅循环方向不同。。倒序时 dp[j-w] 还是上一件物品之后的旧值;正序时已被本轮更新,同一件物品被重复使用。</desc>
<defs></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">一维背包:内层循环为什么要倒序</text>
<text x="32" y="77" font-size="17" fill="#495b73">只有一件物品 (重量 2,价值 3),容量 6。同一份代码,仅循环方向不同。</text>
<rect x="32" y="112" width="936" height="190" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="48" y="146" font-size="19" fill="#176951" font-weight="700">倒序 j = 6 → 2(01 背包)</text>
<text x="150" y="182" font-size="14" fill="#495b73" text-anchor="middle">j=0</text>
<rect x="108.0" y="197.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="150" y="227.3" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">0</text>
<text x="246" y="182" font-size="14" fill="#495b73" text-anchor="middle">j=1</text>
<rect x="204.0" y="197.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="246" y="227.3" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">0</text>
<text x="342" y="182" font-size="14" fill="#495b73" text-anchor="middle">j=2</text>
<rect x="300.0" y="197.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="342" y="227.3" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<text x="438" y="182" font-size="14" fill="#495b73" text-anchor="middle">j=3</text>
<rect x="396.0" y="197.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="438" y="227.3" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<text x="534" y="182" font-size="14" fill="#495b73" text-anchor="middle">j=4</text>
<rect x="492.0" y="197.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="534" y="227.3" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<text x="630" y="182" font-size="14" fill="#495b73" text-anchor="middle">j=5</text>
<rect x="588.0" y="197.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="630" y="227.3" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<text x="726" y="182" font-size="14" fill="#495b73" text-anchor="middle">j=6</text>
<rect x="684.0" y="197.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="726" y="227.3" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<text x="48" y="282" font-size="15" fill="#23364e">每个 dp[j] 读到的 dp[j-2] 都是本轮之前的值,物品最多放 1 件。</text>
<rect x="825.0" y="129.0" width="130" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="890" y="151.2" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">正确</text>
<rect x="32" y="322" width="936" height="190" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="48" y="356" font-size="19" fill="#a33a3a" font-weight="700">正序 j = 2 → 6(完全背包)</text>
<text x="150" y="392" font-size="14" fill="#495b73" text-anchor="middle">j=0</text>
<rect x="108.0" y="407.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="150" y="437.4" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">0</text>
<text x="246" y="392" font-size="14" fill="#495b73" text-anchor="middle">j=1</text>
<rect x="204.0" y="407.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="246" y="437.4" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">0</text>
<text x="342" y="392" font-size="14" fill="#495b73" text-anchor="middle">j=2</text>
<rect x="300.0" y="407.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="342" y="437.4" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<text x="438" y="392" font-size="14" fill="#495b73" text-anchor="middle">j=3</text>
<rect x="396.0" y="407.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="438" y="437.4" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<text x="534" y="392" font-size="14" fill="#495b73" text-anchor="middle">j=4</text>
<rect x="492.0" y="407.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="534" y="437.4" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">6</text>
<text x="630" y="392" font-size="14" fill="#495b73" text-anchor="middle">j=5</text>
<rect x="588.0" y="407.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="630" y="437.4" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">6</text>
<text x="726" y="392" font-size="14" fill="#495b73" text-anchor="middle">j=6</text>
<rect x="684.0" y="407.0" width="84" height="46" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="726" y="437.4" font-size="21" fill="#66758d" font-weight="700" text-anchor="middle">9</text>
<text x="48" y="492" font-size="15" fill="#23364e">dp[4] 读到的 dp[2] 已经是 3,等于放了第二件;dp[6] = 9 放了 3 件。</text>
<rect x="825.0" y="339.0" width="130" height="34" rx="8" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="890" y="361.2" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">放进了多件</text>
<text x="32" y="540" font-size="16" fill="#495b73">倒序时 dp[j-w] 还是上一件物品之后的旧值;正序时已被本轮更新,同一件物品被重复使用。</text>
</g></svg>