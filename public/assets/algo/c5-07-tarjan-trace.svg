<title id="title">Tarjan 在一张小图上的执行过程</title><desc id="desc">圆旁的标签是 dfn/low，红色虚线是回到栈内的边。。先弹出的分量编号小：SCC 1 = {4,5,6}，SCC 2 = {1,2,3}。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">Tarjan 在一张小图上的执行过程</text>
<text x="32" y="77" font-size="17" fill="#495b73">圆旁的标签是 dfn/low，红色虚线是回到栈内的边。</text>
<rect x="32" y="105" width="570" height="400" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
