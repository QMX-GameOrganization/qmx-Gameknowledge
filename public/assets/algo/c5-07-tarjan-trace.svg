<path d="M396.4 325.4L451.3 276.6" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M470.0 282.0L470.0 405.0" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M189.1 333.3Q137.3 316.7 112.2 271.8" fill="none" stroke="#a33a3a" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="111.5,270.5 125.1,280.6 112.9,287.5" fill="#a33a3a"/>
<path d="M449.5 422.0Q405.2 404.8 389.1 363.3" fill="none" stroke="#a33a3a" stroke-width="2" stroke-dasharray="6 5"/>
<polygon points="388.5,361.9 400.7,373.8 387.6,378.9" fill="#a33a3a"/>
<circle cx="100" cy="250" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="100" y="255.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="210" cy="170" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="210" y="175.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<circle cx="210" cy="340" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="210" y="345.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<circle cx="380" cy="340" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="380" y="345.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<circle cx="470" cy="260" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="470" y="265.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">5</text>
<circle cx="470" cy="430" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="470" y="435.95" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle">6</text>
<rect x="80.0" y="192.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="100" y="209.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">1/1</text>
<rect x="138.0" y="151.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="158" y="168.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">2/1</text>
<rect x="190.0" y="369.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="210" y="386.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">3/1</text>
<rect x="345.0" y="285.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="365" y="302.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">4/4</text>
<rect x="512.0" y="247.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="532" y="264.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">5/4</text>
<rect x="512.0" y="417.0" width="40" height="26" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="532" y="434.9" font-size="14" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">6/4</text>
<rect x="620" y="105" width="348" height="400" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="636" y="137" font-size="19" fill="#495b73" font-weight="700">执行过程</text>
<text x="636" y="172" font-size="14" fill="#23364e">① 1→2→3：dfn 依次为 1、2、3</text>
<text x="636" y="198" font-size="14" fill="#23364e">② 3→1：1 在栈内，</text>
<text x="636" y="224" font-size="14" fill="#23364e">    low[3] = dfn[1] = 1</text>
<text x="636" y="250" font-size="14" fill="#23364e">③ 3→4→5→6：dfn 为 4、5、6</text>
<text x="636" y="276" font-size="14" fill="#23364e">④ 6→4：4 在栈内，</text>
<text x="636" y="302" font-size="14" fill="#23364e">    low[6] = dfn[4] = 4</text>
<text x="636" y="328" font-size="14" fill="#23364e">⑤ 回溯到 5、4：low 都是 4</text>
<text x="636" y="354" font-size="14" fill="#23364e">⑥ 4：dfn = low，弹栈 6、5、4，</text>
<text x="636" y="380" font-size="14" fill="#23364e">    得到 SCC 1</text>
<text x="636" y="406" font-size="14" fill="#23364e">⑦ 回溯到 3、2：low 都是 1</text>
<text x="636" y="432" font-size="14" fill="#23364e">⑧ 1：dfn = low，弹栈 3、2、1，</text>
<text x="636" y="458" font-size="14" fill="#23364e">    得到 SCC 2</text>
<text x="32" y="540" font-size="16" fill="#495b73">先弹出的分量编号小：SCC 1 = {4,5,6}，SCC 2 = {1,2,3}。</text>
</g></svg>