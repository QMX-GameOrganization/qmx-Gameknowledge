<rect x="335" y="200" width="250" height="285" rx="12" fill="none" stroke="#8c5315" stroke-dasharray="7 5" stroke-opacity="1"/>
<text x="347" y="222" font-size="15" fill="#8c5315" font-weight="700">SCC 1</text>
