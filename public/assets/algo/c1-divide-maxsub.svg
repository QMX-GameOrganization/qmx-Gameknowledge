<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">分治求最大子段和：最优段在左半、右半，或跨过中点</title><desc id="desc">a = [-2,1,-3,4,-1,2,1,-5,4]，答案 6。。跨中点的最优段 = 左半以 mid 结尾的最大后缀 + 右半以 mid+1 开头的最大前缀，O(n) 求出。</desc>
<defs><marker id="ma33a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a33a3a"/></marker></defs>
<rect width="1000" height="470" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">分治求最大子段和：最优段在左半、右半，或跨过中点</text>
<text x="32" y="77" font-size="17" fill="#495b73">a = [-2,1,-3,4,-1,2,1,-5,4]，答案 6。</text>
<rect x="53.0" y="130.0" width="94" height="40" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="100.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">-2</text>
<text x="100.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">0</text>
<rect x="153.0" y="130.0" width="94" height="40" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="200.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">1</text>
<text x="200.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">1</text>
<rect x="253.0" y="130.0" width="94" height="40" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="300.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">-3</text>
<text x="300.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">2</text>
<rect x="353.0" y="130.0" width="94" height="40" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="400.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">4</text>
<text x="400.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">3</text>
<rect x="453.0" y="130.0" width="94" height="40" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="500.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">-1</text>
<text x="500.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">4</text>
<rect x="553.0" y="130.0" width="94" height="40" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="600.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">2</text>
<text x="600.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">5</text>
<rect x="653.0" y="130.0" width="94" height="40" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="700.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">1</text>
<text x="700.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">6</text>
<rect x="753.0" y="130.0" width="94" height="40" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="800.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">-5</text>
<text x="800.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">7</text>
<rect x="853.0" y="130.0" width="94" height="40" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="900.0" y="156.3" font-size="18" fill="#23364e" text-anchor="middle">4</text>
<text x="900.0" y="124" font-size="13" fill="#495b73" text-anchor="middle">8</text>
<path d="M550 112L550 200" fill="none" stroke="#a33a3a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ma33a3a)"/>
<text x="550" y="106" font-size="14" fill="#a33a3a" font-weight="700" text-anchor="middle">mid | mid+1</text>
<rect x="358" y="235" width="84" height="16" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity="1"/>
<rect x="858" y="235" width="84" height="16" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity="1"/>
<rect x="358" y="300" width="384" height="16" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity="1"/>
<text x="358" y="276" font-size="15" fill="#285caa" font-weight="700">左半最优：4</text>
<text x="650" y="276" font-size="15" fill="#176951" font-weight="700">右半最优：4</text>
<text x="358" y="345" font-size="16" fill="#8c5315" font-weight="700">跨中点：4 + (-1) + 2 + 1 = 6（取三者最大）</text>
<text x="32" y="450" font-size="16" fill="#495b73">跨中点的最优段 = 左半以 mid 结尾的最大后缀 + 右半以 mid+1 开头的最大前缀，O(n) 求出。</text>
</g></svg>