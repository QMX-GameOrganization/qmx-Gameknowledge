<text x="596" y="162" font-size="19" fill="#495b73" font-weight="700">搜索的思路</text>
<text x="596" y="198" font-size="16" fill="#23364e">1. 选 1 的个数最少的列（分支最少）</text>
<text x="596" y="230" font-size="16" fill="#23364e">2. 逐行试：选中该行，</text>
<text x="596" y="262" font-size="16" fill="#23364e">    删去它覆盖的所有列，</text>
<text x="596" y="294" font-size="16" fill="#23364e">    以及与它冲突的所有行</text>
<text x="596" y="326" font-size="16" fill="#23364e">3. 列全部删完 = 找到解</text>
<text x="596" y="358" font-size="16" fill="#23364e">4. 失败就按相反顺序恢复，换下一行</text>
<text x="32" y="530" font-size="16" fill="#495b73">解是 B、D、F：每一列的 1 恰好出现一次。</text>
