<text x="32" y="530" font-size="16" fill="#23364e">叶子:不选 0,选 1。 内部结点:不选时孩子可选可不选,选时孩子必须不选。</text>
<text x="32" y="580" font-size="16" fill="#495b73">根 5:不选 = max(2,1) + max(2,1) = 4;选 = 1 + 2 + 2 = 5。答案 max(4, 5) = 5。</text>
