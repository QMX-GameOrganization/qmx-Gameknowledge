<title id="title">没有上司的舞会:每个结点两个状态</title><desc id="desc">7 个人快乐值都是 1。括号里是 (dp[u][0], dp[u][1]) = (不选 u, 选 u) 时子树的最大快乐值。。根 5:不选 = max(2,1) + max(2,1) = 4;选 = 1 + 2 + 2 = 5。答案 max(4, 5) = 5。</desc>
