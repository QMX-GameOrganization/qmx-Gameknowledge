<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">路径压缩：find 时顺手把路径上的点直接挂到根上</title><desc id="desc">左边是一条长链，调用 find(5) 之后变成右边的菊花形。。压缩只改 parent，不改变谁和谁在同一个集合；之后再查这些点只要一步。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker><marker id="m176951" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#176951"/></marker></defs>
<rect width="1000" height="640" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">路径压缩：find 时顺手把路径上的点直接挂到根上</text>
<text x="32" y="77" font-size="17" fill="#495b73">左边是一条长链，调用 find(5) 之后变成右边的菊花形。</text>
<rect x="32" y="105" width="440" height="490" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<rect x="500" y="105" width="468" height="490" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="48" y="136" font-size="18" fill="#a33a3a" font-weight="700">压缩前：find(5) 要走 4 步</text>
<text x="516" y="136" font-size="18" fill="#176951" font-weight="700">压缩后：每个点直接指向根 1</text>
<rect x="228.0" y="171.0" width="44" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="250" y="195.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">1</text>
