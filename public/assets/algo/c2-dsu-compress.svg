<text x="250" y="290.9" font-size="17" fill="#66758d" font-weight="700" text-anchor="middle">2</text>
<rect x="228.0" y="361.0" width="44" height="38" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="250" y="385.9" font-size="17" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<rect x="228.0" y="456.0" width="44" height="38" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="250" y="480.9" font-size="17" fill="#66758d" font-weight="700" text-anchor="middle">4</text>
<rect x="228.0" y="551.0" width="44" height="38" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="250" y="576.0" font-size="17" fill="#66758d" font-weight="700" text-anchor="middle">5</text>
<path d="M250 266L250 210" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M250 361L250 305" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M250 456L250 400" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<path d="M250 551L250 495" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<text x="290" y="530" font-size="16" fill="#495b73">5 → 4 → 3 → 2 → 1</text>
<rect x="712.0" y="171.0" width="44" height="38" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="734" y="195.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">1</text>
<rect x="558.0" y="381.0" width="44" height="38" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="580" y="405.9" font-size="17" fill="#66758d" font-weight="700" text-anchor="middle">2</text>
<path d="M580 381L695.5 212" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<rect x="648.0" y="381.0" width="44" height="38" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="670" y="405.9" font-size="17" fill="#66758d" font-weight="700" text-anchor="middle">3</text>
<path d="M670 381L718.0 212" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<rect x="738.0" y="381.0" width="44" height="38" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="760" y="405.9" font-size="17" fill="#66758d" font-weight="700" text-anchor="middle">4</text>
<path d="M760 381L740.5 212" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<rect x="828.0" y="381.0" width="44" height="38" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="850" y="405.9" font-size="17" fill="#66758d" font-weight="700" text-anchor="middle">5</text>
<path d="M850 381L763.0 212" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<text x="32" y="620" font-size="16" fill="#495b73">压缩只改 parent，不改变谁和谁在同一个集合；之后再查这些点只要一步。</text>
