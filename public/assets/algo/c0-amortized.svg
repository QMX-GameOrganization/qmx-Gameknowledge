<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">vector 连续 push_back 16 次的实际代价</title><desc id="desc">偶尔一次扩容很贵，把代价摊到每次操作上，平均不到 2。。总代价 16 + (1+2+4+8) = 31，平均每次约 1.94。</desc>
