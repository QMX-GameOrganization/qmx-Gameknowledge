<text x="720" y="307.7" font-size="22" fill="#23364e" text-anchor="middle">28</text>
<rect x="775.0" y="271.0" width="70" height="58" rx="8" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="810" y="307.7" font-size="22" fill="#5b3fa0" font-weight="700" text-anchor="middle">29</text>
<rect x="865.0" y="271.0" width="70" height="58" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="900" y="307.7" font-size="22" fill="#23364e" text-anchor="middle">30</text>
<rect x="55.0" y="111.0" width="70" height="58" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="90" y="147.7" font-size="22" fill="#23364e" text-anchor="middle">1</text>
<rect x="74" y="372" width="30" height="24" rx="6" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="112" y="391" font-size="15" fill="#23364e">最小质因子 2</text>
<rect x="289" y="372" width="30" height="24" rx="6" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="327" y="391" font-size="15" fill="#23364e">最小质因子 3</text>
<rect x="504" y="372" width="30" height="24" rx="6" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="542" y="391" font-size="15" fill="#23364e">最小质因子 5</text>
<rect x="719" y="372" width="30" height="24" rx="6" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="757" y="391" font-size="15" fill="#23364e">7 及以上的质数</text>
<text x="40" y="428" font-size="16" fill="#495b73">加粗的是质数本身。合数最小质因子不超过 √30 ≈ 5.5，所以只需处理 2、3、5。</text>
<text x="32" y="480" font-size="16" fill="#495b73">同一个合数会被多个质数划到（如 30 被 2、3、5 都划到），线性筛的目标就是消除这种重复。</text>
</g></svg>