<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">用一个整数表示集合</title><desc id="desc">n 个元素的集合 {0, 2, 3} 对应二进制 01101:第 i 位为 1 表示 i 在集合里。。n 个元素共有 2^n 个集合,mask 从 0 到 2^n - 1 恰好各出现一次,正好作为 DP 的下标。</desc>
<defs></defs>
<rect width="1000" height="600" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">用一个整数表示集合</text>
<text x="32" y="77" font-size="17" fill="#495b73">n 个元素的集合 {0, 2, 3} 对应二进制 01101:第 i 位为 1 表示 i 在集合里。</text>
<text x="780" y="140" font-size="15" fill="#495b73" text-anchor="middle">第 0 位</text>
<rect x="735.0" y="162.0" width="90" height="56" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="780" y="199.1" font-size="26" fill="#8c5315" font-weight="700" text-anchor="middle">1</text>
<text x="780" y="236" font-size="14" fill="#8c5315" text-anchor="middle">元素 0</text>
<text x="660" y="140" font-size="15" fill="#495b73" text-anchor="middle">第 1 位</text>
<rect x="615.0" y="162.0" width="90" height="56" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="660" y="199.1" font-size="26" fill="#23364e" text-anchor="middle">0</text>
<text x="660" y="236" font-size="14" fill="#495b73" text-anchor="middle">元素 1</text>
<text x="540" y="140" font-size="15" fill="#495b73" text-anchor="middle">第 2 位</text>
<rect x="495.0" y="162.0" width="90" height="56" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="540" y="199.1" font-size="26" fill="#8c5315" font-weight="700" text-anchor="middle">1</text>
<text x="540" y="236" font-size="14" fill="#8c5315" text-anchor="middle">元素 2</text>
<text x="420" y="140" font-size="15" fill="#495b73" text-anchor="middle">第 3 位</text>
<rect x="375.0" y="162.0" width="90" height="56" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="420" y="199.1" font-size="26" fill="#8c5315" font-weight="700" text-anchor="middle">1</text>
<text x="420" y="236" font-size="14" fill="#8c5315" text-anchor="middle">元素 3</text>
<text x="300" y="140" font-size="15" fill="#495b73" text-anchor="middle">第 4 位</text>
<rect x="255.0" y="162.0" width="90" height="56" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="300" y="199.1" font-size="26" fill="#23364e" text-anchor="middle">0</text>
<text x="300" y="236" font-size="14" fill="#495b73" text-anchor="middle">元素 4</text>
<text x="60" y="196" font-size="20" fill="#23364e" font-weight="700">mask =</text>
<text x="60" y="226" font-size="14" fill="#495b73">(十进制 13)</text>
<rect x="32" y="290" width="460" height="70" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="46" y="318" font-size="17" fill="#285caa" font-weight="700">i 是否在集合里</text>
<text x="46" y="346" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">mask &gt;&gt; i &amp; 1</text>
<rect x="508" y="290" width="460" height="70" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="522" y="318" font-size="17" fill="#176951" font-weight="700">加入元素 i</text>
<text x="522" y="346" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">mask | (1 &lt;&lt; i)</text>
<rect x="32" y="372" width="460" height="70" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="46" y="400" font-size="17" fill="#a33a3a" font-weight="700">删除元素 i</text>
<text x="46" y="428" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">mask &amp; ~(1 &lt;&lt; i)</text>
<rect x="508" y="372" width="460" height="70" rx="12" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="522" y="400" font-size="17" fill="#5b3fa0" font-weight="700">全集 / 补集</text>
<text x="522" y="428" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">full = (1&lt;&lt;n)-1;  full ^ mask</text>
<rect x="32" y="454" width="460" height="70" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="46" y="482" font-size="17" fill="#8c5315" font-weight="700">元素个数</text>
<text x="46" y="510" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">__builtin_popcount(mask)</text>
<rect x="508" y="454" width="460" height="70" rx="12" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="522" y="482" font-size="17" fill="#495b73" font-weight="700">枚举非空子集</text>
<text x="522" y="510" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">for (s = mask; s; s = (s-1) &amp; mask)</text>
<text x="32" y="580" font-size="16" fill="#495b73">n 个元素共有 2^n 个集合,mask 从 0 到 2^n - 1 恰好各出现一次,正好作为 DP 的下标。</text>
</g></svg>