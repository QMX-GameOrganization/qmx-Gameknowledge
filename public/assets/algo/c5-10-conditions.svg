<circle cx="743" cy="445" r="16" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="743" y="450.25" font-size="15" fill="#8c5315" font-weight="700" text-anchor="middle">4</text>
<text x="789" y="410" font-size="13" fill="#23364e" font-weight="700">起点 出-入=1，终点 入-出=1</text>
<text x="789" y="445" font-size="14" fill="#23364e">其余点入度 = 出度</text>
<text x="32" y="565" font-size="16" fill="#495b73">橙色点是路径的起点或终点。</text>
</g></svg>