<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">欧拉回路与欧拉路径：看度数就能判断</text>
<text x="32" y="77" font-size="17" fill="#495b73">前提是所有有边的点互相连通；孤立点不影响。</text>
