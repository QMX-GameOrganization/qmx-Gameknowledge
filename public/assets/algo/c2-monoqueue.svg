<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">单调队列求滑动窗口最大值</title><desc id="desc">a = [1, 3, -1, -3, 5, 3, 6, 7]，窗口长度 k = 3。队内保持从队首到队尾递减。。队首永远是当前窗口的最大值；过期的从队首出，更小的从队尾出，整体 O(n)。</desc>
<defs></defs>
<rect width="1000" height="640" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">单调队列求滑动窗口最大值</text>
<text x="32" y="77" font-size="17" fill="#495b73">a = [1, 3, -1, -3, 5, 3, 6, 7]，窗口长度 k = 3。队内保持从队首到队尾递减。</text>
<text x="48" y="118" font-size="16" fill="#495b73" font-weight="700">加入元素</text>
<text x="210" y="118" font-size="16" fill="#495b73" font-weight="700">队列内容（下标:值），绿色是队首</text>
<text x="760" y="118" font-size="16" fill="#495b73" font-weight="700">窗口最大值</text>
<rect x="32" y="140" width="936" height="46" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<text x="48" y="170" font-size="17" fill="#23364e">i=0  a=1</text>
<rect x="206.0" y="146.0" width="78" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="245" y="168.6" font-size="16" fill="#23364e" text-anchor="middle">0:1</text>
<text x="800" y="171" font-size="15" fill="#495b73" text-anchor="middle">窗口未满</text>
<rect x="32" y="194" width="936" height="46" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<text x="48" y="224" font-size="17" fill="#23364e">i=1  a=3</text>
<rect x="206.0" y="200.0" width="78" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="245" y="222.6" font-size="16" fill="#23364e" text-anchor="middle">1:3</text>
<text x="800" y="225" font-size="15" fill="#495b73" text-anchor="middle">窗口未满</text>
<rect x="32" y="248" width="936" height="46" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<text x="48" y="278" font-size="17" fill="#23364e">i=2  a=-1</text>
<rect x="206.0" y="254.0" width="78" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="245" y="276.6" font-size="16" fill="#23364e" text-anchor="middle">1:3</text>
<rect x="296.0" y="254.0" width="78" height="34" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="335" y="276.6" font-size="16" fill="#23364e" text-anchor="middle">2:-1</text>
<text x="800" y="279" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle">3</text>
<rect x="32" y="302" width="936" height="46" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<text x="48" y="332" font-size="17" fill="#23364e">i=3  a=-3</text>
<rect x="206.0" y="308.0" width="78" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="245" y="330.6" font-size="16" fill="#23364e" text-anchor="middle">1:3</text>
<rect x="296.0" y="308.0" width="78" height="34" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="335" y="330.6" font-size="16" fill="#23364e" text-anchor="middle">2:-1</text>
<rect x="386.0" y="308.0" width="78" height="34" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="425" y="330.6" font-size="16" fill="#23364e" text-anchor="middle">3:-3</text>
<text x="800" y="333" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle">3</text>
<rect x="32" y="356" width="936" height="46" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<text x="48" y="386" font-size="17" fill="#23364e">i=4  a=5</text>
<rect x="206.0" y="362.0" width="78" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="245" y="384.6" font-size="16" fill="#23364e" text-anchor="middle">4:5</text>
<text x="800" y="387" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle">5</text>
<rect x="32" y="410" width="936" height="46" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<text x="48" y="440" font-size="17" fill="#23364e">i=5  a=3</text>
<rect x="206.0" y="416.0" width="78" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="245" y="438.6" font-size="16" fill="#23364e" text-anchor="middle">4:5</text>
<rect x="296.0" y="416.0" width="78" height="34" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="335" y="438.6" font-size="16" fill="#23364e" text-anchor="middle">5:3</text>
<text x="800" y="441" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle">5</text>
<rect x="32" y="464" width="936" height="46" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<text x="48" y="494" font-size="17" fill="#23364e">i=6  a=6</text>
<rect x="206.0" y="470.0" width="78" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="245" y="492.6" font-size="16" fill="#23364e" text-anchor="middle">6:6</text>
<text x="800" y="495" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle">6</text>
<rect x="32" y="518" width="936" height="46" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".6"/>
<text x="48" y="548" font-size="17" fill="#23364e">i=7  a=7</text>
<rect x="206.0" y="524.0" width="78" height="34" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="245" y="546.6" font-size="16" fill="#23364e" text-anchor="middle">7:7</text>
<text x="800" y="549" font-size="20" fill="#8c5315" font-weight="700" text-anchor="middle">7</text>
<text x="32" y="620" font-size="16" fill="#495b73">队首永远是当前窗口的最大值；过期的从队首出，更小的从队尾出，整体 O(n)。</text>
</g></svg>