<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">插头 DP：轮廓线与括号表示</title><desc id="desc">逐格处理，轮廓线上记录「哪些位置有路径穿过边界」，用括号区分它们属于哪条路径的哪一端。。状态 = m+1 个位置，每个位置 3 种取值：0 无插头，1 左括号，2 右括号。</desc>
<defs></defs>
<rect width="1000" height="600" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">插头 DP：轮廓线与括号表示</text>
<text x="32" y="77" font-size="17" fill="#495b73">逐格处理，轮廓线上记录「哪些位置有路径穿过边界」，用括号区分它们属于哪条路径的哪一端。</text>
<rect x="60" y="150" width="90" height="90" rx="4" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".5"/>
<rect x="150" y="150" width="90" height="90" rx="4" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".5"/>
<rect x="240" y="150" width="90" height="90" rx="4" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".5"/>
<rect x="330" y="150" width="90" height="90" rx="4" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".5"/>
<rect x="60" y="240" width="90" height="90" rx="4" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".5"/>
<rect x="150" y="240" width="90" height="90" rx="4" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".5"/>
<rect x="240" y="240" width="90" height="90" rx="4" fill="#fff2df" stroke="#8c5315" stroke-opacity=".5"/>
<rect x="330" y="240" width="90" height="90" rx="4" fill="#ffffff" stroke="#66758d" stroke-opacity=".5"/>
<rect x="60" y="330" width="90" height="90" rx="4" fill="#ffffff" stroke="#66758d" stroke-opacity=".5"/>
<rect x="150" y="330" width="90" height="90" rx="4" fill="#ffffff" stroke="#66758d" stroke-opacity=".5"/>
<rect x="240" y="330" width="90" height="90" rx="4" fill="#ffffff" stroke="#66758d" stroke-opacity=".5"/>
<rect x="330" y="330" width="90" height="90" rx="4" fill="#ffffff" stroke="#66758d" stroke-opacity=".5"/>
<text x="285.0" y="291.0" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">当前格</text>
<text x="150.0" y="140" font-size="15" fill="#285caa" font-weight="700" text-anchor="middle">已处理（浅蓝）</text>
<polyline points="60,330 240,330 240,240 420,240 420,150" fill="none" stroke="#a33a3a" stroke-width="3" stroke-dasharray="6 5"/>
<text x="434" y="236" font-size="16" fill="#a33a3a" font-weight="700">轮廓线</text>
<line x1="105.0" y1="316" x2="105.0" y2="350" stroke="#8c5315" stroke-width="5"/>
<line x1="195.0" y1="316" x2="195.0" y2="350" stroke="#8c5315" stroke-width="5"/>
<line x1="285.0" y1="226" x2="285.0" y2="260" stroke="#8c5315" stroke-width="5"/>
<line x1="375.0" y1="226" x2="375.0" y2="260" stroke="#8c5315" stroke-width="5"/>
<text x="105.0" y="448" font-size="15" fill="#495b73" text-anchor="middle">0</text>
<text x="105.0" y="478" font-size="24" fill="#8c5315" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(</text>
<text x="195.0" y="448" font-size="15" fill="#495b73" text-anchor="middle">1</text>
<text x="195.0" y="478" font-size="24" fill="#8c5315" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">)</text>
<text x="236" y="448" font-size="15" fill="#495b73" text-anchor="middle">2</text>
<text x="236" y="478" font-size="24" fill="#66758d" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">·</text>
<text x="285.0" y="448" font-size="15" fill="#495b73" text-anchor="middle">3</text>
<text x="285.0" y="478" font-size="24" fill="#8c5315" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">(</text>
<text x="375.0" y="448" font-size="15" fill="#495b73" text-anchor="middle">4</text>
<text x="375.0" y="478" font-size="24" fill="#8c5315" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">)</text>
<text x="60" y="510" font-size="16" fill="#23364e" font-weight="700">下标 0..4 对应的状态：1 2 0 1 2</text>
<rect x="500" y="130" width="468" height="400" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="516" y="162" font-size="19" fill="#176951" font-weight="700">读法</text>
<text x="516" y="200" font-size="16" fill="#23364e">下标 0、1：已处理格子向下伸出的插头。</text>
<text x="516" y="229" font-size="16" fill="#23364e">下标 2（= j）：当前格左边来的插头。</text>
<text x="516" y="258" font-size="16" fill="#23364e">下标 3（= j+1）：当前格上边来的插头。</text>
<text x="516" y="287" font-size="16" fill="#23364e">下标 4：上一行向右侧列伸下来的插头。</text>
<text x="516" y="316" font-size="16" fill="#23364e"></text>
<text x="516" y="345" font-size="16" fill="#23364e">配对的括号是同一条路径的两个端点：</text>
<text x="516" y="374" font-size="16" fill="#23364e">(0,1) 是一对，(3,4) 是一对。</text>
<text x="516" y="403" font-size="16" fill="#23364e"></text>
<text x="516" y="432" font-size="16" fill="#23364e">换行时整体左移一个位置，</text>
<text x="516" y="461" font-size="16" fill="#23364e">最右边的插头必须是 0。</text>
<text x="32" y="580" font-size="16" fill="#495b73">状态 = m+1 个位置，每个位置 3 种取值：0 无插头，1 左括号，2 右括号。</text>
</g></svg>