<path d="M730 352L850 404" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<rect x="400.0" y="140.0" width="200" height="76" rx="8" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="500" y="163.8" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">i ∈ [1, 8]</text>
<text x="500" y="183.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">k ∈ [0, 7]</text>
<text x="500" y="202.8" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">mid=4 → bk=2</text>
<rect x="170.0" y="274.0" width="200" height="76" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="270" y="297.8" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">i ∈ [1, 3]</text>
<text x="270" y="317.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">k ∈ [0, 2]</text>
<text x="270" y="336.8" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">mid=2 → bk=1</text>
<rect x="630.0" y="274.0" width="200" height="76" rx="8" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="730" y="297.8" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">i ∈ [5, 8]</text>
<text x="730" y="317.2" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">k ∈ [2, 7]</text>
<text x="730" y="336.8" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">mid=6 → bk=4</text>
<rect x="40.0" y="408.0" width="200" height="76" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="140" y="441.5" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">i = 1</text>
<text x="140" y="461.0" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">k ∈ [0, 1]</text>
<rect x="270.0" y="408.0" width="200" height="76" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
