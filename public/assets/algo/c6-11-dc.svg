<text x="370" y="461.0" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">k ∈ [1, 2]</text>
<rect x="510.0" y="408.0" width="200" height="76" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="610" y="441.5" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">i = 5</text>
<text x="610" y="461.0" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">k ∈ [2, 4]</text>
<rect x="750.0" y="408.0" width="200" height="76" rx="8" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="850" y="441.5" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">i ∈ [7, 8]</text>
<text x="850" y="461.0" font-size="15" fill="#23364e" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">k ∈ [4, 7]</text>
<text x="48" y="118" font-size="16" fill="#495b73">上层的 bk 把 k 的范围一分为二；左右两半的范围只在 bk 处重叠。</text>
<text x="32" y="540" font-size="16" fill="#495b73">每一层所有节点的决策区间加起来只有 O(n) 个，一共 log n 层，一层 DP 总共 O(n log n)。</text>
</g></svg>