<text x="520" y="118" font-size="16" fill="#495b73" font-weight="700">约束图(紫色虚线:超源点)</text>
<rect x="32" y="385" width="450" height="185" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="48" y="417" font-size="19" fill="#176951" font-weight="700">从 0 出发的最短路</text>
<text x="48" y="450" font-size="15" fill="#23364e">dist[1] = -2   (路径 0→2→3→1)</text>
<text x="48" y="478" font-size="15" fill="#23364e">dist[2] = 0,   dist[3] = -2</text>
<text x="48" y="510" font-size="15" fill="#176951" font-weight="700">取 x = (-2, 0, -2),逐条检查:</text>
<text x="48" y="538" font-size="15" fill="#23364e">2 ≤ 3,  -2 ≤ -2,  0 ≤ 4,  0 ≤ 0  全部成立</text>
<text x="32" y="620" font-size="16" fill="#495b73">超源点 0 向每个点连权 0 的边,保证所有点都能被到达。</text>
