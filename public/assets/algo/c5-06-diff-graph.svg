<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
<title id="title">差分约束:不等式 ⇒ 边,解不等式组 ⇒ 最短路</title><desc id="desc">x_j - x_i ≤ c 等价于 x_j ≤ x_i + c,正是松弛的形式。。超源点 0 向每个点连权 0 的边,保证所有点都能被到达。</desc>
<defs><marker id="m5b3fa0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#5b3fa0"/></marker><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="640" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">差分约束:不等式 ⇒ 边,解不等式组 ⇒ 最短路</text>
<text x="32" y="77" font-size="17" fill="#495b73">x_j - x_i ≤ c 等价于 x_j ≤ x_i + c,正是松弛的形式。</text>
<rect x="32" y="105" width="450" height="260" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="137" font-size="19" fill="#285caa" font-weight="700">不等式组</text>
<text x="48" y="178" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">x2 - x1 ≤ 3   →  边 1→2,权 3</text>
<text x="48" y="212" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">x3 - x2 ≤ -2  →  边 2→3,权 -2</text>
<text x="48" y="246" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">x3 - x1 ≤ 4   →  边 1→3,权 4</text>
<text x="48" y="280" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">x1 - x3 ≤ 0   →  边 3→1,权 0</text>
<text x="48" y="330" font-size="16" fill="#285caa" font-weight="700">规则:x_j - x_i ≤ c  ⇒  边 i→j,权 c</text>
