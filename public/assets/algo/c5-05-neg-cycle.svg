<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">用路径边数检测负环</title><desc id="desc">len[v] 记录当前最短路径含多少条边;最短路径最多 n-1 条边,超出就说明在绕圈。。这里 n = 4。第二次更新点 2 时,len[2] = 4 ≥ n,报告负环。</desc>
<defs><marker id="m66758d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker><marker id="ma33a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a33a3a"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">用路径边数检测负环</text>
<text x="32" y="77" font-size="17" fill="#495b73">len[v] 记录当前最短路径含多少条边;最短路径最多 n-1 条边,超出就说明在绕圈。</text>
<path d="M99.2 259.3L238.1 182.1" fill="none" stroke="#66758d" stroke-width="2" marker-end="url(#m66758d)"/>
<rect x="159.0" y="209.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="170.0" y="225.0" font-size="15" fill="#66758d" font-weight="700" text-anchor="middle">1</text>
<path d="M282.0 170.0L435.0 170.0" fill="none" stroke="#a33a3a" stroke-width="3" marker-end="url(#ma33a3a)"/>
<rect x="345.0" y="159.0" width="30.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="360.0" y="175.0" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">-1</text>
<path d="M450.5 189.9L370.7 357.4" fill="none" stroke="#a33a3a" stroke-width="3" marker-end="url(#ma33a3a)"/>
<rect x="395.0" y="264.0" width="30.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="410.0" y="280.0" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">-1</text>
<path d="M350.5 360.1L270.7 192.6" fill="none" stroke="#a33a3a" stroke-width="3" marker-end="url(#ma33a3a)"/>
<rect x="299.0" y="264.0" width="22.0" height="22" rx="6" fill="#f6f8fc"/>
<text x="310.0" y="280.0" font-size="15" fill="#a33a3a" font-weight="700" text-anchor="middle">1</text>
<circle cx="80" cy="270" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="80" y="276.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">1</text>
<circle cx="260" cy="170" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="260" y="176.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">2</text>
<circle cx="460" cy="170" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="460" y="176.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">3</text>
<circle cx="360" cy="380" r="22" fill="#ffffff" stroke="#66758d" stroke-width="2"/>
<text x="360" y="386.3" font-size="18" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<text x="32" y="118" font-size="17" fill="#a33a3a" font-weight="700">环 2→3→4→2 的权和 = -1 + -1 + 1 = -1</text>
<rect x="560" y="140" width="90" height="34" fill="#eaf2ff" stroke="#c5cfdf"/>
<text x="605.0" y="161.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">绕圈次数</text>
<rect x="650" y="140" width="120" height="34" fill="#eaf2ff" stroke="#c5cfdf"/>
<text x="710.0" y="161.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">dist[2]</text>
<rect x="770" y="140" width="110" height="34" fill="#eaf2ff" stroke="#c5cfdf"/>
<text x="825.0" y="161.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">len[2]</text>
<rect x="880" y="140" width="88" height="34" fill="#eaf2ff" stroke="#c5cfdf"/>
<text x="924.0" y="161.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">判断</text>
<rect x="560" y="174" width="90" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="605.0" y="198.9" font-size="14" fill="#23364e" text-anchor="middle">第 0 圈</text>
<rect x="650" y="174" width="120" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="710.0" y="198.9" font-size="14" fill="#23364e" text-anchor="middle">1</text>
<rect x="770" y="174" width="110" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="825.0" y="198.9" font-size="14" fill="#23364e" text-anchor="middle">1</text>
<rect x="880" y="174" width="88" height="40" fill="#ffffff" stroke="#c5cfdf"/>
<text x="924.0" y="198.9" font-size="14" fill="#23364e" text-anchor="middle">继续</text>
<rect x="560" y="214" width="90" height="40" fill="#fdecec" stroke="#c5cfdf"/>
<text x="605.0" y="238.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">第 1 圈</text>
<rect x="650" y="214" width="120" height="40" fill="#fdecec" stroke="#c5cfdf"/>
<text x="710.0" y="238.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">0</text>
<rect x="770" y="214" width="110" height="40" fill="#fdecec" stroke="#c5cfdf"/>
<text x="825.0" y="238.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">4</text>
<rect x="880" y="214" width="88" height="40" fill="#fdecec" stroke="#c5cfdf"/>
<text x="924.0" y="238.9" font-size="14" fill="#23364e" font-weight="700" text-anchor="middle">4 ≥ 4,停止</text>
<text x="560" y="290" font-size="16" fill="#23364e">每绕一圈:dist 减 1,len 加 3。</text>
<text x="560" y="318" font-size="16" fill="#23364e">没有负环时,最短路径是简单路径,</text>
<text x="560" y="344" font-size="16" fill="#23364e">len 不会达到 n。</text>
<rect x="32" y="430" width="936" height="60" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="48" y="467" font-size="16" fill="#23364e">也可以统计每个点的入队次数,超过 n 次判负环;边数法更早发现。</text>
<text x="32" y="540" font-size="16" fill="#495b73">这里 n = 4。第二次更新点 2 时,len[2] = 4 ≥ n,报告负环。</text>
</g></svg>