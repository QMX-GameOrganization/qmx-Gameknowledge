<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">倍增求 LCA(8, 6)</title><desc id="desc">先把深的一个跳到同一深度，再两个一起往上跳。。跳的原则：只有“跳完仍不相等”才真的跳，最后停在 LCA 的两个孩子上。</desc>
<defs></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">倍增求 LCA(8, 6)</text>
<text x="32" y="77" font-size="17" fill="#495b73">先把深的一个跳到同一深度，再两个一起往上跳。</text>
<rect x="32" y="105" width="440" height="120" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="46" y="135" font-size="19" fill="#285caa" font-weight="700">① 对齐深度</text>
<text x="46" y="163" font-size="16" fill="#23364e">depth[8]=4，depth[6]=2，差 2</text>
<text x="46" y="188" font-size="16" fill="#23364e">2 的二进制是 10，用 up[1] 跳一步：8 → 4</text>
<rect x="32" y="240" width="440" height="120" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="46" y="270" font-size="19" fill="#176951" font-weight="700">② 从大到小同时上跳</text>
<text x="46" y="298" font-size="16" fill="#23364e">k=1：up[1][4]=up[1][6]=1，相同，不跳</text>
<text x="46" y="323" font-size="16" fill="#23364e">k=0：up[0][4]=2 ≠ up[0][6]=3，跳</text>
<rect x="32" y="375" width="440" height="120" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="46" y="405" font-size="19" fill="#8c5315" font-weight="700">③ 收尾</text>
<text x="46" y="433" font-size="16" fill="#23364e">此时 u=2，v=3，父亲相同</text>
<text x="46" y="458" font-size="16" fill="#23364e">LCA = up[0][2] = 1</text>
<line x1="760" y1="150" x2="680" y2="240" stroke="#66758d" stroke-width="2"/>
<line x1="760" y1="150" x2="860" y2="240" stroke="#66758d" stroke-width="2"/>
<line x1="680" y1="240" x2="630" y2="330" stroke="#8c5315" stroke-width="4"/>
<line x1="680" y1="240" x2="730" y2="330" stroke="#66758d" stroke-width="2"/>
<line x1="860" y1="240" x2="860" y2="330" stroke="#8c5315" stroke-width="4"/>
<line x1="630" y1="330" x2="630" y2="420" stroke="#8c5315" stroke-width="4"/>
<line x1="630" y1="420" x2="630" y2="510" stroke="#8c5315" stroke-width="4"/>
<circle cx="760" cy="150" r="20" fill="#e8f7f1" stroke="#176951" stroke-width="2"/>
<text x="760" y="155.9" font-size="17" fill="#176951" font-weight="700" text-anchor="middle">1</text>
<circle cx="680" cy="240" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="680" y="245.9" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">2</text>
<circle cx="860" cy="240" r="20" fill="#f0ecfb" stroke="#5b3fa0" stroke-width="2"/>
<text x="860" y="245.9" font-size="17" fill="#5b3fa0" font-weight="700" text-anchor="middle">3</text>
<circle cx="630" cy="330" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="630" y="335.9" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">4</text>
<circle cx="730" cy="330" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="730" y="335.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">5</text>
<circle cx="860" cy="330" r="20" fill="#f0ecfb" stroke="#5b3fa0" stroke-width="2"/>
<text x="860" y="335.9" font-size="17" fill="#5b3fa0" font-weight="700" text-anchor="middle">6</text>
<circle cx="630" cy="420" r="20" fill="#eaf2ff" stroke="#285caa" stroke-width="2"/>
<text x="630" y="425.9" font-size="17" fill="#285caa" font-weight="700" text-anchor="middle">7</text>
<circle cx="630" cy="510" r="20" fill="#fff2df" stroke="#8c5315" stroke-width="2"/>
<text x="630" y="516.0" font-size="17" fill="#8c5315" font-weight="700" text-anchor="middle">8</text>
<text x="32" y="540" font-size="16" fill="#495b73">跳的原则：只有“跳完仍不相等”才真的跳，最后停在 LCA 的两个孩子上。</text>
</g></svg>