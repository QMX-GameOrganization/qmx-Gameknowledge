<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">按秩（大小）合并：小树挂到大树下</text>
<text x="32" y="77" font-size="17" fill="#495b73">把有 3 个点的树 A 和单点 4 合并，挂法不同，树的高度不同。</text>
