<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">多态：调用点不变，实际执行谁由对象决定</title><desc id="desc">foreach 里只写 s.Damage(10)，三个对象各走各的版本。。变量的声明类型决定能调用什么，对象的真实类型决定执行谁的版本。</desc>
<defs><marker id="m285caa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#285caa"/></marker><marker id="m176951" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#176951"/></marker><marker id="m8c5315" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#8c5315"/></marker></defs>
<rect width="1000" height="600" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">多态：调用点不变，实际执行谁由对象决定</text>
<text x="32" y="77" font-size="17" fill="#495b73">foreach 里只写 s.Damage(10)，三个对象各走各的版本。</text>
<text x="32" y="118" font-size="17" fill="#285caa" font-weight="700">Skill[] book（元素类型是父类 Skill）</text>
<rect x="99.0" y="140.0" width="150" height="40" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="174" y="165.2" font-size="15" fill="#23364e" text-anchor="middle">book[0]（引用）</text>
<path d="M174 182L174 232" fill="none" stroke="#285caa" stroke-width="2" marker-end="url(#m285caa)"/>
<rect x="32" y="234" width="284" height="150" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="46" y="264" font-size="17" fill="#285caa" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">new Fireball()</text>
<text x="46" y="296" font-size="15" fill="#23364e">override Damage</text>
<text x="46" y="326" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">返回 atk * 3</text>
<text x="46" y="360" font-size="13" fill="#495b73">真实类型决定执行哪一份代码</text>
<path d="M174 386L174 440" fill="none" stroke="#285caa" stroke-width="2" marker-end="url(#m285caa)"/>
<text x="186" y="418" font-size="14" fill="#495b73" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">s.Damage(10)</text>
<rect x="99.0" y="455.0" width="150" height="50" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="174" y="487.0" font-size="20" fill="#66758d" font-weight="700" text-anchor="middle">结果 30</text>
<rect x="425.0" y="140.0" width="150" height="40" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="500" y="165.2" font-size="15" fill="#23364e" text-anchor="middle">book[1]（引用）</text>
<path d="M500 182L500 232" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<rect x="358" y="234" width="284" height="150" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="372" y="264" font-size="17" fill="#176951" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">new Slash()</text>
<text x="372" y="296" font-size="15" fill="#23364e">override Damage</text>
<text x="372" y="326" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">返回 atk * 2 + 5</text>
<text x="372" y="360" font-size="13" fill="#495b73">真实类型决定执行哪一份代码</text>
<path d="M500 386L500 440" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<text x="512" y="418" font-size="14" fill="#495b73" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">s.Damage(10)</text>
<rect x="425.0" y="455.0" width="150" height="50" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="500" y="487.0" font-size="20" fill="#66758d" font-weight="700" text-anchor="middle">结果 25</text>
<rect x="751.0" y="140.0" width="150" height="40" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="826" y="165.2" font-size="15" fill="#23364e" text-anchor="middle">book[2]（引用）</text>
<path d="M826 182L826 232" fill="none" stroke="#8c5315" stroke-width="2" marker-end="url(#m8c5315)"/>
<rect x="684" y="234" width="284" height="150" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="698" y="264" font-size="17" fill="#8c5315" font-weight="700" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">new Skill()</text>
<text x="698" y="296" font-size="15" fill="#23364e">virtual Damage（默认）</text>
<text x="698" y="326" font-size="16" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">返回 atk</text>
<text x="698" y="360" font-size="13" fill="#495b73">真实类型决定执行哪一份代码</text>
<path d="M826 386L826 440" fill="none" stroke="#8c5315" stroke-width="2" marker-end="url(#m8c5315)"/>
<text x="838" y="418" font-size="14" fill="#495b73" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">s.Damage(10)</text>
<rect x="751.0" y="455.0" width="150" height="50" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="826" y="487.0" font-size="20" fill="#66758d" font-weight="700" text-anchor="middle">结果 10</text>
<text x="32" y="560" font-size="17" fill="#495b73">新增一种技能，只需新增一个子类，上面的遍历代码一行都不用改。</text>
<text x="32" y="580" font-size="16" fill="#495b73">变量的声明类型决定能调用什么，对象的真实类型决定执行谁的版本。</text>
</g></svg>