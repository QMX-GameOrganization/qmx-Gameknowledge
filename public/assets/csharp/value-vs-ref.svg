<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">值类型与引用类型：赋值时复制的东西不同</title><desc id="desc">同样写 b = a，复制的内容不一样。。值类型变量里装数据本身；引用类型变量里装指向对象的引用。</desc>
<defs><marker id="m285caa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#285caa"/></marker><marker id="m176951" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#176951"/></marker></defs>
<rect width="1000" height="520" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">值类型与引用类型：赋值时复制的东西不同</text>
<text x="32" y="77" font-size="17" fill="#495b73">同样写 b = a，复制的内容不一样。</text>
<rect x="32" y="105" width="450" height="360" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="137" font-size="19" fill="#285caa" font-weight="700">值类型（int、float、struct…）</text>
<text x="48" y="168" font-size="15" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">int a = 10;  int b = a;  b = 99;</text>
<text x="155" y="232" font-size="16" fill="#495b73" text-anchor="middle">变量 a</text>
<text x="365" y="232" font-size="16" fill="#495b73" text-anchor="middle">变量 b</text>
<rect x="85" y="244" width="140" height="76" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<rect x="295" y="244" width="140" height="76" rx="12" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="155" y="294" font-size="30" fill="#23364e" font-weight="700" text-anchor="middle">10</text>
<text x="365" y="294" font-size="30" fill="#23364e" font-weight="700" text-anchor="middle">99</text>
<path d="M228 282L292 282" fill="none" stroke="#285caa" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m285caa)"/>
<text x="260" y="350" font-size="15" fill="#495b73" text-anchor="middle">b = a 时复制了一份内容</text>
<text x="48" y="410" font-size="17" fill="#285caa" font-weight="700">改 b 只影响 b，a 仍然是 10。</text>
<text x="48" y="438" font-size="17" fill="#23364e">两个变量各自拥有独立的数据。</text>
<rect x="518" y="105" width="450" height="360" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="534" y="137" font-size="19" fill="#176951" font-weight="700">引用类型（class、数组、string…）</text>
<text x="534" y="168" font-size="14" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">int[] x = {1,2,3};  int[] y = x;  y[0] = 99;</text>
<rect x="570.0" y="209.0" width="120" height="52" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="630" y="240.6" font-size="16" fill="#23364e" text-anchor="middle">x（引用）</text>
<rect x="790.0" y="209.0" width="120" height="52" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="850" y="240.6" font-size="16" fill="#23364e" text-anchor="middle">y（引用）</text>
<text x="534" y="318" font-size="15" fill="#495b73">堆上的同一个对象</text>
<rect x="590" y="330" width="290" height="78" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="735" y="360" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">int[] 数组对象</text>
<text x="735" y="392" font-size="20" fill="#23364e" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">[ 99, 2, 3 ]</text>
<path d="M640 262L690 328" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<path d="M840 262L780 328" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<text x="534" y="440" font-size="17" fill="#176951" font-weight="700">改 y[0]，通过 x 读出来也是 99。</text>
<text x="32" y="500" font-size="16" fill="#495b73">值类型变量里装数据本身；引用类型变量里装指向对象的引用。</text>
</g></svg>