<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">引用类型传参：传的是引用的副本</title><desc id="desc">函数能改对象的内容，但换不掉调用方手里的那份引用。。想让函数真的替换调用方的变量，要用 ref 或 out。</desc>
<defs><marker id="m176951" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#176951"/></marker><marker id="ma33a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a33a3a"/></marker></defs>
<rect width="1000" height="560" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">引用类型传参：传的是引用的副本</text>
<text x="32" y="77" font-size="17" fill="#495b73">函数能改对象的内容，但换不掉调用方手里的那份引用。</text>
<rect x="32" y="105" width="450" height="380" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="48" y="137" font-size="19" fill="#176951" font-weight="700">Fill(bag)：修改内容</text>
<text x="48" y="166" font-size="14" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">static void Fill(int[] arr) { arr[0] = 50; }</text>
<rect x="85.0" y="210.0" width="130" height="50" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="150" y="240.6" font-size="16" fill="#23364e" text-anchor="middle">调用方 bag</text>
<rect x="85.0" y="305.0" width="130" height="50" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="150" y="335.6" font-size="16" fill="#23364e" text-anchor="middle">形参 arr</text>
<rect x="310" y="255" width="150" height="100" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="385" y="290" font-size="16" fill="#8c5315" font-weight="700" text-anchor="middle">数组对象</text>
<text x="385" y="326" font-size="20" fill="#23364e" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">[ 50, 0 ]</text>
<path d="M216 238L308 285" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<path d="M216 326L308 328" fill="none" stroke="#176951" stroke-width="2" marker-end="url(#m176951)"/>
<text x="48" y="420" font-size="17" fill="#23364e">两个引用指向同一个数组，</text>
<text x="48" y="446" font-size="17" fill="#176951" font-weight="700">改 arr[0]，bag[0] 也变成 50。</text>
<rect x="518" y="105" width="450" height="380" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="534" y="137" font-size="19" fill="#a33a3a" font-weight="700">Replace(bag)：换引用</text>
<text x="534" y="166" font-size="14" fill="#23364e" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">arr = new int[] { 7 };</text>
<rect x="565.0" y="210.0" width="130" height="50" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="630" y="240.6" font-size="16" fill="#23364e" text-anchor="middle">调用方 bag</text>
<rect x="565.0" y="305.0" width="130" height="50" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="630" y="335.6" font-size="16" fill="#23364e" text-anchor="middle">形参 arr</text>
<rect x="790" y="205" width="160" height="70" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="870" y="232" font-size="15" fill="#8c5315" font-weight="700" text-anchor="middle">原数组</text>
<text x="870" y="258" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">[ 50, 0 ]</text>
<rect x="790" y="300" width="160" height="70" rx="12" fill="#f0ecfb" stroke="#5b3fa0" stroke-opacity=".3"/>
<text x="870" y="327" font-size="15" fill="#5b3fa0" font-weight="700" text-anchor="middle">新数组</text>
<text x="870" y="353" font-size="17" fill="#23364e" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">[ 7 ]</text>
<path d="M696 235L788 240" fill="none" stroke="#a33a3a" stroke-width="2" marker-end="url(#ma33a3a)"/>
<path d="M696 330L788 335" fill="none" stroke="#a33a3a" stroke-width="2" marker-end="url(#ma33a3a)"/>
<text x="534" y="420" font-size="17" fill="#23364e">只是把形参 arr 改指向新数组，</text>
<text x="534" y="446" font-size="17" fill="#a33a3a" font-weight="700">调用方的 bag 仍指向原数组。</text>
<text x="32" y="540" font-size="16" fill="#495b73">想让函数真的替换调用方的变量，要用 ref 或 out。</text>
</g></svg>