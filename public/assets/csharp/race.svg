<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
<title id="title">数据竞争：counter++ 不是一步完成的</title><desc id="desc">它分三步：读、加、写。两个线程交错执行时，会互相覆盖。。lock 保证同一时刻只有一个线程执行这一段代码。</desc>
<defs></defs>
<rect width="1000" height="660" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">数据竞争：counter++ 不是一步完成的</text>
<text x="32" y="77" font-size="17" fill="#495b73">它分三步：读、加、写。两个线程交错执行时，会互相覆盖。</text>
<rect x="32" y="105" width="936" height="230" rx="12" fill="#fdecec" stroke="#a33a3a" stroke-opacity=".3"/>
<text x="48" y="135" font-size="18" fill="#a33a3a" font-weight="700">不加锁：期望 counter 变成 7，实际只是 6</text>
<text x="64" y="180" font-size="16" fill="#23364e" font-weight="700">线程 A</text>
<text x="64" y="230" font-size="16" fill="#23364e" font-weight="700">线程 B</text>
<text x="64" y="285" font-size="16" fill="#23364e" font-weight="700">counter</text>
<rect x="260.0" y="154.0" width="140" height="36" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="330" y="177.2" font-size="15" fill="#23364e" text-anchor="middle">读到 5</text>
<rect x="580.0" y="154.0" width="140" height="36" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="650" y="177.2" font-size="15" fill="#23364e" text-anchor="middle">写入 6</text>
<rect x="420.0" y="204.0" width="140" height="36" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="490" y="226.9" font-size="14" fill="#23364e" text-anchor="middle">读到 5（旧值）</text>
<rect x="740.0" y="204.0" width="140" height="36" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="810" y="227.2" font-size="15" fill="#23364e" text-anchor="middle">写入 6</text>
<rect x="295.0" y="262.0" width="70" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="330" y="285.9" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">5</text>
<rect x="455.0" y="262.0" width="70" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="490" y="285.9" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">5</text>
<rect x="615.0" y="262.0" width="70" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="650" y="285.9" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">6</text>
<rect x="775.0" y="262.0" width="70" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="810" y="285.9" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">6</text>
<text x="480" y="322" font-size="15" fill="#a33a3a" text-anchor="middle">B 读的时候 A 还没写回，两次加 1 变成了一次。</text>
<rect x="32" y="355" width="936" height="245" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="48" y="385" font-size="18" fill="#176951" font-weight="700">加 lock：B 等 A 做完再进去</text>
<text x="64" y="430" font-size="16" fill="#23364e" font-weight="700">线程 A</text>
<text x="64" y="480" font-size="16" fill="#23364e" font-weight="700">线程 B</text>
<text x="64" y="535" font-size="16" fill="#23364e" font-weight="700">counter</text>
<rect x="260" y="407" width="300" height="36" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="410" y="431" font-size="15" fill="#23364e" text-anchor="middle">持锁：读 5 → 写 6</text>
<rect x="260" y="457" width="300" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-dasharray="7 5" stroke-opacity="1"/>
<text x="410" y="481" font-size="15" fill="#495b73" text-anchor="middle">等待锁……</text>
<rect x="580" y="457" width="300" height="36" rx="8" fill="#ffffff" stroke="#66758d" stroke-opacity=".3"/>
<text x="730" y="481" font-size="15" fill="#23364e" text-anchor="middle">持锁：读 6 → 写 7</text>
<rect x="295.0" y="512.0" width="70" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="330" y="536.0" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">5</text>
<rect x="455.0" y="512.0" width="70" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="490" y="536.0" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">6</text>
<rect x="615.0" y="512.0" width="70" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="650" y="536.0" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">6</text>
<rect x="775.0" y="512.0" width="70" height="36" rx="8" fill="#eef1f6" stroke="#495b73" stroke-opacity=".3"/>
<text x="810" y="536.0" font-size="17" fill="#495b73" font-weight="700" text-anchor="middle" font-family="Consolas, Menlo, Noto Sans Mono CJK SC, monospace">7</text>
<text x="480" y="576" font-size="15" fill="#176951" font-weight="700" text-anchor="middle">结果是 7，每次都对。</text>
<text x="32" y="640" font-size="16" fill="#495b73">lock 保证同一时刻只有一个线程执行这一段代码。</text>
</g></svg>