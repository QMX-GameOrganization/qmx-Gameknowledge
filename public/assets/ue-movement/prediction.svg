<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">预测、确认与重放</title><desc id="desc">以自主代理为例 · 校正只恢复基准，后续未确认输入还要重算</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536d88"/></marker></defs><rect width="1120" height="680" rx="18" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#16314d"><text x="42" y="54" font-size="28" font-weight="700">预测、确认与重放</text><text x="42" y="88" font-size="17" fill="#4f657c">以自主代理为例 · 校正只恢复基准，后续未确认输入还要重算</text><rect x="45" y="135" width="450" height="105" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="65" y="169" font-size="21" font-weight="700">客户端：立即响应输入</text><text x="65" y="200" font-size="17">执行 100 → 101 → 102，保留历史</text><rect x="625" y="135" width="450" height="105" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="645" y="169" font-size="21" font-weight="700">服务器：权威模拟</text><text x="645" y="200" font-size="17">接收输入，推进并验证状态</text><path d="M495,180 L625,180" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="570.0" y="172.0" font-size="16">输入</text><rect x="625" y="300" width="450" height="105" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="645" y="334" font-size="21" font-weight="700">确认或返回权威状态</text><text x="645" y="365" font-size="17">例如返回输入 100 对应的基准</text><path d="M850,240 L850,300" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="45" y="300" width="450" height="105" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="65" y="334" font-size="21" font-weight="700">客户端：需要纠正时恢复 100</text><text x="65" y="365" font-size="17">不是从服务器位置直接跳过历史</text><path d="M625,353 L495,353" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="570.0" y="345.0" font-size="16">校正</text><rect x="45" y="465" width="450" height="105" rx="12" fill="#e1f2eb" stroke="#b9cbdf"/><text x="65" y="499" font-size="21" font-weight="700">重放 101 → 102</text><text x="65" y="530" font-size="17">按历史输入推导修正后的“现在”</text><path d="M270,405 L270,465" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="625" y="465" width="450" height="105" rx="12" fill="#fff0d9" stroke="#b9cbdf"/><text x="645" y="499" font-size="21" font-weight="700">表现层平滑</text><text x="645" y="530" font-size="17">视觉过渡不替代运动重模拟</text><path d="M495,515 L625,515" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="45" y="625" font-size="18">适用于理解 CMC 与预测后端；两者历史数据结构和具体调用实现不同。</text></g></svg>