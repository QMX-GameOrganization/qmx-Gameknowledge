<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">同一输入，为什么得到不同结果？</title><desc id="desc">把意图、模拟事实与表现分开观察</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536d88"/></marker></defs><rect width="1120" height="620" rx="18" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#16314d"><text x="42" y="54" font-size="28" font-weight="700">同一输入，为什么得到不同结果？</text><text x="42" y="88" font-size="17" fill="#4f657c">把意图、模拟事实与表现分开观察</text><rect x="40" y="140" width="300" height="150" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="60" y="174" font-size="21" font-weight="700">输入意图</text><text x="60" y="205" font-size="17">向前输入 = 1</text><text x="60" y="232" font-size="17">希望冲刺 / 希望跳跃</text><text x="60" y="259" font-size="17">属于命令</text><rect x="410" y="140" width="300" height="150" rx="12" fill="#e1f2eb" stroke="#b9cbdf"/><text x="430" y="174" font-size="21" font-weight="700">实际模拟状态</text><text x="430" y="205" font-size="17">碰撞后速度可能为 0</text><text x="430" y="232" font-size="17">地面 / 基座 / 移动模式</text><text x="430" y="259" font-size="17">属于运动事实</text><rect x="780" y="140" width="300" height="150" rx="12" fill="#fff0d9" stroke="#b9cbdf"/><text x="800" y="174" font-size="21" font-weight="700">动画表现</text><text x="800" y="205" font-size="17">选择姿态与混合权重</text><text x="800" y="232" font-size="17">脚部 IK / 身体朝向</text><text x="800" y="259" font-size="17">属于骨骼呈现</text><path d="M340,205 L410,205" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M710,205 L780,205" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="365" width="1040" height="140" rx="12" fill="#ffffff" stroke="#b9cbdf"/><text x="60" y="399" font-size="21" font-weight="700">例子：持续顶墙</text><text x="60" y="430" font-size="17">输入仍然非零，但胶囊体实际位移接近零。</text><text x="60" y="457" font-size="17">动画既可能需要“启动意图”，也需要“真实速度”；不要用一个变量替代全部状态。</text></g></svg>