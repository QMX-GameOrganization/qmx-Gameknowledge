<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">GASP 滑行转换：迟滞区避免反复切换</title><desc id="desc">按实际 Evaluate 引脚绘制 · 比较的是 ProposedMove 的水平速度</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536d88"/></marker></defs><rect width="1120" height="670" rx="18" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#16314d"><text x="42" y="54" font-size="28" font-weight="700">GASP 滑行转换：迟滞区避免反复切换</text><text x="42" y="88" font-size="17" fill="#4f657c">按实际 Evaluate 引脚绘制 · 比较的是 ProposedMove 的水平速度</text><rect x="40" y="140" width="460" height="125" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="60" y="174" font-size="21" font-weight="700">Walking → Sliding</text><text x="60" y="205" font-size="17">水平提案速度 &gt; 380</text><text x="60" y="232" font-size="17">AND 蹲伏 Gameplay Tag 为真</text><rect x="620" y="140" width="460" height="125" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="640" y="174" font-size="21" font-weight="700">Sliding → Walking</text><text x="640" y="205" font-size="17">水平提案速度 &lt;= 200</text><text x="640" y="232" font-size="17">OR CharacterMover.IsCrouching() 为假</text><path d="M500,200 L620,200" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="330" width="1040" height="120" rx="12" fill="#e1f2eb" stroke="#b9cbdf"/><text x="60" y="364" font-size="21" font-weight="700">200 &lt; 速度 &lt;= 380：进入和退出不是同一个阈值</text><text x="60" y="395" font-size="17">保持蹲伏时，刚进入这个区间不会仅因速度条件立即触发相反转换。</text><text x="60" y="422" font-size="17">转换是否被调用，还取决于模式实例的 Transitions 配置和状态机执行。</text><rect x="40" y="490" width="1040" height="115" rx="12" fill="#ffffff" stroke="#b9cbdf"/><text x="60" y="524" font-size="21" font-weight="700">蓝图定位</text><text x="60" y="555" font-size="17">BP_MovementTransition_ToSlide.Evaluate / BP_MovementTransition_FromSlide.Evaluate</text><text x="60" y="582" font-size="17">阈值来自未连接的常量引脚；连接引脚上的默认值不代表运行时输入。</text></g></svg>