<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc"><title id="title">CMC 与 Mover：职责如何组织</title><desc id="desc">源码机制示意 · 省略网络角色分支与具体碰撞细节</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536d88"/></marker></defs><rect width="1120" height="720" rx="18" fill="#f4f7fc"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#16314d"><text x="42" y="54" font-size="28" font-weight="700">CMC 与 Mover：职责如何组织</text><text x="42" y="88" font-size="17" fill="#4f657c">源码机制示意 · 省略网络角色分支与具体碰撞细节</text><rect x="40" y="125" width="490" height="86" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="60" y="159" font-size="21" font-weight="700">CMC：以角色组件协调运动</text><text x="60" y="190" font-size="17">ACharacter + UCharacterMovementComponent</text><rect x="590" y="125" width="490" height="86" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="610" y="159" font-size="21" font-weight="700">Mover：组件 + 模拟 + 后端</text><text x="610" y="190" font-size="17">Pawn + CharacterMover（继承 Mover）</text><rect x="40" y="250" width="490" height="110" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="60" y="284" font-size="21" font-weight="700">PerformMovement</text><text x="60" y="315" font-size="17">输入 / 外力 / 根运动 / 状态协调</text><rect x="590" y="250" width="490" height="110" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="610" y="284" font-size="21" font-weight="700">Backend → KinematicActorSimulation</text><text x="610" y="315" font-size="17">输入命令 + 起始状态 → 推进一个模拟步</text><rect x="40" y="400" width="490" height="110" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="60" y="434" font-size="21" font-weight="700">StartNewPhysics → Phys*</text><text x="60" y="465" font-size="17">Walking / Falling / Custom 等运动分支</text><rect x="590" y="400" width="490" height="110" rx="12" fill="#e1edff" stroke="#b9cbdf"/><text x="610" y="434" font-size="21" font-weight="700">MovementModeStateMachine</text><text x="610" y="465" font-size="17">Mode + Layered Move + Modifier / Effect</text><rect x="40" y="550" width="490" height="110" rx="12" fill="#e1f2eb" stroke="#b9cbdf"/><text x="60" y="584" font-size="21" font-weight="700">实际运动与状态更新</text><text x="60" y="615" font-size="17">碰撞 / 地面 / 基座 / 网络预测重放</text><rect x="590" y="550" width="490" height="110" rx="12" fill="#e1f2eb" stroke="#b9cbdf"/><text x="610" y="584" font-size="21" font-weight="700">同步状态 → FinalizeFrame</text><text x="610" y="615" font-size="17">实际运动 / 回滚恢复 / 游戏世界结果提交</text><path d="M285,211 L285,250" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M285,360 L285,400" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M285,510 L285,550" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M835,211 L835,250" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M835,360 L835,400" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M835,510 L835,550" stroke="#536d88" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g></svg>