<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">游戏 AI 的分层感知过滤</title>
<desc id="desc">视野查询从空间候选开始，依次经过阵营状态、距离、角度和射线过滤，最后得到少量可见目标。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4773a9"/></marker></defs>
<rect width="1000" height="430" rx="20" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="47" font-size="27" font-weight="700" fill="#15263e">感知查询：昂贵判断应该放在最后</text>
<text x="40" y="78" font-size="16" fill="#52657d">每一层都减少候选，射线和业务评分只处理已经通过前置过滤的对象。</text>
<g stroke="#4773a9" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M180 190H235"/><path d="M375 190H430"/><path d="M570 190H625"/><path d="M765 190H820"/></g>
<g>
<rect x="40" y="140" width="140" height="100" rx="14" fill="#eaf2ff" stroke="#4773a9"/><text x="110" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4f86">空间候选</text><text x="110" y="207" text-anchor="middle" font-size="14" fill="#52657d">网格 / AABB</text>
<rect x="235" y="140" width="140" height="100" rx="14" fill="#edf8f4" stroke="#3d8a72"/><text x="305" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#216b56">硬过滤</text><text x="305" y="207" text-anchor="middle" font-size="14" fill="#52657d">阵营、状态、距离</text>
<rect x="430" y="140" width="140" height="100" rx="14" fill="#fff3df" stroke="#b4772f"/><text x="500" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#8c5315">方向判断</text><text x="500" y="207" text-anchor="middle" font-size="14" fill="#52657d">点积、视野角</text>
<rect x="625" y="140" width="140" height="100" rx="14" fill="#f1ecff" stroke="#7259a8"/><text x="695" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#5b458c">遮挡确认</text><text x="695" y="207" text-anchor="middle" font-size="14" fill="#52657d">Raycast / ShapeCast</text>
<rect x="820" y="140" width="140" height="100" rx="14" fill="#ffecef" stroke="#b25570"/><text x="890" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#933a59">决策</text><text x="890" y="207" text-anchor="middle" font-size="14" fill="#52657d">排序、锁定、行动</text>
</g>
<g fill="#52657d" font-size="14"><text x="110" y="290" text-anchor="middle">1000 个对象</text><text x="305" y="290" text-anchor="middle">200 个候选</text><text x="500" y="290" text-anchor="middle">30 个候选</text><text x="695" y="290" text-anchor="middle">5 个候选</text><text x="890" y="290" text-anchor="middle">1 个目标</text></g>
<path d="M40 330H960" stroke="#c7d3e1" stroke-width="2"/>
<text x="500" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#52657d">过滤顺序同时决定性能、结果稳定性和调试路径</text>
</g></svg>