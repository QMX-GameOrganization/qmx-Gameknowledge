<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">游戏客户端的帧预算分配</title>
<desc id="desc">展示一帧中主线程、感知、寻路、AI 和提交工作的预算，以及跨帧继续执行的任务。</desc>
<rect width="1000" height="470" rx="20" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="40" y="47" font-size="27" font-weight="700" fill="#15263e">分帧执行：把峰值工作摊到多个可控的时间片</text>
<text x="40" y="78" font-size="16" fill="#52657d">固定总预算比“每个系统都尽快完成”更容易保持最差帧稳定。</text>
<text x="45" y="140" font-size="17" font-weight="700" fill="#52657d">本帧</text>
<g><rect x="120" y="108" width="150" height="54" rx="10" fill="#eaf2ff" stroke="#4773a9"/><rect x="280" y="108" width="120" height="54" rx="10" fill="#edf8f4" stroke="#3d8a72"/><rect x="410" y="108" width="180" height="54" rx="10" fill="#fff3df" stroke="#b4772f"/><rect x="600" y="108" width="130" height="54" rx="10" fill="#f1ecff" stroke="#7259a8"/><rect x="740" y="108" width="150" height="54" rx="10" fill="#ffecef" stroke="#b25570"/></g>
<g font-size="15" text-anchor="middle"><text x="195" y="141" fill="#1d4f86">输入与状态</text><text x="340" y="141" fill="#216b56">脏集合</text><text x="500" y="141" fill="#8c5315">查询与计算</text><text x="665" y="141" fill="#5b458c">AI 决策</text><text x="815" y="141" fill="#933a59">提交表现</text></g>
<path d="M120 185H890" stroke="#95a7bc" stroke-width="3"/>
<g stroke="#95a7bc" stroke-width="2" stroke-dasharray="6 6"><path d="M280 185V300"/><path d="M500 185V300"/><path d="M730 185V300"/></g>
<text x="45" y="235" font-size="17" font-weight="700" fill="#52657d">下一帧</text>
<g><rect x="120" y="205" width="220" height="54" rx="10" fill="#fff" stroke="#4773a9"/><rect x="360" y="205" width="180" height="54" rx="10" fill="#fff" stroke="#3d8a72"/><rect x="560" y="205" width="260" height="54" rx="10" fill="#fff" stroke="#b4772f"/></g>
<g font-size="15" text-anchor="middle"><text x="230" y="238" fill="#1d4f86">继续寻路请求</text><text x="450" y="238" fill="#216b56">远处感知</text><text x="690" y="238" fill="#8c5315">剩余查询和缓存更新</text></g>
<g fill="#52657d" font-size="14"><text x="120" y="340">每个任务需要有保存位置、取消条件、失效版本和结果提交点。</text><text x="120" y="370">测量平均帧之外，还要记录最差帧、P95/P99、GC Alloc 和等待时间。</text></g>
</g></svg>