<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532" viewBox="0 0 1000 532" role="img" aria-labelledby="title desc">
<title id="title">一回合：用真实数值追踪调用链</title><desc id="desc">目标：最大生命值 100，护甲 8；治疗不受护甲影响。。护甲规则是本例的教学约定；真实项目先明确需求再实现。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="532" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">一回合：用真实数值追踪调用链</text>
<text x="32" y="77" font-size="17" fill="#495b73">目标：最大生命值 100，护甲 8；治疗不受护甲影响。</text>
<rect x="32" y="105" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="137" font-size="20" font-weight="700" fill="#285caa">开始：hp = 100</text>
<text x="48" y="170" font-size="17" fill="#23364e">Slash 原始伤害 20</text>
<text x="48" y="196" font-size="17" fill="#23364e">护甲减去 8</text>
<text x="48" y="222" font-size="17" fill="#23364e">实际伤害 12</text>
<path d="M322 177H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="105" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="137" font-size="20" font-weight="700" fill="#176951">斩击后：hp = 88</text>
<text x="374" y="170" font-size="17" fill="#23364e">Fireball 原始伤害 35</text>
<text x="374" y="196" font-size="17" fill="#23364e">护甲减去 8</text>
<text x="374" y="222" font-size="17" fill="#23364e">实际伤害 27</text>
<path d="M648 177H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="105" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="137" font-size="20" font-weight="700" fill="#8c5315">火球后：hp = 61</text>
<text x="700" y="170" font-size="17" fill="#23364e">Heal 请求恢复 25</text>
<text x="700" y="196" font-size="17" fill="#23364e">空间 100 - 61 = 39</text>
<text x="700" y="222" font-size="17" fill="#23364e">实际恢复 25</text>
<rect x="32" y="281" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="313" font-size="20" font-weight="700" fill="#285caa">技能：表达效果</text>
<text x="48" y="346" font-size="17" fill="#23364e">DamageSkill / HealSkill</text>
<text x="48" y="372" font-size="17" fill="#23364e">不直接写生命值字段</text>
<text x="48" y="398" font-size="17" fill="#23364e">取得实际生效量</text>
<path d="M322 353H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="281" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="313" font-size="20" font-weight="700" fill="#176951">角色：维护合法状态</text>
<text x="374" y="346" font-size="17" fill="#23364e">takeDamage / heal</text>
<text x="374" y="372" font-size="17" fill="#23364e">边界和溢出检查</text>
<text x="374" y="398" font-size="17" fill="#23364e">最终 hp = 86</text>
<path d="M648 353H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="281" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="313" font-size="20" font-weight="700" fill="#8c5315">流程：负责次序</text>
<text x="700" y="346" font-size="17" fill="#23364e">不区分具体技能类别</text>
<text x="700" y="372" font-size="17" fill="#23364e">输出施放日志</text>
<text x="700" y="398" font-size="17" fill="#23364e">断言验证输出与边界</text>
<text x="32" y="512" font-size="16" fill="#495b73">护甲规则是本例的教学约定；真实项目先明确需求再实现。</text></g></svg>