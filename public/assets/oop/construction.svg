<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532" viewBox="0 0 1000 532" role="img" aria-labelledby="title desc">
<title id="title">初始化与赋值：时间和约束不同</title><desc id="desc">创建成功就应得到合法角色，不依赖调用方记住 init。。类成员未提供所需初始化时，不应指望进入函数体再补救。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="532" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">初始化与赋值：时间和约束不同</text>
<text x="32" y="77" font-size="17" fill="#495b73">创建成功就应得到合法角色，不依赖调用方记住 init。</text>
<rect x="32" y="105" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="137" font-size="20" font-weight="700" fill="#285caa">① 参数进入构造</text>
<text x="48" y="170" font-size="17" fill="#23364e">Actor(name, maxHp)</text>
<text x="48" y="196" font-size="17" fill="#23364e">输入表示创建需求</text>
<text x="48" y="222" font-size="17" fill="#23364e">构造函数没有返回类型</text>
<path d="M322 177H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="105" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="137" font-size="20" font-weight="700" fill="#176951">② 初始化成员</text>
<text x="374" y="170" font-size="17" fill="#23364e">name_(name)</text>
<text x="374" y="196" font-size="17" fill="#23364e">maxHp_(maxHp)</text>
<text x="374" y="222" font-size="17" fill="#23364e">hp_(maxHp)</text>
<path d="M648 177H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="105" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="137" font-size="20" font-weight="700" fill="#8c5315">③ 执行函数体</text>
<text x="700" y="170" font-size="17" fill="#23364e">校验业务条件</text>
<text x="700" y="196" font-size="17" fill="#23364e">成功则完成对象创建</text>
<text x="700" y="222" font-size="17" fill="#23364e">失败抛异常，不交付对象</text>
<rect x="32" y="281" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="313" font-size="20" font-weight="700" fill="#285caa">初始化列表</text>
<text x="48" y="346" font-size="17" fill="#23364e">直接建立成员初始状态</text>
<text x="48" y="372" font-size="17" fill="#23364e">适合 const / 引用成员</text>
<text x="48" y="398" font-size="17" fill="#23364e">顺序按成员声明</text>
<path d="M322 353H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="281" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="313" font-size="20" font-weight="700" fill="#176951">函数体赋值</text>
<text x="374" y="346" font-size="17" fill="#23364e">成员已先按规则初始化</text>
<text x="374" y="372" font-size="17" fill="#23364e">再执行已有对象赋值</text>
<text x="374" y="398" font-size="17" fill="#23364e">不能补绑引用成员</text>
<path d="M648 353H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="281" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="313" font-size="20" font-weight="700" fill="#8c5315">explicit</text>
<text x="700" y="346" font-size="17" fill="#23364e">保留显式创建</text>
<text x="700" y="372" font-size="17" fill="#23364e">阻止不希望的隐式转换</text>
<text x="700" y="398" font-size="17" fill="#23364e">不等于禁止正常复制</text>
<text x="32" y="512" font-size="16" fill="#495b73">类成员未提供所需初始化时，不应指望进入函数体再补救。</text></g></svg>