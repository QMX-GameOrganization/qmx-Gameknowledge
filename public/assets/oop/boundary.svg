<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532" viewBox="0 0 1000 532" role="img" aria-labelledby="title desc">
<title id="title">封装：让不变量有一个负责的边界</title><desc id="desc">不变量示例：0 ≤ hp ≤ maxHp；非法输入不能悄悄破坏状态。。private 只是访问控制；真正的封装还需要操作维护业务约束。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="532" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">封装：让不变量有一个负责的边界</text>
<text x="32" y="77" font-size="17" fill="#495b73">不变量示例：0 ≤ hp ≤ maxHp；非法输入不能悄悄破坏状态。</text>
<rect x="32" y="105" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="137" font-size="20" font-weight="700" fill="#285caa">规则分散</text>
<text x="48" y="170" font-size="17" fill="#23364e">攻击代码直接写 hp</text>
<text x="48" y="196" font-size="17" fill="#23364e">陷阱代码直接写 hp</text>
<text x="48" y="222" font-size="17" fill="#23364e">UI 调试也能写 hp</text>
<path d="M322 177H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="105" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="137" font-size="20" font-weight="700" fill="#176951">调用方各自检查</text>
<text x="374" y="170" font-size="17" fill="#23364e">治疗上限可能漏掉</text>
<text x="374" y="196" font-size="17" fill="#23364e">负伤害可能变成治疗</text>
<text x="374" y="222" font-size="17" fill="#23364e">修改规则要到处搜索</text>
<path d="M648 177H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="105" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="137" font-size="20" font-weight="700" fill="#8c5315">维护成本增长</text>
<text x="700" y="170" font-size="17" fill="#23364e">每个写入点都要懂内部</text>
<text x="700" y="196" font-size="17" fill="#23364e">语法能通过不代表合法</text>
<text x="700" y="222" font-size="17" fill="#23364e">Bug 随修改点扩散</text>
<rect x="32" y="281" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="313" font-size="20" font-weight="700" fill="#285caa">外部只表达意图</text>
<text x="48" y="346" font-size="17" fill="#23364e">takeDamage(amount)</text>
<text x="48" y="372" font-size="17" fill="#23364e">heal(amount)</text>
<text x="48" y="398" font-size="17" fill="#23364e">hp() 只读查询</text>
<path d="M322 353H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="281" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="313" font-size="20" font-weight="700" fill="#176951">Actor 维护规则</text>
<text x="374" y="346" font-size="17" fill="#23364e">private hp_ / maxHp_</text>
<text x="374" y="372" font-size="17" fill="#23364e">校验输入</text>
<text x="374" y="398" font-size="17" fill="#23364e">先比较，再做有界运算</text>
<path d="M648 353H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="281" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="313" font-size="20" font-weight="700" fill="#8c5315">得到可靠结果</text>
<text x="700" y="346" font-size="17" fill="#23364e">返回实际扣血 / 治疗量</text>
<text x="700" y="372" font-size="17" fill="#23364e">日志与 UI 使用同一结果</text>
<text x="700" y="398" font-size="17" fill="#23364e">规则变化集中验证</text>
<text x="32" y="512" font-size="16" fill="#495b73">private 只是访问控制；真正的封装还需要操作维护业务约束。</text></g></svg>