<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532" viewBox="0 0 1000 532" role="img" aria-labelledby="title desc">
<title id="title">面向对象：把规则、变化与寿命串起来</title><desc id="desc">贯穿例子：角色受伤 → 多种技能 → 统一施放 → 安全释放。。目标：说清每个类为何存在，而不只记住三大特性。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="532" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">面向对象：把规则、变化与寿命串起来</text>
<text x="32" y="77" font-size="17" fill="#495b73">贯穿例子：角色受伤 → 多种技能 → 统一施放 → 安全释放。</text>
<rect x="32" y="105" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="137" font-size="20" font-weight="700" fill="#285caa">已有基础</text>
<text x="48" y="170" font-size="17" fill="#23364e">vector：保存一组数据</text>
<text x="48" y="196" font-size="17" fill="#23364e">map：按键查询</text>
<text x="48" y="222" font-size="17" fill="#23364e">算法：完成计算</text>
<path d="M322 177H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="105" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="137" font-size="20" font-weight="700" fill="#176951">对象边界</text>
<text x="374" y="170" font-size="17" fill="#23364e">哪些状态必须合法？</text>
<text x="374" y="196" font-size="17" fill="#23364e">谁可以修改它？</text>
<text x="374" y="222" font-size="17" fill="#23364e">调用方需要知道什么？</text>
<path d="M648 177H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="105" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="137" font-size="20" font-weight="700" fill="#8c5315">变化与协作</text>
<text x="700" y="170" font-size="17" fill="#23364e">角色维护数值规则</text>
<text x="700" y="196" font-size="17" fill="#23364e">技能提供可替换行为</text>
<text x="700" y="222" font-size="17" fill="#23364e">流程控制施放顺序</text>
<rect x="32" y="281" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="313" font-size="20" font-weight="700" fill="#285caa">C++ 语义</text>
<text x="48" y="346" font-size="17" fill="#23364e">值复制 / 移动</text>
<text x="48" y="372" font-size="17" fill="#23364e">构造 / 析构 / RAII</text>
<text x="48" y="398" font-size="17" fill="#23364e">拥有 / 借用</text>
<path d="M322 353H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="281" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="313" font-size="20" font-weight="700" fill="#176951">用需求检验</text>
<text x="374" y="346" font-size="17" fill="#23364e">添加治疗技能</text>
<text x="374" y="372" font-size="17" fill="#23364e">保持战斗循环不变</text>
<text x="374" y="398" font-size="17" fill="#23364e">检查成本和失败边界</text>
<path d="M648 353H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="281" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="313" font-size="20" font-weight="700" fill="#8c5315">迁移到 C#</text>
<text x="700" y="346" font-size="17" fill="#23364e">class 赋值复制引用</text>
<text x="700" y="372" font-size="17" fill="#23364e">GC 与 Dispose 分开</text>
<text x="700" y="398" font-size="17" fill="#23364e">再连接 Unity 与 ECS</text>
<text x="32" y="512" font-size="16" fill="#495b73">目标：说清每个类为何存在，而不只记住三大特性。</text></g></svg>