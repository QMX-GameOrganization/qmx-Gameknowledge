<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="532" viewBox="0 0 1000 532" role="img" aria-labelledby="title desc">
<title id="title">this 与 const：函数操作哪一个对象</title><desc id="desc">相同成员函数定义可被不同实例使用，各自访问对应状态。。Actor&amp; 返回当前对象可链式调用；返回局部引用会悬空。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#66758d"/></marker></defs>
<rect width="1000" height="532" rx="18" fill="#f6f8fc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="32" y="44" font-size="27" font-weight="700" fill="#15263e">this 与 const：函数操作哪一个对象</text>
<text x="32" y="77" font-size="17" fill="#495b73">相同成员函数定义可被不同实例使用，各自访问对应状态。</text>
<rect x="32" y="105" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="137" font-size="20" font-weight="700" fill="#285caa">hero.setLevel(3)</text>
<text x="48" y="170" font-size="17" fill="#23364e">this 指向 hero</text>
<text x="48" y="196" font-size="17" fill="#23364e">参数 level = 3</text>
<text x="48" y="222" font-size="17" fill="#23364e">this-&gt;level 是成员</text>
<path d="M322 177H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="105" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="137" font-size="20" font-weight="700" fill="#176951">hero 的成员状态</text>
<text x="374" y="170" font-size="17" fill="#23364e">level 变为 3</text>
<text x="374" y="196" font-size="17" fill="#23364e">不是修改所有 Actor</text>
<text x="374" y="222" font-size="17" fill="#23364e">不是给参数自身赋值</text>
<path d="M648 177H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="105" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="137" font-size="20" font-weight="700" fill="#8c5315">enemy 的成员状态</text>
<text x="700" y="170" font-size="17" fill="#23364e">仍保留自己的 level</text>
<text x="700" y="196" font-size="17" fill="#23364e">没有被这次调用修改</text>
<text x="700" y="222" font-size="17" fill="#23364e">除非明确共享或别名</text>
<rect x="32" y="281" width="284" height="144" rx="12" fill="#eaf2ff" stroke="#285caa" stroke-opacity=".3"/>
<text x="48" y="313" font-size="20" font-weight="700" fill="#285caa">const Actor&amp; view</text>
<text x="48" y="346" font-size="17" fill="#23364e">借用同一个 hero</text>
<text x="48" y="372" font-size="17" fill="#23364e">不创建角色副本</text>
<text x="48" y="398" font-size="17" fill="#23364e">通过该视图只读</text>
<path d="M322 353H350" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="358" y="281" width="284" height="144" rx="12" fill="#e8f7f1" stroke="#176951" stroke-opacity=".3"/>
<text x="374" y="313" font-size="20" font-weight="700" fill="#176951">view.getLevel()</text>
<text x="374" y="346" font-size="17" fill="#23364e">调用 const 成员函数</text>
<text x="374" y="372" font-size="17" fill="#23364e">可以读取普通成员</text>
<text x="374" y="398" font-size="17" fill="#23364e">不承诺线程安全</text>
<path d="M648 353H676" stroke="#66758d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="684" y="281" width="284" height="144" rx="12" fill="#fff2df" stroke="#8c5315" stroke-opacity=".3"/>
<text x="700" y="313" font-size="20" font-weight="700" fill="#8c5315">view.setLevel(9)</text>
<text x="700" y="346" font-size="17" fill="#23364e">非 const 修改操作</text>
<text x="700" y="372" font-size="17" fill="#23364e">编译器拒绝这次调用</text>
<text x="700" y="398" font-size="17" fill="#23364e">对象其他别名另有规则</text>
<text x="32" y="512" font-size="16" fill="#495b73">Actor&amp; 返回当前对象可链式调用；返回局部引用会悬空。</text></g></svg>