<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="480" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">ANM2 到蒙皮顶点：解码与合成流水线</text>

  <rect x="30" y="56" width="190" height="84" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="125" y="80" text-anchor="middle" fill="#0c4a6e" font-weight="bold">① 容器头 32B</text>
  <text x="125" y="102" text-anchor="middle" fill="#0c4a6e" font-size="12">版本 / 帧数 / 轨道数 / 页数</text>
  <text x="125" y="122" text-anchor="middle" fill="#0c4a6e" font-size="12">+ 轨道描述符 u32 × N</text>

  <rect x="260" y="56" width="190" height="84" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="355" y="80" text-anchor="middle" fill="#0c4a6e" font-weight="bold">② 页表与压缩帧</text>
  <text x="355" y="102" text-anchor="middle" fill="#0c4a6e" font-size="12">页 0x10000 字节，页内表严格递增</text>
  <text x="355" y="122" text-anchor="middle" fill="#0c4a6e" font-size="12">整数帧解码，二阶预测积分</text>

  <rect x="490" y="56" width="190" height="84" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="585" y="80" text-anchor="middle" fill="#0c4a6e" font-weight="bold">③ 每轨每帧 9 分量</text>
  <text x="585" y="102" text-anchor="middle" fill="#0c4a6e" font-size="12">rot(Cayley) ×3 / pos ×3 / scl ×3</text>
  <text x="585" y="122" text-anchor="middle" fill="#0c4a6e" font-size="12">全部 float32，逐帧有限性审计</text>

  <rect x="720" y="56" width="150" height="84" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="795" y="80" text-anchor="middle" fill="#78350f" font-weight="bold">④ Cayley→四元数</text>
  <text x="795" y="102" text-anchor="middle" fill="#78350f" font-size="12">s=x²+y²+z²</text>
  <text x="795" y="122" text-anchor="middle" fill="#78350f" font-size="12">q=(2r, 1−s)/(1+s)</text>

  <line x1="220" y1="98" x2="258" y2="98" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="450" y1="98" x2="488" y2="98" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="680" y1="98" x2="718" y2="98" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect x="30" y="190" width="250" height="96" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="155" y="214" text-anchor="middle" fill="#78350f" font-weight="bold">⑤ 轨道 → 骨骼：名字哈希</text>
  <text x="155" y="238" text-anchor="middle" fill="#78350f" font-size="12">v = 0；对每字符 小写后 v = byte(c) + 41·v</text>
  <text x="155" y="258" text-anchor="middle" fill="#78350f" font-size="12">uint32 回绕；与轨道描述符匹配</text>
  <text x="155" y="276" text-anchor="middle" fill="#78350f" font-size="12">0xCCC3CDDF 为 MotionAccumulator 特殊轨</text>

  <rect x="320" y="190" width="250" height="96" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="445" y="214" text-anchor="middle" fill="#78350f" font-weight="bold">⑥ 局部 TRS 替换绑定姿态</text>
  <text x="445" y="238" text-anchor="middle" fill="#78350f" font-size="12">匹配到的轨道替换绑定局部矩阵</text>
  <text x="445" y="258" text-anchor="middle" fill="#78350f" font-size="12">未匹配的节点保留绑定局部矩阵</text>
  <text x="445" y="276" text-anchor="middle" fill="#78350f" font-size="12">Global = ParentGlobal × Local</text>

  <rect x="610" y="190" width="260" height="96" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="740" y="214" text-anchor="middle" fill="#14532d" font-weight="bold">⑦ 线性混合蒙皮 LBS</text>
  <text x="740" y="238" text-anchor="middle" fill="#14532d" font-size="12">Skin = AnimatedGlobal × Reference</text>
  <text x="740" y="258" text-anchor="middle" fill="#14532d" font-size="12">Reference 即节点 +48 的逆绑定矩阵</text>
  <text x="740" y="276" text-anchor="middle" fill="#14532d" font-size="12">v' = Σ w_k · Skin_k · v</text>

  <line x1="795" y1="140" x2="795" y2="165" stroke="#475569" stroke-width="1.6"/>
  <line x1="795" y1="165" x2="155" y2="165" stroke="#475569" stroke-width="1.6"/>
  <line x1="155" y1="165" x2="155" y2="188" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="280" y1="238" x2="318" y2="238" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="570" y1="238" x2="608" y2="238" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- verification -->
  <rect x="30" y="320" width="840" height="130" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="450" y="346" text-anchor="middle" fill="#334155" font-weight="bold">每一步都有独立验证，而不是“看着对”</text>
  <text x="50" y="372" fill="#334155" font-size="13">• 骨架：BindGlobal × Reference 与单位矩阵最大误差 1.46e-6（Jade 206 节点）</text>
  <text x="50" y="394" fill="#334155" font-size="13">• 解码：6846 份 ANM2 全库审计，1277889 个整数帧全部有限；另有 12 个损坏负例必须被拒绝</text>
  <text x="50" y="416" fill="#334155" font-size="13">• 蒙皮：Blender 结果与独立 CPU LBS 全帧最大坐标差 2.9e-6 m；GLB 缓冲验收阈值 1e-4 m</text>
  <text x="50" y="438" fill="#334155" font-size="13">• 范围声明：只说“结构解码通过”，不说“与原引擎姿态完全一致”</text>
</svg>
