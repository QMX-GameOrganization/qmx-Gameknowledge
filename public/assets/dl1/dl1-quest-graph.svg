<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="450" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">任务阶段图：顺序、并行 AND/OR、叶节点（以 __Voltage_helper_02 为例）</text>

  <rect x="30" y="56" width="840" height="46" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="450" y="84" text-anchor="middle" fill="#0c4a6e" font-weight="bold">SequenceNode：按顺序推进，当前阶段完成后才进入下一个（同 Tick 可连续完成即时阶段）</text>

  <rect x="30" y="140" width="190" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="125" y="166" text-anchor="middle" fill="#14532d" font-weight="bold">started quest guard</text>
  <text x="125" y="188" text-anchor="middle" fill="#14532d" font-size="12">前置任务状态门</text>

  <rect x="260" y="140" width="190" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="355" y="166" text-anchor="middle" fill="#14532d" font-weight="bold">go to</text>
  <text x="355" y="188" text-anchor="middle" fill="#14532d" font-size="12">带符号半径的距离判断</text>

  <rect x="490" y="130" width="190" height="200" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="585" y="154" text-anchor="middle" fill="#78350f" font-weight="bold">ParallelNode（OR）</text>
  <rect x="505" y="172" width="160" height="62" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="585" y="198" text-anchor="middle" fill="#78350f" font-size="13">Path1: talk(Blake)</text>
  <text x="585" y="216" text-anchor="middle" fill="#64748b" font-size="11">未复原，抛未支持</text>
  <rect x="505" y="246" width="160" height="62" rx="6" fill="#ffffff" stroke="#d97706"/>
  <text x="585" y="272" text-anchor="middle" fill="#78350f" font-size="13">Path2: started quest guard</text>
  <text x="585" y="290" text-anchor="middle" fill="#64748b" font-size="11">(Voltage)</text>

  <rect x="720" y="140" width="150" height="70" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="795" y="166" text-anchor="middle" fill="#374151" font-weight="bold">checkpoint</text>
  <text x="795" y="188" text-anchor="middle" fill="#6b7280" font-size="12">涉及存档层级，未复原</text>

  <line x1="220" y1="175" x2="258" y2="175" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="450" y1="175" x2="488" y2="175" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="680" y1="175" x2="718" y2="175" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="30" y="236" width="440" height="94" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="250" y="260" text-anchor="middle" fill="#334155" font-weight="bold">两个门：started guard 判断（State 0/1/2）</text>
  <text x="48" y="284" fill="#334155" font-size="12.5">requiresNonzero = started || startedButNotFinished</text>
  <text x="48" y="304" fill="#334155" font-size="12.5">if ((State != 0) != requiresNonzero) return false</text>
  <text x="48" y="322" fill="#334155" font-size="12.5">return finished ? State == 2 : (!startedButNotFinished || State != 2)</text>

  <rect x="30" y="350" width="840" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="450" y="376" text-anchor="middle" fill="#334155" font-size="13">AND：每条路径都必须更新，不能用短路的 All；OR：教学策略按声明顺序更新，第一个完成者取消其余路径</text>
  <text x="450" y="398" text-anchor="middle" fill="#334155" font-size="13">叶节点完成后记住结果，已执行的动作不重复；Cancel 只通知活动叶，清理由宿主负责</text>
  <text x="450" y="416" text-anchor="middle" fill="#64748b" font-size="12">原引擎同 Tick 的调度顺序与 OR 取消副作用尚无实测，属教学设计</text>
</svg>
