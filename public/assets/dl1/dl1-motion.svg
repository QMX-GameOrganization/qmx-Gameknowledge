<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="900" height="460" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">运动提交链：提供者决定“想要什么”，物理体决定“实际得到什么”</text>

  <!-- providers -->
  <text x="30" y="62" font-weight="bold" fill="#334155">玩法层（gamedll）</text>
  <rect x="30" y="72" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="140" y="94" text-anchor="middle" fill="#0c4a6e">动画运动增量 ÷ dt</text>
  <text x="140" y="112" text-anchor="middle" fill="#0c4a6e" font-size="12">AnimBind 采样 → 速度</text>
  <rect x="30" y="132" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="140" y="154" text-anchor="middle" fill="#0c4a6e">模块给的速度/目标位置</text>
  <text x="140" y="172" text-anchor="middle" fill="#0c4a6e" font-size="12">含游戏层速度平滑</text>
  <rect x="30" y="192" width="220" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="140" y="214" text-anchor="middle" fill="#0c4a6e">跳跃模块：高度 + 一次性向量</text>
  <text x="140" y="232" text-anchor="middle" fill="#0c4a6e" font-size="12">目标Y = 当前Y + 高度</text>

  <rect x="290" y="112" width="190" height="90" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="385" y="138" text-anchor="middle" fill="#78350f" font-weight="bold">选择来源并提交</text>
  <text x="385" y="160" text-anchor="middle" fill="#78350f" font-size="12">局部速度 → 世界向量</text>
  <text x="385" y="180" text-anchor="middle" fill="#78350f" font-size="12">Walk 槽 +0x2d0 提交速度</text>
  <text x="385" y="196" text-anchor="middle" fill="#78350f" font-size="12">+0x300 / +0x310 提交加/减速</text>

  <line x1="250" y1="97" x2="288" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="250" y1="157" x2="288" y2="157" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="250" y1="217" x2="288" y2="175" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- engine -->
  <text x="530" y="62" font-weight="bold" fill="#334155">引擎层（物理体 Walk/Fly）</text>
  <rect x="520" y="72" width="350" height="170" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="695" y="98" text-anchor="middle" fill="#14532d" font-weight="bold">每个物理步</text>
  <text x="540" y="124" fill="#14532d" font-size="13">1. 世界速度 → 逆旋转到 body 局部坐标</text>
  <text x="540" y="146" fill="#14532d" font-size="13">2. 三个局部轴各自趋近目标（加速步长/减速步长）</text>
  <text x="540" y="168" fill="#14532d" font-size="13">3. 预测速度 = V + (累计力 − 附着力) · dt/m</text>
  <text x="540" y="190" fill="#14532d" font-size="13">4. 驱动力 = (Vtarget − 预测速度) · m/dt</text>
  <text x="540" y="212" fill="#14532d" font-size="13">5. AddForce 提交；接触/台阶/坡角在接触回调里处理</text>
  <line x1="480" y1="157" x2="518" y2="157" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- unity teaching -->
  <rect x="30" y="274" width="840" height="150" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="450" y="300" text-anchor="middle" fill="#334155" font-weight="bold">教学版映射（Unity C#）</text>
  <rect x="50" y="316" width="150" height="46" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="125" y="344" text-anchor="middle" fill="#334155" font-size="13">PlayerInputReader</text>
  <rect x="250" y="316" width="150" height="46" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="325" y="344" text-anchor="middle" fill="#334155" font-size="13">PlayerMotionLesson</text>
  <rect x="450" y="316" width="160" height="46" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="530" y="337" text-anchor="middle" fill="#334155" font-size="13">MotionRequest</text>
  <text x="530" y="353" text-anchor="middle" fill="#64748b" font-size="11">readonly struct 快照</text>
  <rect x="660" y="316" width="190" height="46" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="755" y="337" text-anchor="middle" fill="#334155" font-size="13">IMotionReceiver.Step</text>
  <text x="755" y="353" text-anchor="middle" fill="#64748b" font-size="11">WalkVelocitySolver</text>
  <line x1="200" y1="339" x2="248" y2="339" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="400" y1="339" x2="448" y2="339" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="610" y1="339" x2="658" y2="339" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="450" y="394" text-anchor="middle" fill="#334155" font-size="13">发送方不持有速度状态；接收方持有位置/速度，并只向外暴露结果</text>
  <text x="450" y="412" text-anchor="middle" fill="#64748b" font-size="12">碰撞后端未选定，不能把 CharacterController 或单个 Rigidbody 当作等价实现</text>
</svg>
